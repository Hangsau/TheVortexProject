name: Sync Vortex content to my-site

# Vortex 內容變動推到 master 後，直接 checkout my-site hugo-source、執行其
# sync_vortex.py，再把有變動的公開資料推回。hugo-source 的 deploy workflow
# 會接手建置 Pages。不能依賴 repository_dispatch，因為 GitHub 只會從目標
# repo 的預設分支載入該事件，而 cortex 的同步 workflow 位於 hugo-source。
#
# 只在實際會影響 my-site 的路徑變動時觸發（避免 Talos 個人協作檔等無關 commit）。
#
# 需要 secret: MYSITE_DISPATCH_TOKEN（GitHub PAT，scope: repo）

on:
  push:
    branches: [master]
    paths:
      - 'canonical/**'
      - 'Drills/**'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TheVortexProject
        uses: actions/checkout@v4
        with:
          path: TheVortexProject

      - name: Checkout my-site
        uses: actions/checkout@v4
        with:
          repository: Hangsau/cortex
          ref: hugo-source
          token: ${{ secrets.MYSITE_DISPATCH_TOKEN }}
          path: my-site
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependency
        run: pip install pyyaml

      - name: Sync public Vortex data
        env:
          VORTEX_SRC: ${{ github.workspace }}/TheVortexProject
          HUGO_ROOT: ${{ github.workspace }}/my-site
        run: python my-site/tools/sync_vortex.py

      - name: Commit changed public data
        working-directory: my-site
        run: |
          git config user.name "vortex-sync-bot"
          git config user.email "noreply@github.com"
          git add data/ content/
          if git diff --cached --quiet; then
            echo "No public content changes."
            exit 0
          fi
          git commit -m "sync(vortex): update from TheVortexProject@${GITHUB_SHA}"
          git push origin hugo-source
