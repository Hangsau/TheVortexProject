# ============================================================
# Canonical 知識結構 — 發展領域 / 族群特異化考量
# ------------------------------------------------------------
# 單一真相源。my-site 與 swim-coach 將從此檔讀取族群差異化 IP。
#
# 範圍：青少年、Masters、女性、開放水域、Adaptive（Paralympic）五個族群
# 為什麼分出來：matrix.yaml 的 4 支柱 × 5 階段是針對 mainstream lifecycle
# pathway 的縱向發展軸；本檔處理橫向的族群差異——不同族群在同一個發展
# 階段有不同的優先序、風險、訓練約束。兩者正交、互補。
#
# 確定性：🔵推導 🟢近期文獻 🟡舊文獻 🟠教練觀測 🔴待查
# ============================================================

domain: development
sub: populations
schema_version: 1

populations:

  # ════ 青少年 Adolescent ════
  - id: pop.adolescent
    name_zh: 青少年泳者
    age_range: "11–18 歲"
    public:
      summary: 青少年泳者的訓練主軸是「保護骨骼長期健康 + 控制過度使用傷害 + 防止能量不足症候群」三件事同時並行——這個階段做錯的事不會在當下發病，會在二十年後算總帳。
      points:
        - "**訓練量上限規範**：USA Swimming 建議 11–14 歲每週 4–6 次（每次 60–90 分鐘）、13–18 歲每週 6–10 次（每次 90–120 分鐘）。過早專項化只建議給 14+ 歲的菁英軌跡選手——量化指標：每週泳次和持續時間是這年齡層 overuse injury 的最佳預測因子。"
        - "**骨骼礦物質密度（BMD）的非承重悖論**：游泳是非承重運動，青少年泳者的 BMD 明顯低於跑者等承重運動員。30 歲前的累積決定終生骨架——這族群必須加入承重運動（衝刺、跳躍、阻力訓練），每週 3+ 次、10–20 分鐘為門檻；同時補足每日 1,300 mg 鈣 + 維生素 D。這不是 nice-to-have，是長期健康保護。"
        - "**生長板的相對脆弱**：青春期生長板比周圍韌帶肌腱還脆弱，肌肉成長速度跟不上骨骼成長造成短期柔軟度下降。重訓不能用大人的處方——著重多角度、低負重、增強式訓練，避免單一肌群高負荷壓垮成長中的肌腱接點。"
        - "**女性運動員三聯徵與 RED-S 篩查**：青少年女子泳者 disordered eating 盛行率 25–31%、月經失調 3–65%。能量不足會直接拖垮表現，但更嚴重的是骨架受損與生育系統受影響的長期成本。教練要建立早期能量平衡監測與營養諮詢——不是等選手「掉成績」才反應，而是定期問飲食與生理週期。"
    swim_application_zh: "🔵 swim-coach 青少年模組：① 訓練量自動以 USA Swimming guidelines 為上限警示；② 課表自動建議 3×/週承重補強；③ 提供 RED-S 篩查問卷模板；④ 月經週期紀錄欄位作為負荷調整參考。"
    links: {stages: [l2t, t2t, t2c], pillars: [physical, life]}

  # ════ Masters 成人持續訓練族群 ════
  - id: pop.masters
    name_zh: Masters 成人泳者
    age_range: "成年後持續訓練（無上限）"
    public:
      summary: Masters 不是年紀大的少年選手——他們的訓練史、身體史、生活約束都不同。處方核心：在不重複過度使用傷害的前提下維持表現與健康，而非追求逐年突破。
      points:
        - "**死亡率對照數據**：13 年追蹤 40,547 成人，泳者死亡率 1.9%、跑者 6.6%、走路 7.8%、久坐 11%。Masters 游泳是現存證據最強的長壽運動之一——這是教練面對成年學員時最值得反覆強調的長期動機。"
        - "**水溫對訓練容忍度的關鍵性**：≤27°C 適合高有氧量訓練；≥28°C 心率控制困難，訓練品質下降。冷水對退化性關節炎與關節置換復健有獨特優勢——水溫管理直接決定 Masters 能承受的訓練量。"
        - "**單調高量易致 overuse**：Masters 肩部累積數十年使用，已逼近 tendinopathy 邊緣，傳統高碼數重複組對他們是慢性傷害。處方改成混合模態（蛙鞋、手掌板、技術 drill、陸上肌力交替）——同樣的有氧效益但分散關節負荷。"
        - "**藥物與訓練的相互作用**：β-blocker 直接降低無氧能力；部分藥物與 ATP 生成酶競爭。Masters 處方時要主動詢問用藥、與醫師協調訓練配速與營養（如訓練中簡單醣補充）。這是 Masters 教練必備技能，不是專科知識。"
        - "**脊椎狹窄等地面活動受限族群的水中優勢**：水中浮力提供陸上無法達成的核心訓練機會。長軸泳式（自由式/仰式）對核心穩定有益；短軸（蝶/蛙）對腰椎屈伸需求大、可能加重症狀——選泳式要看個案脊椎狀況。"
    swim_application_zh: "🔵 swim-coach Masters 模組：① 課表強制混合模態（單一動作禁超過 30% 課量）；② 水溫紀錄欄位影響強度建議；③ 用藥清單影響配速與營養模組；④ 退化性疾病列表決定泳式優先序。"
    links: {stages: [t2w], pillars: [physical, mental, life]}

  # ════ 女性泳者 ════
  - id: pop.female
    name_zh: 女性泳者
    age_range: "初經至停經（青少年 + 成人）"
    public:
      summary: 女性泳者特異性的核心是 ① 能量平衡與荷爾蒙週期 ② 鐵質代謝 ③ 口服避孕藥對表現的影響。三者都常被低估，且都會直接吃掉長期表現。
      points:
        - "**能量分佈與週期化**：女子菁英泳者重訓期 3,000–4,500 kcal、減量期 2,000–4,000 kcal——能量攝入必須隨訓練週期變動，不能維持固定值。睡前大量補的「backloading」即使總量足夠也會擾亂胰島素與生理時鐘——能量要均勻分散在整天。"
        - "**慢性能量赤字的反直覺結果**：節食的女子泳者瘦肉量下降比脂肪量更多——力量與爆發力流失但體脂率反而上升。「瘦＝快」是迷思，慢性能量赤字會同時毀掉力量與身體成分。"
        - "**鐵質缺乏的高盛行率**：女子運動員 11–41% 鐵質缺乏；女子泳者素食傾向 + 維生素 C 攝入低 = 鐵吸收雙重抑制。處方：硫酸亞鐵 + 500 mg vitamin C 同服；避免咖啡因同時段。即使把每日鐵攝入從 20 mg 倍增到 40 mg，仍有 50% 鐵蛋白 <20 ng/mL——這是慢性疲勞的隱性主因。"
        - "**口服避孕藥對 VO₂max 的影響**：三相 OC 可降 VO₂max 10–11%（交感神經激活減弱）。低劑量配方（少 30–40% 荷爾蒙）副作用較小；雌激素對運動後肌肉損傷有保護作用。選手應與醫師討論配方選擇，特別是賽前。"
        - "**生理週期的訓練應用**：黃體期溫度升高 0.3–0.5°C，對熱壓力環境（如熱身池、夏季戶外）影響顯著；卵泡期是力量訓練窗口、黃體期是有氧基礎窗口——這是 evidence emerging 但已足以納入個別化處方。"
    swim_application_zh: "🔵 swim-coach 女性模組：① 月經週期紀錄影響每週負荷建議；② 鐵蛋白年度監測提醒；③ OC 使用紀錄影響 VO₂max baseline 校準；④ 能量平衡欄位整合 RED-S 篩查。"
    links: {stages: [t2t, t2c, t2w], pillars: [physical, life]}

  # ════ 開放水域泳者 Open Water ════
  - id: pop.open_water
    name_zh: 開放水域泳者
    age_range: "成人為主；青少年可介入但有專門考量"
    public:
      summary: 開放水域不是池泳加長距——它是一套不同的技術-生理-策略體系。三大特異化軸：① 雙側對稱划水（影響觀景與蛇行）② 比賽配速划頻（明顯高於池泳長距）③ 冷水適應（無捷徑）。
      points:
        - "**對稱划水是觀景效率的前提**：雙側划水不對稱會增加抬頭觀景頻率。10K 比賽抬頭約 400 次、頭重 10 磅 → 累計 4,000 磅腰頸負荷。對稱划水訓練可以把觀景頻率降到一半以下——這比優化單次抬頭技術回報大得多。"
        - "**比賽划頻高於池泳長距**：男子 5–25K 平均 41+ cycles/min、女子 43+；衝刺時可達 45–50。同等距離的池泳長距男子 41–42、女子 47–48——開放水域選手用更高頻補開放水域的擾流。增加 5–10 SPM 通常直接拉升速度。"
        - "**訓練距離須超出比賽距離的 buffer**：短距開放水賽事訓練到比賽距離的 130%；馬拉松級 60–80%。原因是不可控變因——冷水、洋流、浪況——會吃掉預備容量。挑戰超馬（>20 英里）前必須有 6–8 小時實境水溫訓練。"
        - "**冷水適應無捷徑**：凡士林、潤滑膏、急速適應都無效。最短 14–21 天規律暴露才能建立耐受度。一致性比強度重要——每天 15 分鐘冷水比一週一次 2 小時有用。熱水適應（雪杯、冰浴、減踢）用的是不同機制、時間成本較低。"
        - "**核心是觀景時的承重結構**：抬頭觀景時核心若不夠強，髖部下沉、身體蛇行；強核心讓觀景成為短暫破水而非姿勢崩潰。陸上核心訓練優先序高於肌力其他項目。"
    swim_application_zh: "🔵 swim-coach 開放水域模組：① 自動推薦對稱性 drill 序列（單臂、shoulder tap）；② 划頻訓練處方對應目標賽事距離；③ 冷水適應 21 天倒數計時與紀錄；④ 觀景技術 drill 內建。"
    links: {stages: [t2t, t2c, t2w], pillars: [physical, technical, mental]}

  # ════ Adaptive / Paralympic 泳者 ════
  - id: pop.adaptive
    name_zh: Adaptive / Paralympic 泳者
    age_range: "全年齡"
    public:
      summary: Adaptive 泳者的處方核心不是「修正」殘障、而是按個別 functional class 的力學特性優化策略。每個障別（S1–S14）有不同的最佳 stroke rate × stroke length 組合，跨類別 one-size-fits-all 是錯的。
      points:
        - "**水下速度是起跳時間的最強預測因子（跨所有級別）**：S10（最輕障別）與 Olympic 泳者水下速度相近（約 3 m/s）；S8、S9 因 streamline 維持困難，水下速度低 40–50%。流線與水下減阻訓練回報遠大於離台時間訓練。"
        - "**Stroke rate vs Stroke length 的級別差異**：S8–S9 對划頻高度敏感（r = −0.51 至 −0.78）、對划距相對不敏感（r < −0.13）；S7 中度依賴划距（−0.42 至 −0.50）；S10 高度依賴划距（−0.78 至 −0.88）。處方必須按級別個別化——「拉長划距」對 S8–S9 是錯誤建議。"
        - "**腦性麻痺泳者的技術退化曲線**：CP 選手約 30 秒後技術系統性退化，這是神經肌肉控制特性、不是體能不足。比賽策略要在前段保留——降低初期強度以保末段技術維持，而非追求恆速。同時對技術的剛性追求要放鬆，目標是「stroke profile 維持」而非「動作標準」。"
        - "**脊髓損傷選手的固定髖屈攣縮**：長期坐輪椅造成髖屈攣縮可達 90°，俯臥泳式正面阻力大、仰式因軀幹控制不足更困難。每日髖屈肌伸展是必要、不是選項；俯臥訓練用 pull buoy 補償腿位。不介入會走到髖關節囊外科釋放手術。"
        - "**菁英 Paralympic 年進步率 1–2% vs Olympic 1%**：個體間變異 1.2–3.7%（race-to-race CoV）、賽會內變異約 1%。Paralympic 選手要保持競爭力必須每年 1–2% 進步——比 Olympic 更陡的軌跡反映出該族群訓練環境尚未完全優化，反過來說也是進步空間最大的族群。"
    swim_application_zh: "🔵 swim-coach Adaptive 模組：① 自動依 functional class（S1–S14）調整 SR/SL 處方；② CP 級別自動使用「保留前段」配速模板；③ SCI 自動加入每日髖屈伸展提醒；④ 進步率追蹤目標按級別動態設定。"
    links: {stages: [t2t, t2c, t2w], pillars: [physical, technical, mental, life]}

# ── 跨族群共通原則 ──
cross_cutting_principles:
  - id: pop.principle.individual_first
    title: 族群分類是出發點不是終點
    text_zh: "族群（青少年/Masters/女性/開放水/Adaptive）是處方的起點，不是答案。每個族群內部變異很大——青少年裡有早熟與晚熟、Masters 裡有訓練史長短不同、Adaptive 裡有 S1 與 S14。族群分類提供風險與機會的初始判斷，但實際處方仍須個別化。最危險的錯誤是把族群分類當成標籤套用 cookie-cutter 訓練。"
  - id: pop.principle.bidirectional_application
    title: 族群洞察的雙向適用
    text_zh: "族群特異性的觀察很多時候也適用於其他族群。Masters 的混合模態建議對所有易受 overuse 影響的人都適用；女性的鐵質代謝知識讓教練對男性選手的隱性鐵缺乏也更敏感；Adaptive 的 SR/SL 級別差異提醒了所有泳者都該按個人力學特性處方——不存在跨人通用的 stroke profile。"
  - id: pop.principle.pillar_intersection
    title: 族群與 ADM 支柱的交叉檢視
    text_zh: "本檔的族群差異要與 matrix.yaml 的 4 支柱（physical/technical/mental/life）交叉檢視。例如 Masters 的「藥物相互作用」橫跨 physical 與 life；女性的「能量分佈」橫跨 physical 與 life；青少年的「RED-S 篩查」是 life 支柱在該族群的特化。任何族群進入特定 ADM 階段時，應同時檢查該階段該支柱的族群特化內容。"
