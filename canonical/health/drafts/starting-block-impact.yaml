  contested:
    - claim: "腦震盪在游泳的發生率估計"
      consensus_source: "高中數據腦震盪為最常見游泳/跳水傷型"
      dissent_source: "『>50% 泳池傷害為頭部』來源不明，二手引用不應視為流病數據"
  vintage_warning: false

