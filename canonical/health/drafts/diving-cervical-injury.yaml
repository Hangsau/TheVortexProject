flags:
  pending_verification:
    - "美國跳水致脊髓損傷年度人數、永久癱比例及水深 <6 英尺的病例比例，原始登記資料待查；C5 占 60.9% 的原始全文數值待查。已確認的 57% 水深 <4 英尺出自 DeVivo 與 Sekar 1997，入院 55% AIS A 出自 Ull 等人 2021"
  contested:
    - claim: "各組織最低水深標準不一致"
      consensus_source: "禁止淺水跳水、陌生水域腳先入水為強烈共識"
      dissent_source: "FINA/World Aquatics 1.35m(競賽) vs 美紅十字 2.74m(一般跳水)——適用情境不同"
  vintage_warning: true       # 大量流病數據 1990–2015，近年出發台設計改良但缺近期高品質登記

