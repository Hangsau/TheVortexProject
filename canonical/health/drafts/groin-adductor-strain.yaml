  - { citation: "Breaststroke groin injury (Grote 2004), AJSM PMID 14754731", certainty: 🟡, verified: false, source_ids: [src.grote-2004] }
  - { citation: "Thorborg K. (2023). Current Clinical Concepts: Exercise and Load Management of Adductor Strains, Adductor Ruptures, and Long-Standing Adductor-Related Groin Pain. J Athl Train 58(7-8):589-601. PMID 35834724 / PMC10569248（2026-09-04 取代原「Adductor strengthening / load management (Coast Sport)」——後者為診所網頁、無 URL 無作者無年份、不可重取）", certainty: 🟢, verified: true, source_ids: [src.thorborg-2023-adductor-exercise-load-management] }
  - { citation: "Harøy J, Clarsen B, Wiger EG, et al. (2019). The Adductor Strengthening Programme prevents groin problems among male football players: a cluster-randomised controlled trial. Br J Sports Med 53(3):150-157. PMID 29891614（族群為男性足球員，非泳者；終點為 OSTRC 自述問題盛行率，非失訓傷害發生率）", certainty: 🟢, verified: true, source_ids: [src.haroy-2019-adductor-strengthening-programme] }

flags:
  pending_verification:
    - "Grote 2004 全文未開啟(42.7%/6.92% 數字)；Copenhagen meta-analysis(PMC8486394/PMC12363431)為摘要層級；作者全名/DOI 待 W3"
  contested:
    - claim: "Copenhagen 是否足以預防蛙泳者傷害"
      consensus_source: "Copenhagen 顯著提升內收肌力"
      dissent_source: "季節性傷害預防統計不顯著，依從性為關鍵(PMC12363431 2025 摘要)。且唯一的高品質預防試驗(Harøy 2019, PMID 29891614)族群為男性足球員、終點為自述問題盛行率而非失訓傷害，蛙泳的水中閉鏈內收肌負荷型態與足球差異大，不得直接外推"
  vintage_warning: true

