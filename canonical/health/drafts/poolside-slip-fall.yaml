id: poolside-slip-fall
zh: 池畔濕滑跌倒傷
en: Poolside slip-and-fall injuries
category: E-acute-trauma
environment: [pool]
sport_variant: [swim]
layer: [public, clinical]
subtypes: [跌倒頭部撞擊, 保護性跌倒骨折(腕/髖), 軟組織挫傷裂傷]

structures: [頭/腦, 腕(橈骨遠端), 髖(股骨頸), 尾椎/骨盆, 肘, 皮膚軟組織]
mechanism:
  summary: 池畔濕磁磚/混凝土摩擦係數驟降——ANSI/NFSI B101.1 把**濕態**靜摩擦係數（wet SCOF）分三級：≥ 0.60 高抓地力、0.40–0.60 中等、< 0.40 低抓地力；泳池濕區常落在低抓地力級距，赤足+水膜形成近似潤滑層。失去抓地→滑倒。跌倒生物力學分兩型：向後/側滑頭枕部直接撞硬面（腦震盪/顱內出血）；伸手保護性跌倒（FOOSH）力沿前臂傳致橈骨遠端骨折（Colles），或側髖著地致股骨頸骨折（高齡）。奔跑/嬉戲放大速度與衝量。
  trigger_phase: 出入水梯、起跳台周邊、淋浴更衣濕區、嬉戲奔跑、提重物失衡
  who: 兒童（奔跑嬉戲）、高齡泳者（平衡/骨密度↓）、視覺受限（泳鏡起霧/摘鏡）、地面排水不良場館

epidemiology:
  prevalence: "池畔滑倒本身**沒有可引用的發生率數字**——原寫的『美國每年約 35 萬件泳池傷害、60% 為滑倒』是二手引用、原始登記查不到，維持不進任何層。可引用的是跌倒**後果**：台灣 ≥60 歲髖骨折住院者年死亡率 1999 年 18.10% → 2009 年 13.98%（健保資料庫 n=143,595）；台灣髖骨折術後族群整體一年死亡率 16.8%（n=5,442，已排除住院中死亡者）；亞太區系統回顧的一年死亡率自新加坡 10.8% 至紐西蘭 23.8%（142 研究 / 1,139,752 人）。以上皆為一般高齡族群，非游泳專屬。"
  certainty: 🟡
  evidence_grade: B
  caveat: >-
    **2026-08-17 來源健檢結果，兩處更正**：
    ① 原寫「高齡髖骨折後一年死亡率 20–30%」，其唯一引用 `src.falls-and-hip-fracture-mortality-pmid` 的顯示字串
    本身就寫著「待補具體 PMID」——那是佔位字串，不是文獻。改查真實文獻後發現該數字**對本專案讀者族群偏高約 1.5–2 倍**：
    台灣兩份健保資料庫研究給出 13.98–18.10%（粗年死亡率）與 16.8%（術後一年），
    亞太區統合分析則顯示亞洲約為澳紐的一半。20–30% 大致是澳紐等西方族群的上緣。已改寫為分地區、附樣本數的敘述。
    ② 原寫「乾混凝土靜摩擦約 0.6（ASTM 建議濕地最低標）」屬張冠李戴——ASTM F2508 規範的是
    **步道摩擦計如何校驗**，從未訂定任何摩擦係數門檻；0.60／0.40 的分級出自 **ANSI/NFSI B101.1** 且全是**濕態**值，
    不能用來描述乾混凝土。已改為正確歸屬與正確的濕態語意。
    餘下限制不變：池畔滑倒缺乏獨立流病登記，多併入一般跌倒或泳池傷害統計；摩擦係數依材質／清潔／量測法差異大。
  sources:
    - "ANSI/NFSI B101.1（2009 初版 / 2022 改版）Test Method for Measuring Wet SCOF of Common Hard-Surface Floor Materials——濕態 SCOF 分級門檻的正確出處"
    - "ASTM F2508-23 Standard Practice for Validation of Walkway Tribometry Using Research-based Reference Materials——**摩擦計校驗規範，不含門檻值**"
    - "Wang CB, et al. (2013). Excess mortality after hip fracture among the elderly in Taiwan. Bone 56(1):147–153. PMID 23727435"
    - "Lee TC, et al. (2017). One-Year Readmission Risk and Mortality after Hip Fracture Surgery: A National Population-Based Study in Taiwan. Aging Dis 8(4):402–409. PMID 28840055"
    - "Harvey LA, et al. (2024). Variation in mortality following hip fracture across the Asia Pacific region. Arch Gerontol Geriatr 126:105519. PMID 38941947"
  source_ids: [src.ansi-nfsi-b101-1, src.astm-f2508, src.wang-2013-taiwan-hip-fracture-mortality, src.lee-2017-taiwan-hip-fracture-1yr-mortality, src.harvey-2024-asia-pacific-hip-fracture-mortality]

risk_factors:
  - { text: "濕滑硬質地面（濕態 SCOF < 0.40，ANSI/NFSI B101.1 低抓地力級距）", grade: A }
  - { text: "赤足+水膜", grade: B }
  - { text: "奔跑嬉戲（兒童）", grade: B }
  - { text: "高齡（平衡退化+骨質疏鬆）", grade: B }
  - { text: "視覺受限（泳鏡起霧/近視摘鏡）", grade: Expert }
  - { text: "場館排水不良/無防滑處理", grade: B }

prevention:
  - { text: "池畔防滑表面（粗糙磁磚/防滑塗層，目標為濕態 SCOF ≥ 0.60 的高抓地力級距）", grade: A }
  - { text: "『池畔禁跑』規則與監督（尤兒童）", grade: B }
  - { text: "良好排水避免積水", grade: B }
  - { text: "高齡泳者防滑鞋/扶手輔助出入水", grade: Expert }
  - { text: "充足照明與濕區警示標示", grade: Expert }

management:
  red_flags:
    - "頭部著地後意識改變/持續嘔吐/抽搐/瞳孔不等 → 顱內出血疑慮，緊急就醫"
    - "腕/髖跌倒後變形/無法承重/劇痛 → 骨折疑慮，固定就醫影像"
    - "高齡跌倒後髖/鼠蹊痛無法站立 → 股骨頸骨折，勿勉強行走"
  acute: "頭部撞擊依腦震盪流程評估，紅旗症狀緊急送醫。橈骨遠端骨折：固定+冰敷+抬高+影像（多需復位）。股骨頸骨折：勿移動患肢、保暖、EMS（高齡常需手術）。軟組織挫傷裂傷 RICE+傷口加壓清創。尾椎挫傷對症止痛+坐墊"
  pain_rules: ~
  rehab: "骨折後依固定/手術方式漸進負重與關節活動度；高齡須併跌倒預防與肌力平衡訓練"
  functional_progression_criteria:
    - "腦震盪：依分級協議無症狀回場"
    - "橈骨遠端骨折：影像癒合（一般 6 週）+腕關節活動度恢復"
    - "股骨頸骨折：骨科評估負重進展"
  swim_modifications_in_rehab: ~
  return_to_train: "依傷型癒合（腦震盪逐步/骨折影像確認）後回水"
  return_to_compete: "完成回場標準且無症狀 → 復賽"
  prognosis: "輕度挫傷數日恢復；橈骨遠端骨折多良好；高齡股骨頸骨折預後較差（台灣資料一年死亡率約 14–17%，併發症與失能風險高；西方族群報告可達 23% 上下，地區差異大，引用時須連地區一起說）；頭部撞擊視傷情而定"

population_notes:
  age:
    youth: "奔跑嬉戲滑倒為兒童池畔主要傷因"
    adult_beginner: ~
    masters: "高齡跌倒骨折（髖/腕）後果最嚴重，預防最關鍵"
  sex: ~
  ability:
    para: "行動輔具使用者出入水濕區風險高，需無障礙防滑設計"
  lifecycle: ~

