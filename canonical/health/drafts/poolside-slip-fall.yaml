flags:
  pending_verification:
    - "『美國每年約 35 萬件泳池傷害、60% 為滑倒』為二手引用，原始登記（CPSC/NEISS?）作者/年份/DOI 待查；不進 public 數字"
    - "『濕磁磚摩擦係數低至 0.3』的具體量測來源查不到，已於 2026-08-17 自 mechanism 撤除，改用 ANSI/NFSI B101.1 的 <0.40 低抓地力級距表述"
  contested:
    - claim: "髖骨折一年死亡率"
      consensus_source: "高齡髖骨折後死亡率顯著升高為骨科共識（台灣 SMR 一年 9.67，Wang 2013）"
      dissent_source: "絕對數字地區差異極大：亞太區系統回顧自新加坡 10.8% 至紐西蘭 23.8%，亞洲約為澳紐一半（Harvey 2024）；舊稿的 20–30% 是西方族群上緣，不適用台灣讀者"
  vintage_warning: false

