  - { citation: "Skin Cancer Risk, Sun-Protection Knowledge and Behavior in Athletes — Narrative Review, Cancers 2023, PMC10339925", certainty: 🟢, verified: true }
  - { citation: "Occupational Solar Radiation at Different Latitudes and Pterygium systematic review, PMC5800136", certainty: 🟢, verified: true }
  - { citation: "Ultraviolet Light and Skin Cancer in Athletes, PMC3445124", certainty: 🟢, verified: true }

