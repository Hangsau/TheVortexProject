flags:
  pending_verification:
    - "台灣本土創傷弧菌年感染人數無公開登記；水母螫傷無任何族群層級發生率數據——兩者為文獻空白，非待查"
  contested:
    - claim: "水母螫傷急救沖洗液（醋 vs 海水 vs 淡水）"
      consensus_source: "勿用淡水（滲透壓變化觸發未放電刺絲胞）——此點各地急救指引一致"
      dissent_source: >-
        「箱型水母用醋」的證據層級**低於原本記載**：它出自體外刺絲胞抑制實驗與地區急救指引推論，
        **不是臨床試驗結論**，原文寫成「為共識」屬高估（2026-08-17 修正）。
        Cochrane 2013 年版另有相反方向的發現：醋或嫩肉粉相較熱水**使皮膚外觀更差**（RR 0.31, CI 0.14–0.72）；
        2023 年版對所有局部外用皆判定無法確定有效性。急救法仍為種屬特異，無單一通則。
  vintage_warning: false

