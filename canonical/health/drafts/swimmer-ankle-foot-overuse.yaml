id: swimmer-ankle-foot-overuse
zh: 游泳者踝/足過度使用傷
en: Swimmer's ankle & foot overuse
category: B-lower-spine-strokespecific
environment: [pool]
sport_variant: [swim]
layer: [public, clinical]
subtypes: [趾伸肌腱病, 外/後側踝應力, 蹠骨應力/足底筋膜問題]

structures: [趾伸肌腱, 尺側/外側踝韌帶, 蹠骨, 足底筋膜]
mechanism:
  summary: 三條路徑——①趾伸肌腱病:蛙/自由式踢腿反覆踝背屈、腳踢板及蛙鞋使用對前足踝背側趾伸肌腱牽拉(蛙鞋槓桿加大前掌受力為催化)；②外/後側踝應力:翻滾轉身腳板接觸不準致踝扭傷、蛙鞋過用致外側踝骨髓水腫；③蹠骨應力骨折/足底筋膜問題:罕見個案，與推蹬牆及高頻踢腿有關。游泳屬非承重運動，踝足傷害最不常見(約佔整體傷害 1%)。
  trigger_phase: 蛙鞋訓練、腳踢板、蛙泳踢腿
  who: 過用蛙鞋者、快速增量者、翻滾轉身技術不良者

epidemiology:
  prevalence: >-
    游泳踝足的專項發生率**目前沒有可引用的來源**。
    可對照的是 Trikha 等 2022（NCAA D1 泳者 641 人、1030 件健康事件）：
    足／踝／小腿佔肌肉骨骼傷害 **15.0%（81/540）**，排名第三。
    蛙鞋相關僅有個案報告（外側踝骨髓水腫、趾伸支持帶水腫，皆為青少年女性精英個案）。
  certainty: 🔵
  evidence_grade: C
  caveat: >-
    2026-08-18 更正（來源解除）：原引「踝部佔游泳整體傷害約 1%」出自 radiologykey.com，
    該站是教科書章節的未授權轉載、無作者／年份／書名，**不可引用，已解除**；
    該 1% 數字因此成為孤兒數字，且與 Trikha 2022 的 15.0% 相差一個量級（分組定義不同，
    不構成嚴格反證，但足以說明不可再引用）。
    另：Vasiliadis 等 2018 的游泳應力性骨折回顧**主題是肋骨，不是踝足**，
    不能拿來支撐本條目的踝足流行率。
    幾乎全靠個案報告與推斷，無控制研究；公開呈現須明標證據等級低；蛙鞋安全劑量無 RCT。
  sources:
    - "Trikha R, et al. (2022). Characterizing Health Events and Return to Sport in Collegiate Swimmers. Orthop J Sports Med 10(4):23259671221083588. PMID 35400141"
  source_ids: [src.trikha-2022-collegiate-swimmer-health-events]

risk_factors:
  - { text: "蛙鞋過用/尺寸不合", grade: Expert }
  - { text: "快速增加踢腿量", grade: Expert }
  - { text: "腳踢板強迫踝背屈", grade: Expert }
  - { text: "翻滾轉身技術不良", grade: Expert }
  - { text: "踝背屈活動度不足", grade: C }

prevention:
  - { text: "限制蛙鞋持續使用量", grade: Expert }
  - { text: "選擇合適蛙鞋尺寸", grade: Expert }
  - { text: "逐步增加踢腿量", grade: Expert }
  - { text: "改善翻滾轉身技術", grade: Expert }
  - { text: "踝部伸展與強化", grade: Expert }

management:
  red_flags:
    - "足部急性腫脹 → 就醫(排除應力骨折)"
    - "趾伸肌腱異音/脫位感 → 就醫"
    - "足底/踝神經症狀 → 就醫(排除跗骨管症候群)"
  acute: "休息(停蛙鞋)、冰敷；輕微趾伸肌腱病夾板 1–2 週"
  pain_rules: "蛙鞋訓練後前足背輕痛隔日消退 → 減蛙鞋量、評估合適度；持續痛或骨壓痛 → 停蛙鞋、影像排除應力骨折"
  rehab: "趾伸肌腱病以踝趾屈/背屈漸進阻力；足底問題以足內在肌強化+小腿拉伸；翻滾轉身技術重建"
  functional_progression_criteria:
    - "前足背無痛"
    - "踝背屈 ROM 正常"
    - "無痛踢腿 100 m"
  swim_modifications_in_rehab:
    - "停蛙鞋改裸腳踢腿"
    - "翻滾暫改開放式轉身"
  return_to_train: "趾伸肌腱病 2–6 週保守有效；應力骨折按影像癒合 6–12 週"
  return_to_compete: "無痛踢腿達標後回賽"
  prognosis: "通常良好；因低衝擊運動，減蛙鞋/腳踢板即顯著改善"

population_notes:
  age:
    youth: "高強度蛙鞋訓練的青少年精英最多個案報告"
    adult_beginner: "翻滾轉身技術不良踝扭傷風險較高"
    masters: "臨床觀察有趾伸肌腱病，大型數據缺"
  sex:
    female: "無特定數據"
    male: ~
  ability:
    para: "截肢者殘肢/假肢力學完全不同，標準評估不適用(DATA GAP)"
  lifecycle: ~

links:
  mechanism_link: "翻滾轉身腳板接觸不準與推蹬牆是同一組負荷來源，急性端見於轉身/蹬牆傷"
  mechanism_link_ids: [flip-turn-wall-push]
  technical_link: "starts-turns.tech.38 翻滾啟動時機、starts-turns.tech.21 觸牆膝屈 100–120°、starts-turns.tech.22 推蹬力向量對齊——對應風險因子「翻滾轉身技術不良」"
  technical_link_ids: [starts-turns.tech.38, starts-turns.tech.21, starts-turns.tech.22]
  perception_link: ~
  perception_link_ids: []

