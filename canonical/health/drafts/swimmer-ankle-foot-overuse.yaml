  - { citation: "Trikha R, Schroeder GG, Greig DE, Kremen TJ Jr (2022). Characterizing Health Events and Return to Sport in Collegiate Swimmers. Orthop J Sports Med 10(4):23259671221083588. PMID 35400141", certainty: 🟢, verified: true, source_ids: [src.trikha-2022-collegiate-swimmer-health-events] }
  - { citation: "Vasiliadis AV, Lampridis V, Georgiannos D, Bisbinas I. (2018). Swimmers Are At Risk For Stress Fractures? A Systematic Review. Int J Kinesiol Sports Sci 6(3):25-31（主題為肋骨，非踝足；僅作對照。2026-09-04 更正標題：原寫「Stress fractures in swimmers: systematic review」為改寫非原題）", certainty: 🟡, verified: true, source_ids: [src.stress-fractures-in-swimmers-systematic-revi] }

flags:
  pending_verification:
    - "趾伸肌腱病 2–6 週恢復(NHS Lanarkshire)、個案影像數據為摘要/小樣本待 W3"
    - "『踝部佔游泳整體傷害約 1%』——原引用(radiologykey)已解除，此數字目前無來源，不得進 public"
  contested:
    - claim: "游泳是否『保護』踝足"
      consensus_source: "普遍認為低衝擊極少傷"
      dissent_source: "蛙鞋個案報告挑戰此說，但無大規模研究翻轉；蛙鞋效益 vs 風險無安全劑量 RCT"
  vintage_warning: false

