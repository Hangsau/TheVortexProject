  contested:
    - claim: "是否僅冷水致病"
      consensus_source: "冷水暴露為主要致病因子"
      dissent_source: "暖水衝浪者小樣本(n=23)盛行率仍近 70%，暗示機械衝擊或其他因素，結論需審慎"
  vintage_warning: false

