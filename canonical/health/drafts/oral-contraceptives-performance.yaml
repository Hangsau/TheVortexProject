id: oral-contraceptives-performance
zh: 口服避孕藥對運動表現的影響
en: Oral contraceptives and athletic performance
category: D-endocrine
environment: [pool, open_water]
sport_variant: [swim]
layer: [public, clinical]

structures: [下視丘-腦下垂體-性腺軸, 雌激素受體, 心血管自主神經, 骨代謝, 肌肉修復]
mechanism:
  summary: >-
    口服避孕藥（OC）抑制內源性雌激素與黃體素的週期性波動，改以外源合成荷爾蒙維持相對穩定濃度。
    **可測到的表現影響比一般想像小得多，而且集中在單一指標上。**
    目前最直接的證據是一項雙盲安慰劑對照 RCT（Lebrun 2003，**n = 14** 名 VO₂max ≥ 50 ml/kg/min 的高訓練量女性）：
    使用三相型 OC 後 **VO₂max 下降 4.7%**（安慰劑組 +1.5%），皮脂厚度總和顯著上升。
    **但同一研究直接測量的無氧速度、有氧耐力（90% VO₂max 力竭時間）、等速肌力、最大通氣量、心率、血比容全部沒有顯著差異。**
    拉到族群層級，涵蓋 42 篇研究、590 名受試者的系統回顧與統合分析（Elliott-Sale 2020）結論是：
    OC 使用者的表現**平均可能略遜於自然月經週期女性，但群體層級效果極可能是微不足道的（trivial）**，
    且研究間變異大、83% 的納入研究品質為中等以下；作者明言
    **「現有證據不足以支持對 OC 使用與否給出通則性建議」，應採個別化評估**。
    該分析另指出**表現在 OC 週期內各時點是一致的**。
    〔2026-08-17 更正：舊稿寫「VO₂max 降 10–11%（範圍 6–15%）」，實測值是 4.7%，
    舊數字疑似誤讀 Lebrun 文中「兩名受試者下降 4 與 9 ml/kg/min」的絕對值；一併撤除。〕
  driver: "劑量/配方型別與影響強度的高低排序（三相型 > 單相型 > 低劑量）在現有文獻中**尚未建立**——Lebrun 2003 只測了三相型一種配方，Elliott-Sale 2020 指出納入研究配方混雜且異質性高，無法據以排序。此欄保留為待驗證問題，不作為選配方的依據。"
  trigger_phase: 尚無證據指出特定距離或項目受影響較大（見 swim_context）
  who: 服用 OC 的女性選手（尤其高訓練量者）；以及在未與教練/運科溝通的情況下開始或更換配方者
  swim_context: >-
    **舊稿的「400m 以上耐力項目受影響顯著」已於 2026-08-17 撤除——它與自己引用的研究直接衝突。**
    Lebrun 2003 明確測量了有氧耐力（90% VO₂max 力竭時間）並**未發現顯著變化**，
    無氧速度測試同樣無差異。也就是說：可測到的是實驗室 VO₂max 這個生理指標下降，
    **不是**任何一項實際表現指標下降。VO₂max 降低是否會轉譯成 400m 以上項目的成績差異，
    現有證據無法回答（Lebrun n=14 且未測比賽表現；Elliott-Sale 2020 的群體效果為 trivial）。
    對教練的實務意義：OC 使用不應被當成解釋選手耐力表現起伏的預設原因，
    也不應成為建議選手換藥或停藥的理由——那是醫療決策，且證據強度不支持通則。

epidemiology:
  prevalence: "OC 在女性運動族群中使用普遍（方向性描述）。**舊稿的「使用率 30–50%」已於 2026-08-17 撤除**：它掛在兩個來源下，但一個查無此文獻（Bushman 2006），另一個（Elliott-Sale 2020）是表現統合分析、根本不產出使用率數字。要恢復量化使用率必須另找流行病學調查。"
  certainty: 🟡
  evidence_grade: B
  caveat: >-
    **2026-08-17 來源健檢：本條目原有兩層錯誤，均已更正。**
    ① **引用不存在**：舊稿引的「Bushman et al. 2006, Phys Sportsmed，早期 OC × VO₂max 量化」
    在 PubMed 查無——該作者在該期刊 0 筆；唯一真實的 Bushman × OC 文獻是 J Sports Med Phys Fitness 2006
    的**無氧功率**研究（PMID 16596112），期刊與測量指標皆不符。VO₂max 數字的真正出處是
    Lebrun 2003（已補入來源清單），且實測值 4.7%、非舊稿的 10–11%。
    ② **引用與主張不對應**：Elliott-Sale 2020 被誤記為 Br J Sports Med（實為 Sports Med），
    且被用來支撐「使用率 30–50%」——那是表現統合分析，不含使用率資料。
    現存證據的固有限制：Lebrun 2003 **n=14**、只測一種三相型配方、未測比賽表現；
    Elliott-Sale 2020 納入研究 83% 品質中等以下、配方混雜、研究間變異大；新一代低劑量配方研究稀少。
  sources:
    - "Lebrun CM, et al. (2003). Decreased maximal aerobic capacity with use of a triphasic oral contraceptive in highly active women: a randomised controlled trial. Br J Sports Med 37(4):315–320. PMID 12893716"
    - "Elliott-Sale KJ, et al. (2020). The Effects of Oral Contraceptives on Exercise Performance in Women: A Systematic Review and Meta-analysis. Sports Med 50(10):1785–1812. PMID 32666247"
  source_ids: [src.lebrun-2003-triphasic-oc-vo2max, src.elliott-sale-2020]

risk_factors:
  # 此節為「影響增強」的因子（不是疾病風險因子），維持 schema 兼容
  - { text: "三相型配方——**唯一有 RCT 直接測到 VO₂max 下降的配方型別（Lebrun 2003, n=14）**。但這不等於「三相型比單相型差」：該研究沒有設單相型對照組，跨配方比較尚未做過", grade: C }
  - { text: "高劑量配方（每錠 > 35 μg ethinylestradiol）——**劑量-反應關係在現有文獻中未建立**，此條原標 B 屬過度宣稱，2026-08-17 降級為待驗證假說", grade: Expert }
  - { text: "〔已撤除〕「耐力為主項目（400m 以上 / 開放水域 / 鐵人三項）受影響較大」——2026-08-17 撤除：Lebrun 2003 直接測量有氧耐力（90% VO₂max 力竭時間）**未發現顯著變化**，此條與其唯一證據來源相反", grade: Expert }
  - { text: "選手未告知教練/運科 OC 使用（影響的是基線判讀與溝通，不是生理風險本身）", grade: Expert }

prevention:
  - { text: "避孕方式的選擇是選手與醫師的醫療決定；教練的角色是知情與配合，不是建議用哪一種", grade: Expert }
  - { text: "〔已撤除〕「對耐力選手優先選擇低劑量單相型或非荷爾蒙避孕（IUD、保險套）」——2026-08-17 撤除：Elliott-Sale 2020（42 篇研究 / 590 人的統合分析）明確結論為**現有證據不足以支持對 OC 使用與否給出通則性建議，應個別化評估**。以運動表現為由建議特定避孕方式，既無證據支撐，也超出教練的角色界線", grade: Expert }
  - { text: "若要換配方，避開賽季關鍵期較為穩妥（理由是「未知變化不宜疊在關鍵期」的一般性風險管理，**不是**因為已知會掉表現）；舊稿的「賽前 12 個月」是無來源的具體數字，已撤除", grade: Expert }
  - { text: "教練知道選手是否使用 OC，有助於判讀 VO₂max 等實驗室基線的變動；但**不得反過來用 OC 使用解釋成績起伏**——現有證據顯示實際表現指標無顯著差異", grade: Expert }

management:
  red_flags:
    - "OC 使用後出現腿部腫脹疼痛、胸痛、呼吸困難 → 立即就醫排除血栓"
    - "急性嚴重頭痛 + 視覺變化 → 就醫評估腦血管事件"
    - "黃疸或上腹劇痛 → 評估肝臟反應"
  acute: ~
  pain_rules: ~
  rehab: ~
  functional_progression_criteria:
    - "若選手主動關切 OC 是否影響自己的表現：先確認其他更常見的解釋（訓練量、睡眠、鐵儲存量、能量可用性）已排除，再與醫師討論；任何調整都由醫師決定，並在調整前後各留一次可比較的測驗"
  swim_modifications_in_rehab: ~
  return_to_train: ~
  return_to_compete: ~
  prognosis: "**現有文獻未回答停用後的恢復問題**：Lebrun 2003 是單向設計（濾泡期 → OC 期），沒有停藥後的追蹤測量。舊稿的「停用後 2–3 個月 VO₂max 通常回升」是無來源的具體時程，已於 2026-08-17 撤除。可以說的只有：該研究觀察到的是 VO₂max 這一項生理指標的變化，而非任何實際表現指標的下降。"
