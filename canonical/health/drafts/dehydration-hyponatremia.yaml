    - "作者全名/DOI 待 W3；游泳者水中吞水對 EAH 的貢獻為推測機制，幾無量化研究"
  contested:
    - claim: "補水策略"
      consensus_source: "『按口渴補水』為現行主流共識"
      dissent_source: "部分早期耐力指引(pre-2010)推薦定時補水"
  vintage_warning: false

