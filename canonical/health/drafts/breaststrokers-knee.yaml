flags:
  pending_verification:
    - "三篇來源皆僅取得 PubMed 摘要層級，未取全文；子型分布的細部數字仍不可引用"
    - "「游泳膝傷流病系統綜述」(src.swimmers-knee-epidemiology-sr) 至今未能定位到實際文獻，維持 unverified，不得引用其存在"
  contested:
    - claim: "蛙泳膝主要病理是 MCL 應力還是髕股/內側皺襞"
      consensus_source: "臨床定位一致指向內側結構——Vizsolyi 1987 指出內側副韌帶與髕骨內下緣受累；Rovere 1985 在每週膝痛者中有 47% 觸及壓痛增厚的內側滑膜皺襞"
      dissent_source: "Cheng 2022 指出**關節鏡研究至今未能證實對應本症候群的特定結構異常**。因此這不是資料不足的暫時分歧，而是結構層面尚無定論；任一子型都不得寫成已確立病理"
    - claim: "疼痛發生在踢腿的哪一時相"
      consensus_source: "早期研究歸咎踢腿終末期(terminal phase)"
      dissent_source: "Vizsolyi 1987 開宗明義指出選手主訴多發生在向後推蹬的起始期(initial phase of rearward thrust)，此分歧至今未解"
  vintage_warning: true   # 兩篇主要流病文獻為 1985/1987，訓練型態與泳池環境已變

audit: { last_reviewed: 2026-08-17, reviewer: opus, supersedes: "2026-06-20 版：盛行率為待查佔位、風險因子誤寫為『髖外旋活動度不足』(實際文獻為內旋降低)、時相寫死為 propulsive phase(實際有文獻分歧)" }
