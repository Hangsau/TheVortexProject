    - "所有盛行率數字待查；public 層不放數字"
    - "Rovere & Nichols 引用為記憶，作者/年份/期刊須 WebFetch 確認，未證實前不寫入 public"
  contested:
    - claim: "蛙泳膝主要病理是 MCL 應力還是髕股/內側皺襞"
      consensus_source: "多數文獻指向內側結構(MCL)應力為最常見，但子型分布隨研究而異"
      dissent_source: "部分研究強調髕股疼痛症候群在蛙泳膝中比例被低估"
  vintage_warning: false

