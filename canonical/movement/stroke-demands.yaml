    publication_status: published
    claim_status: supported
    action_status: provisional
    evidence_profile: anatomy
    source_ids:
      - src.neumann-2017
    public:
      name_zh: 仰式上踢的髖屈曲、膝接近伸展與踝蹠屈
      description: >
        池畔可見方向：上踢；解剖學動作：髖屈曲。仰躺時朝水面就是朝腹側與
        身體前方，因此上踢時股骨朝腹側旋轉，在解剖學上命名為髖屈曲；膝朝
        接近完全伸展的方向移動，踝維持蹠屈。池畔可見方向與解剖學動作是
        兩個欄位，不是同一件事。踝蹠屈是足部遠離小腿前側，其可用範圍通常
        明顯大於背屈，也不因身體在空間中的朝向而改名。若另行選擇陸上輔助
        訓練動作，須以解剖學動作欄為準；只照「上踢」字面選擇，會落到矢狀面
        方向相反的動作。
      limitation_context: >
        髖屈曲、膝朝伸展方向移動與踝蹠屈各有獨立的可用範圍與控制條件；
        足部朝水面的合成路徑不能指出限制位於髖、膝或踝，也不能由路徑外觀
        指定任何肌群的收縮方式。
      safety_note: >
        上踢時若出現髖部、膝部、踝部或腰背疼痛、卡住、麻木、明顯無力或
        不穩，應停止，不要為了讓足部更靠近水面而強行伸膝或壓低腳背。
    diagnostic:
      assessment_note: >
        評估時須把池畔足部方向與股骨相對骨盆的局部旋轉分開，並逐節記錄
        髖屈曲、膝伸展與踝蹠屈。現有解剖來源只支持關節命名與一般可用能力，
        沒有仰式專項運動學、相位化肌電或推進力量測，故不得推定哪一拍由
        哪些肌群主導，action_status 維持 provisional。

