domain: movement
sub: stroke-demands
schema_version: 1
description: 泳式 × 相位 × 體位 × 池畔方向 × 解剖動作，連到 action 與 muscle-role；泳姿專屬主張須用游泳證據

# demands[] 條目 schema（以下僅描述欄位與語意）：
# id: 使用 movement.demand.* 命名空間的穩定識別碼。
# stroke: 此需求所屬泳式，待實際內容落地時逐筆裁決。
# phase_model: 此需求採用的相位模型，受控詞彙見 _taxonomy.yaml#fields.phase_model。
#   分期不是單一真相，數套各有來源的分期並存；本欄位的作用是讓「這個相位名出自
#   哪一套」顯性化，跨模型的相位不可互相換算（BK-26 裁決）。
# phase: 相位模型內的相位鍵。合法值隨泳式而異，登錄在
#   _taxonomy.yaml#movement_phase_registry.strokes.<stroke>；要新增相位先改登錄表，
#   不得在本檔就地發明。(stroke, phase, phase_model) 三者一致性由 W017 強制。
# body_position: 動作需求成立時的身體位置。
# poolside_direction: 從池畔觀察所使用的方向基準。這是輔助觀察欄，三種
#   action_reference_frame 都可以並存帶它；它本身不宣告 action_ids 的基準。
# action_reference_frame: 本筆 action_ids 是以哪個基準成立的，受控詞彙見
#   _taxonomy.yaml#fields.action_reference_frame。joint-local 是唯一可以寫
#   關節角度需求的取值，代價是必須有分節段量測（source_ids 非空），除非
#   已標 action_status: do-not-prescribe。由池畔可見的空間量反推關節動作
#   是 C 類蒐證命中最多次的根因（FR-40 裁決），W018 是這條的執行者。
# measurement_conditions: 本筆文字若出現量化主張（百分比／角度／秒數／r／d），
#   必填；結構與必填子鍵見 _taxonomy.yaml#movement_measurement_contract。
#   同一個頭位操弄在手臂體側與雙臂過頭下效果量差超過兩倍（FR-44），
#   所以數字不得脫離量測條件、終點與外推邊界單獨存在。W019 強制。
# derived_from_ids: 本需求是從哪幾筆既有 instructional 技術記錄推出來的；
#   目標為非 movement 的 canonical ID，來源是 plans/movement_coverage_denominator.yaml
#   的 phases[].evidence[].record_id。published 條目必填（W015）；
#   空 list 表示已查 denominator 確認該相位無對應記錄，不是未處理。
# action_ids: 連到 movement.action.* 的解剖動作需求。
# muscle_roles: 連到 movement.muscle.* 的可承擔角色，不把振幅直接等同肌力。
# publication_status: 記錄的發布狀態。
# claim_status: 記錄內主張的證據支持度。
# action_status: 記錄可否據以行動。
# evidence_profile: 記錄的證據性質分類。
# source_ids: 支撐泳姿專屬主張的游泳證據來源鍵。
# public: 對讀者公開的教育內容與來源。
# diagnostic: 不公開的量測、分類與教練判讀內容。
#
# public／diagnostic 分層契約：
# public: 正確命名、一般肌肉角色、教育性訓練選項、works_when／fails_when 白話版、公開安全停止條件與來源。
# diagnostic: 被動／主動 ROM 測量、力量耐力測試、如何分類限制、教練決策樹與個別水中重測判讀。
# public 安全要求: 疼痛、急性傷、明顯不穩、麻木無力等「不要強拉」安全訊息必須留在 public；具體診斷推理仍不公開。

demands:
  - id: movement.demand.starts-turns.underwater-glide.shoulder-elevation
    stroke: starts-turns
    phase_model: descriptive
    phase: underwater-glide
    body_position: prone
    action_reference_frame: joint-local
    derived_from_ids:
      - starts-turns.tech.27
      - starts-turns.tech.34
    action_ids:
      - movement.action.shoulder-complex.elevation
    muscle_roles:
      - muscle_id: movement.muscle.scapular-upward-rotators
        role: >
          在超流線位維持肩胛骨上旋，支撐雙臂貼耳的靜態姿勢。
          水中實際招募程度屬 EMG 研究範疇，各研究間存在異質性。
      - muscle_id: movement.muscle.rotator-cuff
        role: >
          在上舉末端動態穩定盂肱關節，防止肱骨頭在水中阻力下向後移位。
          招募型態在游泳群體間存在個體差異，不宜固定化描述。
      - muscle_id: movement.muscle.latissimus-dorsi
        role: >
          在超流線位被動拉伸狀態；闊背肌柔韌性不足時可能限制完整上舉。
          此為解剖推論，不代表游泳時闊背肌一定是限制主因——需逐案評估。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.martens-2015
    public:
      name_zh: 水下滑行超流線位的肩上舉需求
      description: >
        出發入水或轉身推蹬後的水下滑行，要求雙臂完全前舉過頭並夾緊雙耳，
        形成超流線（streamline）姿勢以降低阻力。這個姿勢要求肩複合體
        達到最大或接近最大的上舉角度，肩胛骨同步上旋，肱骨頭在關節盂中
        保持穩定。
        游泳群體的肌肉招募型態存在個體差異（游泳 EMG 研究一致顯示各研究
        間有顯著異質性），因此「特定肌肉一定以何種程度啟動」的描述需謹慎。
      limitation_context: >
        做不到完整超流線位的原因不只一種，而且不同原因的處理方向完全相反，
        不能靠單一動作或單一伸展套用到所有人，需要個別評估後才知道該往哪走。
      safety_note: >
        若在超流線姿勢中出現肩部疼痛、夾擠感或麻木，不應強撐維持姿勢，
        應停止並評估。
    diagnostic:
      assessment_note: >
        超流線角度的被動與主動差異評估、肩胛骨動態觀察、個別肌群肌力測試
        屬診斷層，用以分流限制來源（被動 vs 主動控制 vs 疼痛保護）。
      limitation_differential: >
        無法達到完整超流線位的潛在原因包括：盂肱關節被動活動度不足、
        肩胛上旋肌群主動控制不足、闊背肌或肩後囊柔韌性限制、以及疼痛
        或夾擠引起的保護性受限。不同原因的介入方向完全不同，需分流評估。

  - id: movement.demand.udk.down-kick.ankle-plantarflexion
    stroke: udk
    phase_model: descriptive
    phase: down-kick
    body_position: prone
    poolside_direction: 足部由水面側向池底側移動
    action_reference_frame: joint-local
    derived_from_ids:
      - udk.tech.5
      - udk.tech.9
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    muscle_roles:
      - muscle_id: movement.muscle.ankle-plantarflexors
        role: >
          支持踝在下踢中進入並維持蹠屈方向。泳者研究直接量到腓腸肌活動
          與踝蹠屈運動，但不能把腓腸肌的表面肌電擴成整個蹠屈肌群的固定
          招募模式，也不能把肌電振幅直接等同肌力、力矩或推進貢獻。
      - muscle_id: movement.muscle.ankle-dorsiflexors
        role: >
          脛前肌在 Yamakawa 研究的 UDK 下踢相出現活動峰值，顯示背屈肌並非
          單純休息的拮抗肌；結合其一般作用線，可提出換向與蹠屈方向制動的
          控制角色。該研究未直接判定離心收縮或因果性推進貢獻，本條不作
          這兩項延伸。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.veiga-2022
      - src.yamakawa-2022
      - src.pmc9402090-b
    public:
      name_zh: 水下蝶式打腿下踢的踝蹠屈需求
      description: >
        水下蝶式打腿的下踢相，可用腳趾從週期中的較高位置移到較低位置來
        描述。泳者運動學顯示，踝在這段週期中有明確的蹠屈與背屈變化，
        最大蹠屈出現在下踢已開始之後；泳者肌電研究也同時量到腓腸肌與
        脛前肌活動。這表示踝需要可用的蹠屈範圍，也需要雙向的主動控制，
        不能把腳踝理解成完全放鬆、任水流被動甩動。現有資料沒有建立所有
        泳者共用的目標角度，也不支持「角度越大越好」。
      limitation_context: >
        腳尖姿勢沒有出現時，原因不只一種，處理方向也可能相反；只看水中
        外觀不能判定原因或該採哪一種處理，需個別評估後再決定。
      safety_note: >
        下踢或繃腳時若出現踝部疼痛、麻木、明顯無力或不穩定感，不應繼續
        強壓腳尖或追求更大角度。
    diagnostic:
      assessment_note: >
        以固定膝位分別量測被動與主動蹠屈，另測蹠屈肌與背屈肌的末端維持、
        換向及離心控制；再以同一速度與任務的水中影片同步觀察踝角度與
        腳趾軌跡。被動限制、主動控制缺口、疼痛保護及足部其他關節代償的
        分流與重測判讀屬診斷層。

  - id: movement.demand.free.down-kick.ankle-plantarflexion
    stroke: free
    phase_model: descriptive
    phase: down-kick
    body_position: prone
    poolside_direction: 足部由水面側向池底側移動
    action_reference_frame: joint-local
    derived_from_ids:
      - free.tech.6
      - free.tech.11
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    muscle_roles:
      - muscle_id: movement.muscle.ankle-plantarflexors
        role: >
          依一般作用線可承擔蹠屈與末端姿勢維持，是本筆待驗證的候選角色。
          本批允許來源沒有自由式下踢的踝運動學或相位化 EMG，故不宣稱
          此肌群在該相位必然以特定時序或程度招募。
      - muscle_id: movement.muscle.ankle-dorsiflexors
        role: >
          依一般作用線可承擔蹠屈方向的制動與動作換向，也是待驗證的候選
          角色；目前不能由 UDK 或一般解剖資料外推自由式下踢的收縮型態，
          更不能推論背屈肌訓練會改善打腿效率。
    publication_status: draft
    claim_status: unverified
    action_status: do-not-prescribe
    evidence_profile: synthesis-inference
    source_ids: []
    public:
      name_zh: 自由式打腿下踢的踝蹠屈需求
      description: >
        本圖譜的既有覆蓋分母把自由式下踢連到踝足區域，本筆因此先把踝蹠屈
        建成待驗證的動作需求，讓同一解剖動作可連到第二個泳式相位。但本批
        允許來源中沒有自由式下踢的踝關節運動學，不能確認蹠屈角度、時序或
        肌肉招募；這筆草稿不是角度標準，也不得作為伸展或肌力處方依據。
      limitation_context: >
        若觀察到腳背姿勢不同，不能直接判定原因或處理方向；在取得自由式
        專屬運動學與肌電證據前，介入只能依個別評估與重測暫定。
      safety_note: >
        自由式打腿或繃腳時若出現疼痛、麻木、明顯無力或不穩定感，應停止
        強壓腳尖，不要為了符合外觀而追求更大角度。
    diagnostic:
      assessment_note: >
        後續需取得自由式泳者下踢相的踝關節分節段運動學，並把腓腸肌、
        脛前肌等肌電與相位同步，才能確認本需求。現階段若個別評估，仍須
        分開記錄固定膝位的被動與主動蹠屈、症狀、控制能力及同任務水中表現，
        不把 UDK 結果直接當作自由式判讀標準。

  - id: movement.demand.free.front-quadrant-propulsion.wrist-isometric-stability
    stroke: free
    phase_model: race-club-6phase
    phase: front-quadrant-propulsion
    body_position: prone
    action_reference_frame: joint-local
    derived_from_ids:
      - free.tech.8
      - free.tech.4
    action_ids:
      - movement.action.wrist-hand.flexion
      - movement.action.wrist-hand.extension
    muscle_roles:
      - muscle_id: movement.muscle.wrist-flexors
        role: >
          與腕伸肌群高度共收縮，以等長方式穩住腕關節，使手與前臂成為共同
          受力單元。此處的共收縮是穩定機制，不表示腕屈肌群正在帶動腕屈曲。
      - muscle_id: movement.muscle.wrist-extensors
        role: >
          與腕屈肌群高度共收縮，以等長方式穩住腕關節，使手與前臂成為共同
          受力單元。此處的共收縮是穩定機制，不表示腕伸肌群正在帶動腕伸展。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: swimming-emg
    source_ids:
      - src.caty-2007
      - src.hall-murphy-2020
    public:
      name_zh: 自由式前象限推進的腕關節等長穩定需求
      description: >
        依六相教材模型，抓水至早期推進期需要維持腕部穩定，讓手與前臂共同
        成為受力單元。教材描述手、腕與前臂對齊；另有一手肌電研究在其所用的
        內掃相觀察到腕部穩定與屈伸肌高度拮抗共收縮。兩者使用的分期不同，
        內掃相不能換算成六相模型的前象限推進期，因此研究只支持穩定機制，
        不建立這個相位的腕角度標準或效能結論。
      limitation_context: >
        水中看到手與前臂維持在一起，不能據此判定應把手腕擺到哪個角度；
        目前證據也未比較不同腕角配置，個別限制仍須另外評估。
      safety_note: >
        維持腕部位置時若出現疼痛、麻木、刺痛或明顯不穩，應停止，不要為了
        固定外觀而強行鎖住手腕。
    diagnostic:
      assessment_note: >
        教材的手腕對齊模型與一手肌電觀察方向一致，但 Caty 研究採用內掃相，
        與本筆的六相分期不同，不能寫成研究直接驗證前象限推進期。現有資料
        也未提供腕角度分布或效能終點，因此本筆僅為部分支持；個別評估須把
        主動穩定能力、症狀與同任務水中表現分開記錄。

  - id: movement.demand.free.early-pull-through.high-elbow-configuration
    stroke: free
    phase_model: heinlein-2010-phases
    phase: early-pull-through
    body_position: prone
    poolside_direction: 由池畔觀察，肘位於手掌與水面之間
    action_reference_frame: body-fixed
    measurement_conditions:
      - source_id: src.pmc3438875
        quantity: 界定 early pull-through 終點所用的肱骨相對身體前方角度；原文未設對照組
        value: 約 90°（原文為描述性界定，未給區間）
        conditions: 原文未報告量測協議、族群與樣本數；為肩部生物力學回顧中的分期描述
        endpoint: joint-angle
        extrapolation_boundary: >
          只作相位邊界的粗略界定，不是姿勢目標、不是可訓練門檻，也不得與
          src.suito-2017 的 high-elbow index 互相換算。
    derived_from_ids:
      - free.tech.2
      - free.tech.16
    action_ids:
      - movement.action.shoulder-complex.elevation
    muscle_roles:
      - muscle_id: movement.muscle.rotator-cuff
        role: >
          在水中阻力下等長維持肱骨相對身體的位置。水中實際招募程度屬肌電
          研究範疇，本筆沒有該層資料，不固定描述招募程度。
      - muscle_id: movement.muscle.scapular-upward-rotators
        role: >
          在水中阻力下等長維持肱骨相對身體的位置，協助保持上肢空間構型。
          水中實際招募程度屬肌電研究範疇，本筆沒有該層資料。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: swimming-kinematics
    source_ids:
      - src.pmc3438875
      - src.suito-2017
      - src.hall-murphy-2020
    public:
      name_zh: 自由式早期拉水的高肘構型需求
      description: >
        自由式早期拉水期維持高肘構型，從池畔可簡化描述為肘位於手掌與水面
        之間。這是方便教學的粗粒度說法；正式研究以肩、肘、腕三個標記點的
        座標構型建立 high-elbow index，本專案不採用該指標的門檻值。這項需求
        描述的是上肢相對身體的空間構型，不是盂肱關節角度要求。
      limitation_context: >
        池畔看到的肘與手掌相對位置，不能直接換算成肱骨相對肩胛的關節角度，
        也不應由單一視角外觀設定個人角度目標。
      safety_note: >
        維持拉水構型時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩，應停止，
        不要為了追求外觀而強行固定手臂位置。
    diagnostic:
      assessment_note: >
        action_reference_frame 採 body-fixed，因為高肘是池畔可見的空間構型，
        Suito 的指標也是肩、肘、腕三個座標點的構型，不是肱骨相對肩胛的
        關節角；現有資料未量測此相位的盂肱關節角度。Heinlein 將 early
        pull-through 的終點描述為肱骨位於身體前方約 90°，此數值只用於
        粗略相位邊界，不是姿勢目標，亦不能與 high-elbow index 換算。姿勢層
        有運動學支持，但相關資料不能建立因果效益，且樣本外推受限，因此
        本筆為部分支持。

  - id: movement.demand.fly.aerial-recovery.scapular-stability-without-body-roll
    stroke: fly
    phase_model: descriptive
    phase: aerial-recovery
    body_position: prone
    action_reference_frame: body-fixed
    derived_from_ids:
      - fly.tech.10
      - fly.tech.20
    action_ids:
      - movement.action.shoulder-complex.elevation
    muscle_roles:
      - muscle_id: movement.muscle.scapular-upward-rotators
        role: >
          在縱軸 body roll 無法協助的移臂空間條件下，承擔肩胛穩定與上旋的
          候選角色。Nuber 研究指出前鋸肌在各泳式划水中皆接近最大肌肉測試值；
          這項結果是負荷描述，不是泳式間比較，且水中樣本有限、摘要未報泳式間統計。
      - muscle_id: movement.muscle.rotator-cuff
        role: >
          在空中移臂期間等長維持肱骨相對身體的位置，作為盂肱關節動態穩定
          的候選角色。水中實際招募程度屬肌電研究範疇，本筆不固定描述。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.riewald-rodeo-2015
      - src.nuber-1986
    public:
      name_zh: 蝶式空中移臂的肩胛穩定需求
      description: >
        蝶式空中移臂的高度受肩部結構限制，而且不像自由式移臂可以由身體縱軸
        body roll 協助。肩胛與盂肱穩定因此需要在這項身體固定的空間條件下
        維持上肢構型。這是相位條件結合一般解剖角色的推論，不表示肩胛穩定
        只在蝶式需要，也不建立不同泳式之間的負荷排序。
      limitation_context: >
        空中移臂外觀受肩部結構、可用活動度與主動控制等多項條件影響，不能
        只憑單一視角判定限制來源，也不能由本筆設定跨泳式的負荷高低。
      safety_note: >
        空中移臂時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩，應停止，
        不要強行抬高手臂或追求更高的移臂路徑。
    diagnostic:
      assessment_note: >
        action_reference_frame 採 body-fixed，因為本筆描述的是相對身體長軸的
        移臂條件與 body roll 協助，而不是盂肱關節角度。縱軸 body roll 無法
        協助由教材直接描述；肩胛穩定需求則由此相位條件結合一般解剖角色推論。
        肌電資料只支撐前鋸肌的負荷描述，不支撐需求本體或跨泳式排序，因此
        evidence_profile 為 synthesis-inference，主張僅為部分支持。
