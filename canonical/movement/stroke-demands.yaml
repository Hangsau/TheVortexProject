domain: movement
sub: stroke-demands
schema_version: 1
description: 泳式 × 相位 × 體位 × 池畔方向 × 解剖動作，連到 action 與 muscle-role；泳姿專屬主張須用游泳證據

# demands[] 條目 schema（以下僅描述欄位與語意）：
# id: 使用 movement.demand.* 命名空間的穩定識別碼。
# stroke: 此需求所屬泳式，待實際內容落地時逐筆裁決。
# phase_model: 此需求採用的相位模型，受控詞彙見 _taxonomy.yaml#fields.phase_model。
#   分期不是單一真相，數套各有來源的分期並存；本欄位的作用是讓「這個相位名出自
#   哪一套」顯性化，跨模型的相位不可互相換算（BK-26 裁決）。
# phase: 相位模型內的相位鍵。合法值隨泳式而異，登錄在
#   _taxonomy.yaml#movement_phase_registry.strokes.<stroke>；要新增相位先改登錄表，
#   不得在本檔就地發明。(stroke, phase, phase_model) 三者一致性由 W017 強制。
# body_position: 動作需求成立時的身體位置。
# poolside_direction: 從池畔觀察所使用的方向基準。
# derived_from_ids: 本需求是從哪幾筆既有 instructional 技術記錄推出來的；
#   目標為非 movement 的 canonical ID，來源是 plans/movement_coverage_denominator.yaml
#   的 phases[].evidence[].record_id。published 條目必填（W015）；
#   空 list 表示已查 denominator 確認該相位無對應記錄，不是未處理。
# action_ids: 連到 movement.action.* 的解剖動作需求。
# muscle_roles: 連到 movement.muscle.* 的可承擔角色，不把振幅直接等同肌力。
# publication_status: 記錄的發布狀態。
# claim_status: 記錄內主張的證據支持度。
# action_status: 記錄可否據以行動。
# evidence_profile: 記錄的證據性質分類。
# source_ids: 支撐泳姿專屬主張的游泳證據來源鍵。
# public: 對讀者公開的教育內容與來源。
# diagnostic: 不公開的量測、分類與教練判讀內容。
#
# public／diagnostic 分層契約：
# public: 正確命名、一般肌肉角色、教育性訓練選項、works_when／fails_when 白話版、公開安全停止條件與來源。
# diagnostic: 被動／主動 ROM 測量、力量耐力測試、如何分類限制、教練決策樹與個別水中重測判讀。
# public 安全要求: 疼痛、急性傷、明顯不穩、麻木無力等「不要強拉」安全訊息必須留在 public；具體診斷推理仍不公開。

demands:
  - id: movement.demand.starts-turns.underwater-glide.shoulder-elevation
    stroke: starts-turns
    phase_model: descriptive
    phase: underwater-glide
    body_position: prone
    derived_from_ids:
      - starts-turns.tech.27
      - starts-turns.tech.34
    action_ids:
      - movement.action.shoulder-complex.elevation
    muscle_roles:
      - muscle_id: movement.muscle.scapular-upward-rotators
        role: >
          在超流線位維持肩胛骨上旋，支撐雙臂貼耳的靜態姿勢。
          水中實際招募程度屬 EMG 研究範疇，各研究間存在異質性。
      - muscle_id: movement.muscle.rotator-cuff
        role: >
          在上舉末端動態穩定盂肱關節，防止肱骨頭在水中阻力下向後移位。
          招募型態在游泳群體間存在個體差異，不宜固定化描述。
      - muscle_id: movement.muscle.latissimus-dorsi
        role: >
          在超流線位被動拉伸狀態；闊背肌柔韌性不足時可能限制完整上舉。
          此為解剖推論，不代表游泳時闊背肌一定是限制主因——需逐案評估。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.martens-2015
    public:
      name_zh: 水下滑行超流線位的肩上舉需求
      description: >
        出發入水或轉身推蹬後的水下滑行，要求雙臂完全前舉過頭並夾緊雙耳，
        形成超流線（streamline）姿勢以降低阻力。這個姿勢要求肩複合體
        達到最大或接近最大的上舉角度，肩胛骨同步上旋，肱骨頭在關節盂中
        保持穩定。
        游泳群體的肌肉招募型態存在個體差異（游泳 EMG 研究一致顯示各研究
        間有顯著異質性），因此「特定肌肉一定以何種程度啟動」的描述需謹慎。
      limitation_context: >
        做不到完整超流線位的原因不只一種，而且不同原因的處理方向完全相反，
        不能靠單一動作或單一伸展套用到所有人，需要個別評估後才知道該往哪走。
      safety_note: >
        若在超流線姿勢中出現肩部疼痛、夾擠感或麻木，不應強撐維持姿勢，
        應停止並評估。
    diagnostic:
      assessment_note: >
        超流線角度的被動與主動差異評估、肩胛骨動態觀察、個別肌群肌力測試
        屬診斷層，用以分流限制來源（被動 vs 主動控制 vs 疼痛保護）。
      limitation_differential: >
        無法達到完整超流線位的潛在原因包括：盂肱關節被動活動度不足、
        肩胛上旋肌群主動控制不足、闊背肌或肩後囊柔韌性限制、以及疼痛
        或夾擠引起的保護性受限。不同原因的介入方向完全不同，需分流評估。

  - id: movement.demand.udk.down-kick.ankle-plantarflexion
    stroke: udk
    phase_model: descriptive
    phase: down-kick
    body_position: prone
    poolside_direction: 足部由水面側向池底側移動
    derived_from_ids:
      - udk.tech.5
      - udk.tech.9
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    muscle_roles:
      - muscle_id: movement.muscle.ankle-plantarflexors
        role: >
          支持踝在下踢中進入並維持蹠屈方向。泳者研究直接量到腓腸肌活動
          與踝蹠屈運動，但不能把腓腸肌的表面肌電擴成整個蹠屈肌群的固定
          招募模式，也不能把肌電振幅直接等同肌力、力矩或推進貢獻。
      - muscle_id: movement.muscle.ankle-dorsiflexors
        role: >
          脛前肌在 Yamakawa 研究的 UDK 下踢相出現活動峰值，顯示背屈肌並非
          單純休息的拮抗肌；結合其一般作用線，可提出換向與蹠屈方向制動的
          控制角色。該研究未直接判定離心收縮或因果性推進貢獻，本條不作
          這兩項延伸。
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.veiga-2022
      - src.yamakawa-2022
      - src.pmc9402090-b
    public:
      name_zh: 水下蝶式打腿下踢的踝蹠屈需求
      description: >
        水下蝶式打腿的下踢相，可用腳趾從週期中的較高位置移到較低位置來
        描述。泳者運動學顯示，踝在這段週期中有明確的蹠屈與背屈變化，
        最大蹠屈出現在下踢已開始之後；泳者肌電研究也同時量到腓腸肌與
        脛前肌活動。這表示踝需要可用的蹠屈範圍，也需要雙向的主動控制，
        不能把腳踝理解成完全放鬆、任水流被動甩動。現有資料沒有建立所有
        泳者共用的目標角度，也不支持「角度越大越好」。
      limitation_context: >
        腳尖姿勢沒有出現時，原因不只一種，處理方向也可能相反；只看水中
        外觀不能判定原因或該採哪一種處理，需個別評估後再決定。
      safety_note: >
        下踢或繃腳時若出現踝部疼痛、麻木、明顯無力或不穩定感，不應繼續
        強壓腳尖或追求更大角度。
    diagnostic:
      assessment_note: >
        以固定膝位分別量測被動與主動蹠屈，另測蹠屈肌與背屈肌的末端維持、
        換向及離心控制；再以同一速度與任務的水中影片同步觀察踝角度與
        腳趾軌跡。被動限制、主動控制缺口、疼痛保護及足部其他關節代償的
        分流與重測判讀屬診斷層。

  - id: movement.demand.free.down-kick.ankle-plantarflexion
    stroke: free
    phase_model: descriptive
    phase: down-kick
    body_position: prone
    poolside_direction: 足部由水面側向池底側移動
    derived_from_ids:
      - free.tech.6
      - free.tech.11
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    muscle_roles:
      - muscle_id: movement.muscle.ankle-plantarflexors
        role: >
          依一般作用線可承擔蹠屈與末端姿勢維持，是本筆待驗證的候選角色。
          本批允許來源沒有自由式下踢的踝運動學或相位化 EMG，故不宣稱
          此肌群在該相位必然以特定時序或程度招募。
      - muscle_id: movement.muscle.ankle-dorsiflexors
        role: >
          依一般作用線可承擔蹠屈方向的制動與動作換向，也是待驗證的候選
          角色；目前不能由 UDK 或一般解剖資料外推自由式下踢的收縮型態，
          更不能推論背屈肌訓練會改善打腿效率。
    publication_status: draft
    claim_status: unverified
    action_status: do-not-prescribe
    evidence_profile: synthesis-inference
    source_ids: []
    public:
      name_zh: 自由式打腿下踢的踝蹠屈需求
      description: >
        本圖譜的既有覆蓋分母把自由式下踢連到踝足區域，本筆因此先把踝蹠屈
        建成待驗證的動作需求，讓同一解剖動作可連到第二個泳式相位。但本批
        允許來源中沒有自由式下踢的踝關節運動學，不能確認蹠屈角度、時序或
        肌肉招募；這筆草稿不是角度標準，也不得作為伸展或肌力處方依據。
      limitation_context: >
        若觀察到腳背姿勢不同，不能直接判定原因或處理方向；在取得自由式
        專屬運動學與肌電證據前，介入只能依個別評估與重測暫定。
      safety_note: >
        自由式打腿或繃腳時若出現疼痛、麻木、明顯無力或不穩定感，應停止
        強壓腳尖，不要為了符合外觀而追求更大角度。
    diagnostic:
      assessment_note: >
        後續需取得自由式泳者下踢相的踝關節分節段運動學，並把腓腸肌、
        脛前肌等肌電與相位同步，才能確認本需求。現階段若個別評估，仍須
        分開記錄固定膝位的被動與主動蹠屈、症狀、控制能力及同任務水中表現，
        不把 UDK 結果直接當作自由式判讀標準。
