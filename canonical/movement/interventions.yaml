domain: movement
sub: interventions
schema_version: 1
description: 依限制型態整理訓練、活動度／伸展、進退階、劑量來源、水中重測與安全停止條件

# interventions[] 條目 schema（以下僅描述欄位與語意）：
# id: 使用 movement.intervention.* 命名空間的穩定識別碼。
# limitation_type: 介入所針對且可辨識的限制型態。
# action_ids: 連到 movement.action.* 的相關動作。
# demand_ids: 連到 movement.demand.* 的相關泳式需求。
# affirmative_conclusion: 現階段能肯定說什麼
# works_when: 哪些可觀察條件成立時適用
# fails_when: 哪些條件下無效或不應使用
# how_to_identify: 用什麼 ROM、力量、症狀或水中重測分流
# action: 實際訓練／活動度步驟與進退階
# remaining_boundary: 做完後仍不能回答什麼
# mobility_decision: 所有活動度記錄必填的活動度決策。
# dosage_source_ids: 支撐劑量的已登錄來源鍵。
# safety_stop_conditions: 必須公開的安全停止條件。
# publication_status: 記錄的發布狀態。
# claim_status: 記錄內主張的證據支持度。
# action_status: 記錄可否據以行動。
# evidence_profile: 記錄的證據性質分類。
# source_ids: 支撐記錄的已登錄來源鍵。
# public: 對讀者公開的教育內容與來源。
# diagnostic: 不公開的量測、分類與教練判讀內容。
#
# public／diagnostic 分層契約：
# public: 正確命名、一般肌肉角色、教育性訓練選項、works_when／fails_when 白話版、公開安全停止條件與來源。
# diagnostic: 被動／主動 ROM 測量、力量耐力測試、如何分類限制、教練決策樹與個別水中重測判讀。
# public 安全要求: 疼痛、急性傷、明顯不穩、麻木無力等「不要強拉」安全訊息必須留在 public；具體診斷推理仍不公開。

interventions:
  - id: movement.intervention.shoulder-elevation.active-control
    limitation_type: 主動控制不足（肩胛上旋肌群力量或耐力不足，超流線末端無法主動保持）
    action_ids:
      - movement.action.shoulder-complex.elevation
    demand_ids:
      - movement.demand.starts-turns.underwater-glide.shoulder-elevation
    affirmative_conclusion: >
      當評估顯示被動 ROM 充足但主動末端維持能力不足時，針對肩胛上旋肌群
      與旋轉肌袖的容量訓練（capacity training）可改善主動控制。不同類型
      的肌力訓練在特定條件下均可正向轉移至游泳成績，不限於單一方法。
    works_when:
      - 被動上舉角度已達超流線需求，但主動維持時姿勢塌陷或末端角度流失
      - 肩胛骨動態觀察顯示上旋不足或翼狀肩胛（serratus anterior 為主的弱點）
      - 無急性傷、關節不穩或夾擠症狀的禁忌條件
    fails_when:
      - 被動 ROM 本身即不足（此時容量訓練不能替代活動度提升）
      - 存在急性夾擠、肌腱撕裂或明顯不穩，需先處理急性問題
      - 疼痛保護性受限（強行訓練會加劇而非改善）
      - 過度活動（hypermobility）主導時，穩定容量訓練方向正確但進退階需更謹慎
    how_to_identify: >
      分流標準：先確認被動 ROM 充足（主動不足但被動正常 → 控制問題）；
      肩胛動態評估觀察上旋與穩定性；排除急性或結構性問題後再進入容量訓練。
      具體量測方法屬診斷層。
    action: >
      初階：肩胛骨主動控制訓練（如 wall slides、Y-T-W exercises、
      serratus anterior activation）；從低負荷、短弧度開始建立神經肌肉協調。
      進階：抗阻上舉訓練（cable / resistance band shoulder elevation）；
      逐步增加末端維持時間。
      游泳特定：水上流線型姿勢靜態維持練習，從岸上俯臥滑行姿勢過渡到
      水中短距離超流線滑行。
      退階：若主動訓練仍誘發症狀，降回被動輔助動作範圍或降低負荷。
    remaining_boundary: >
      目前訓練轉移研究以競技泳者為主，不同族群（兒童、鐵人三項、成人初學）
      的最佳劑量與進退階時程尚無充分資料。各研究所用訓練類型異質性高，
      無法指定單一最佳方法。水中重測的最佳時機與判讀方式缺乏標準。
    mobility_decision: not-routine
    dosage_source_ids:
      - src.fone-2022
      - src.muniz-pardos-2019
    safety_stop_conditions:
      - 訓練中出現新發或加劇的肩部疼痛立即停止
      - 出現麻木、刺痛或無力感
      - 關節出現明顯不穩定感
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: intervention
    source_ids:
      - src.fone-2022
      - src.muniz-pardos-2019
    public:
      name_zh: 主動末端控制與容量取向訓練
      description: >
        若肩膀活動度足夠但超流線位維持不住（塌陷或不對稱），問題可能在
        肌肉的「主動控制能力」——肩胛上旋肌群和旋轉肌袖需要足夠的耐力與
        協調，才能在高速滑行中維持姿勢。此介入透過漸進式容量訓練
        建立這個能力。
      works_when_summary: >
        被動活動度已足夠，但主動維持時姿勢崩潰，且無急性傷或夾擠禁忌。
      fails_when_summary: >
        被動角度本身不夠，或有急性疼痛、結構性問題，應先處理根本原因。
      training_options: >
        從岸上肩胛骨主動控制練習開始（wall slides、Y-T-W 系列），
        進階到阻力帶上舉與水中流線型靜態維持。
      safety_note: >
        若訓練中出現疼痛加劇、麻木、刺痛或不穩定感，立即停止，不要強撐。
    diagnostic:
      decision_tree_note: >
        被動 ROM vs 主動 ROM 的分離評估、肩胛動態分析、個別肌群測試
        屬診斷層，決定是否優先處理柔韌度、控制或兩者並行。

  - id: movement.intervention.shoulder-elevation.conditional-soft-tissue
    limitation_type: 確認被動上舉角度不足且已排除禁忌，肩後囊或闊背肌被動限制為主要因素
    action_ids:
      - movement.action.shoulder-complex.elevation
    demand_ids:
      - movement.demand.starts-turns.underwater-glide.shoulder-elevation
    affirmative_conclusion: >
      當評估確認存在被動上舉角度不足且主要限制為被動軟組織（肩後囊緊縮
      或闊背肌柔韌性不足），且已排除關節不穩、急性炎症及過度活動等禁忌
      時，條件式軟組織介入（如肩後囊伸展）可作為輔助工具。此介入從預設
      工具降為條件式選項：活動度正常或過度者優先不使用。
    works_when:
      - 被動上舉角度量測顯示明確不足，且與主動角度之間有顯著差距
      - 臨床分流確認主要限制在被動軟組織（而非主動控制不足）
      - 無關節不穩、急性炎症、全層肌腱撕裂等禁忌
      - 活動度處於正常範圍以下（不適用於正常或過度活動者）
    fails_when:
      - 被動 ROM 已達正常範圍或過度活動（hypermobility）—— 此時伸展無益且可能有害
      - 主動控制不足是主要因素（應優先處理容量，不是伸展）
      - 存在急性炎症、全層撕裂或關節不穩的禁忌
      - 疼痛因肩後囊緊縮以外的原因（如夾擠、肌腱病變）引起，伸展可能加劇
    how_to_identify: >
      需先完成被動 ROM 與主動 ROM 分離評估，確認被動不足且主動控制非主因；
      臨床端點測試（如仰臥交叉內收測試輔助判斷後囊張力）；排除禁忌。
      具體量測協議屬診斷層。
    action: >
      肩後囊伸展（sleeper stretch）：側臥患側，患側手臂屈肘 90° 內旋方向
      輕壓，在不引發疼痛的張力感下維持。具體維持時間與頻率目前無游泳族群
      劑量來源，本條不給定數字。
      闊背肌伸展：仰臥雙臂上舉貼耳維持，腰部保持中立，感受背部延伸而非
      腰椎過伸。
      進退階原則：從低強度輕微感覺張力開始；若伸展後症狀加重，立即退階
      或停止；不追求「拉到有點痛」的程度。
    remaining_boundary: >
      本條的介入建議是由解剖作用線與臨床慣例推導，尚無游泳族群的直接介入
      試驗支撐，證據等級屬綜述推論而非介入研究。
      sleeper stretch 的現有研究以投擲選手（特別是棒球投手）為主，直接
      轉移到游泳族群（尤其兒童、自由潛水）的證據有限。最佳劑量（頻率、
      強度、維持時間）尚無游泳族群專屬資料。伸展是否真能改變泳者的水下
      超流線品質，目前尚無直接介入試驗。
    mobility_decision: conditional
    dosage_source_ids: []
    safety_stop_conditions:
      - 伸展過程中出現疼痛（不是「感覺張力」而是明確疼痛）立即停止
      - 出現麻木、刺痛或無力感
      - 伸展後症狀加重
      - 有關節不穩或急性傷者禁止使用
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.neumann-2017
    public:
      name_zh: 條件式軟組織介入（肩後囊與闊背肌）
      description: >
        若評估確認肩膀活動度本身不足（被動角度達不到超流線需求），
        且主要原因是軟組織限制（肩後囊緊繃或闊背肌較緊），可以考慮針對
        性伸展作為輔助。但這是「條件式」的——活動度已正常或過度活動的人，
        不應常規使用此介入，因為對他們沒有幫助甚至可能增加不穩定。
      works_when_summary: >
        被動活動度確認不足，已排除禁忌，且臨床分流顯示被動軟組織是主要限制。
      fails_when_summary: >
        活動度正常或過度、主動控制才是主因、有急性傷或關節不穩時不適用。
      approach_note: >
        肩後囊伸展（sleeper stretch）和闊背肌伸展是常見的輔助工具，
        從輕微張力感開始，不應追求「拉到痛」。
      safety_note: >
        伸展中若出現疼痛（不只是張力感）、麻木、刺痛或不穩定感，立即停止。
        有關節不穩或急性傷者禁止使用。
    diagnostic:
      decision_tree_note: >
        被動 ROM 量測（如仰臥上舉角度）、主動被動差異評估、後囊張力
        端點測試屬診斷層，用以確認是否符合此介入的適用條件。

  - id: movement.intervention.ankle-plantarflexion.conditional-mobility
    limitation_type: 確認被動踝蹠屈受限且已排除疼痛、關節不穩與不適合強拉的結構性阻擋
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    demand_ids:
      - movement.demand.udk.down-kick.ankle-plantarflexion
      - movement.demand.free.down-kick.ankle-plantarflexion
    affirmative_conclusion: >
      現有 UDK 研究支持最大蹠屈角度與經身高校正的水下蝶式打腿速度存在
      關聯。這不證明長期伸展能讓泳者變快，也不支持角度越大越好。當個別
      評估確認被動蹠屈確實受限且沒有禁忌時，可把低強度活動度練習作為
      條件式嘗試，是否繼續須由症狀、陸上變化與同任務水中重測決定。
    works_when:
      - 在膝位與量測方式一致時，被動蹠屈反覆顯示受限，且與目標水中姿勢的缺口方向一致
      - 已排除急性傷、疼痛性終末、明顯關節不穩及不適合強拉的結構性阻擋
      - 可在介入前後用相同陸上量測與同一水中任務觀察是否真的改變
    fails_when:
      - 被動蹠屈並未受限，或活動度已充足／過度，此時繼續追角度沒有依據
      - 主要缺口是主動末端控制或換向能力，活動度練習不能替代容量訓練
      - 終末出現堅硬阻擋、夾擠或疼痛；骨性接觸等結構限制不會因伸展而改變
      - 有急性傷、明顯不穩、麻木或無力等停止條件
      - 嘗試後被動範圍、主動使用或同任務水中表現沒有可重複的有利改變
    how_to_identify: >
      在相同膝關節位置下分別記錄被動與主動蹠屈，確認差距是否可重複，
      並記錄疼痛位置、終末感與關節穩定性。若被動終末呈堅硬阻擋或在踝前後
      出現夾擠症狀，需評估距骨邊緣、後三角骨等結構因素；若被動可到而主動
      到不了，則轉入容量與控制路徑。最後用相同速度、距離與任務的水中重測
      判斷變化是否轉移。具體量測協議與分流判讀屬診斷層。
    action: >
      初階：在非承重、膝位固定且無疼痛的條件下，以主動輔助方式緩慢進入
      蹠屈，只到可接受的張力終點，不強迫足部伴隨內翻、外翻或腳趾蜷曲。
      隨後主動離開末端，保留新範圍內的控制。
      進階：只有在症狀穩定且被動與主動使用都出現可重複改善時，才轉到
      無輔助的末端控制，再回到原本的水中任務重測。
      退階：若出現疼痛、神經症狀、不穩或硬性阻擋，立即減小範圍或停止；
      若陸上角度改變但水中任務不變，不把加大伸展當成預設進階。
      本條沒有可支撐維持時間、次數、組數或週頻率的來源，因此不給定數字。
    remaining_boundary: >
      現有直接資料來自小樣本、訓練良好的成人泳者之急性 UDK 條件比較，
      沒有能支撐本處方的長期伸展介入試驗；既有急性伸展操作不是訓練試驗，
      也不知道最佳方法、劑量或角度上限。一般蹠屈與急性增加蹠屈條件未呈現
      顯著表現差異，不能推論超過個人一般範圍仍有收益。研究也未涵蓋兒童、
      青少年、鐵人三項與成人初學等本專案受眾；自由式 demand 本身仍缺專屬
      踝運動學，不能把 UDK 結果直接當成自由式伸展效果。
    mobility_decision: conditional
    dosage_source_ids: []
    safety_stop_conditions:
      - 活動中出現明確疼痛或原有症狀加劇
      - 出現麻木、刺痛或明顯無力
      - 踝關節出現明顯不穩定感
      - 有急性傷或疼痛性硬阻擋時不得強拉
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.neumann-2017
      - src.pmc9402090-b
    public:
      name_zh: 條件式踝蹠屈活動度介入
      description: >
        踝蹠屈幅度與水下蝶式打腿速度有關聯，但這不等於把腳踝拉鬆就會變快，
        也不代表越鬆越好。只有在個別評估已確認腳尖向下的被動可用範圍確實
        受限，而且沒有疼痛、不穩或其他禁忌時，才可小心嘗試活動度練習，
        並確認陸上與水中任務是否真的改變。
      works_when_summary: >
        被動可用範圍已確認受限、沒有安全禁忌，而且能用相同任務比較前後變化。
      fails_when_summary: >
        未經個別評估確認適用，或碰到疼痛與硬性阻擋時不應使用。蹠屈受限
        的原因不只一種，處理方向可能相反；嘗試後原任務沒有改善也不應
        繼續加大伸展。
      approach_note: >
        從非承重、無疼痛的主動輔助蹠屈開始，不強迫腳掌轉向或腳趾蜷曲；
        只有在可用範圍與主動使用都有改善時才進階，並回到原水中任務確認。
        本條沒有來源可支持統一的時間、次數、組數或週頻率，因此不提供數字。
      safety_note: >
        若出現疼痛、麻木、刺痛、明顯無力或關節不穩，立即停止，不要強拉。
        有急性傷或疼痛性硬阻擋者不得使用。
    diagnostic:
      decision_tree_note: >
        固定膝位的被動／主動蹠屈量測、終末感與症狀定位、結構性阻擋評估，
        以及標準化水中重測判讀均屬診斷層。分流時需區分軟組織延展性、
        骨性接觸、主動控制與疼痛保護，不能用同一伸展處理所有分支。

  - id: movement.intervention.ankle-plantarflexion.capacity-control
    limitation_type: 被動蹠屈可用範圍充足，但主動末端維持、換向或反覆控制能力不足
    action_ids:
      - movement.action.ankle-foot.plantarflexion
    demand_ids:
      - movement.demand.udk.down-kick.ankle-plantarflexion
      - movement.demand.free.down-kick.ankle-plantarflexion
    affirmative_conclusion: >
      蹠屈肌群具有產生與維持蹠屈的解剖能力，背屈肌群具有主動回程與制動
      蹠屈方向的能力。UDK 研究在八名男性國家級競技泳者中量到腓腸肌與
      脛前肌活動，且較高水槽速度條件下兩者的整合肌電增加，支持踝在該
      protocol 中需要雙向主動參與；肌電不等於肌力、力矩或推進。當被動
      範圍足夠而可重複觀察到主動控制缺口時，漸進的蹠屈／背屈容量與換向
      練習是與缺口相符的暫行選項，是否有水中轉移必須個別重測。
    works_when:
      - 被動蹠屈可到達所需位置，但主動進入、維持或離開末端時反覆流失角度或方向
      - 低阻力下可無痛完成蹠屈與背屈，且增加控制要求時才出現品質下降
      - 無急性傷、明顯不穩、麻木或疼痛性終末等禁忌
      - 可用相同水中任務檢查陸上控制改變是否轉移
    fails_when:
      - 被動蹠屈本身受限，容量訓練不能取代對被動限制的分流
      - 存在疼痛、急性傷、明顯不穩或神經症狀，需先停止並評估
      - 終末角度由骨性阻擋主導，增加肌力不會移除結構邊界
      - 已能穩定完成主動末端與換向，沒有可觀察的容量或控制缺口
      - 只因陸上力量增加就預期游速改善；本批沒有踝專屬訓練轉移證據
    how_to_identify: >
      在固定膝位下比較被動與主動蹠屈，接著測試無痛的末端等長維持、
      蹠屈方向制動、背屈回程與反覆換向品質；記錄是否出現角度流失、
      方向偏移、代償或症狀。排除被動限制及禁忌後，以同一速度、距離與
      任務進行水中重測。具體力量耐力門檻、分類與重測判讀屬診斷層。
    action: >
      初階：在非承重姿勢主動進入無痛的蹠屈末端，維持足部方向穩定，
      再以可控制的速度離開末端；加入背屈肌對蹠屈方向的平滑制動，避免
      讓足部靠慣性甩入終點。
      進階：加入輕阻力的蹠屈、背屈與雙向換向，要求不以腳趾蜷曲、膝動作
      或足部過度內外翻代償；再轉到俯臥流線姿勢中的末端控制，最後回水中
      原任務重測。
      退階：若方向開始失控、出現代償或症狀，降低阻力與動作範圍；若水中
      表現沒有可重複改變，不以增加負荷自動取代重新分流。
      本條沒有踝專屬劑量來源，因此不給定秒數、次數、組數或週頻率。
    remaining_boundary: >
      Yamakawa 研究僅有八名男性國家級競技泳者，使用水槽與三個相對個人
      最大速度的次最大條件；結果不能直接外推到靜水比賽、自由式打腿、
      女性、兒童、青少年、鐵人三項或成人初學。研究量到的是運動學與肌電，
      不是踝容量訓練介入。一般游泳肌力與專項阻力訓練回顧只能支持「轉移
      取決於方法與條件」，不能指定本條方法、最佳劑量，或證明這些踝練習
      會提升 UDK／自由式速度。
    mobility_decision: not-routine
    dosage_source_ids: []
    safety_stop_conditions:
      - 練習中出現新發或加劇的踝部、小腿或跟腱疼痛
      - 出現麻木、刺痛或明顯無力
      - 踝關節出現明顯不穩定感
      - 急性傷期間不得用增加阻力或末端角度測試能力
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.neumann-2017
      - src.yamakawa-2022
      - src.fone-2022
      - src.muniz-pardos-2019
    public:
      name_zh: 踝蹠屈容量與主動控制訓練
      description: >
        如果腳踝可被帶到需要的位置，但自己進不到、維持不住或換向時失控，
        可把訓練焦點放在蹠屈肌與背屈肌的雙向控制，而不是繼續追求更大的
        被動角度。UDK 研究顯示腓腸肌與脛前肌都會參與，但這不等於單練某條
        肌肉就能提高打腿效率；訓練後仍要回到原本的水中任務確認是否轉移。
      works_when_summary: >
        可用角度已足夠，但腳尖的主動末端、換向或反覆維持品質會流失，且
        沒有疼痛、急性傷或不穩。
      fails_when_summary: >
        未經個別評估確認有控制缺口，或練習引發症狀時不適用；陸上變強也
        不能自行視為水中已改善，原任務沒有改善時需重新評估方向。
      training_options: >
        從無痛的主動蹠屈末端、平滑制動與背屈回程開始，再加入輕阻力和
        雙向換向；方向穩定後才帶到俯臥流線姿勢與水中原任務。本條沒有
        踝專屬劑量來源，因此不提供秒數、次數、組數或週頻率。
      safety_note: >
        若出現疼痛、麻木、刺痛、明顯無力或關節不穩，立即停止；急性傷
        期間不要用加重阻力或硬壓末端的方式測試能力。
    diagnostic:
      decision_tree_note: >
        固定膝位的被動／主動蹠屈差異、個別肌群力量耐力、末端等長維持、
        離心制動與水中重測判讀屬診斷層。只有排除被動限制、疼痛與結構性
        阻擋後，才能把可重複的主動缺口分到此路徑。

  - id: movement.intervention.breaststroke-breathing.arm-driven-torso-lift
    limitation_type: 換氣時以主動抬頭或拱背當作上身抬起的驅動來源，把動力來源歸錯位置
    action_ids: []
    demand_ids:
      - movement.demand.breast.arm-insweep.breath-event-separation
      - movement.demand.breast.arm-recovery.pull-to-kick-interval
    affirmative_conclusion: >
      教材對這一點給出的是明確的反向指導：上身被抬起來是因為手臂的運動，
      不是因為泳者主動把頭撐起來或主動拱背。同一份教材也把頭開始上升、
      臉破出水面與吸氣寫成三個先後分開的事件，並強調臉破水發生在內掃相
      而不會更早。因此當泳者為了換到氣而主動抬頭或拱腰時，與缺口相符的
      方向是把注意力移回手臂動作與換氣事件的先後，而不是訓練頸部或背部
      去把身體撐起來。這是教材層級的動作模型，不是量測到的因果。
    works_when:
      - 泳者可觀察到在手臂尚未內掃前就先抬頭或先拱腰，換氣被提前
      - 頭、臉與吸氣三個事件在同一瞬間被一起完成，換氣後體線明顯散開
      - 頸部或腰背在換氣時反覆出現緊繃感，但無疼痛、麻木或神經症狀
      - 手臂動作本身可完成，改變換氣時機後可用同一任務重測
    fails_when:
      - 存在疼痛、急性傷、明顯不穩或神經症狀，需先停止並評估
      - 手臂內掃本身無法完成，此時問題不在換氣時序而在划手動作
      - 已能把三個事件分開完成，沒有可重複觀察到的提前抬頭或拱腰
      - 只因陸上頸部或核心訓練加量就預期換氣改善；本條沒有這類轉移證據
    how_to_identify: >
      由池畔與水下分別觀察，記錄頭開始上升、臉破出水面與吸氣三個時點
      相對手臂內掃的先後，以及腰部在換氣瞬間是否出現額外伸展。若頭部
      上升明顯早於手臂內掃，或三個事件無法分開，才歸入本路徑。具體
      分期判讀與分類屬診斷層；不對頸椎位置給角度。
    action: >
      初階：在慢速下把換氣拆成三步練習——先只做手臂內掃、允許上身被
      帶起而不主動抬頭；再加入臉破水；最後才加入吸氣。過程中維持頭與
      脊椎相對關係不變，不主動下壓下巴也不主動仰頭。
      進階：回到完整週期，把注意力放在手臂內掃的時機上，讓抬起的時間
      由手臂決定；每個週期起訖回到教材所說的 body line。
      退階：若換不到氣、出現代償或症狀，降低速度與週期數，回到分解
      練習；不以加大抬頭幅度作為換氣不足的補救。
      本條沒有蛙式換氣的劑量來源，因此不給定次數、組數或週頻率。
    remaining_boundary: >
      本條的依據全部來自兩本教材的分期描述與一句明確的反向指導，沒有
      任何量測直接驗證這個介入。原始清單中的「肩胛帶上提」在三層檢索
      中沒有任何肩胛骨量測，教材寫的是體表可見的肩部整體上升，因此
      該說法屬證據缺口，不得作為本條的機制或訓練目標。線上可得的蛙式
      換氣運動學只量到頭部的空間幅度，沒有肩胛骨與頸椎相對胸廓角，
      不能用來支持或反駁本條。兩本教材使用不同分期命名系統，引用時
      必須綁 phase_model，不得混用相位名。
    mobility_decision: not-routine
    dosage_source_ids: []
    safety_stop_conditions:
      - 練習中出現新發或加劇的頸部、腰背疼痛
      - 出現麻木、刺痛、上肢放射症狀或明顯無力
      - 出現嗆水、呼吸困難或明顯換氣不足
      - 症狀期間不得以加大抬頭幅度或延長閉氣來測試能力
    publication_status: draft
    claim_status: partially-supported
    action_status: provisional
    evidence_profile: synthesis-inference
    source_ids:
      - src.riewald-rodeo-2015
      - src.hall-murphy-2020
    public:
      name_zh: 蛙式換氣：把抬起的驅動交還給手臂
      description: >
        很多人換氣換不順時，直覺是更用力把頭抬起來或把腰拱起來。教材對
        這一點寫得很直接：上身會被抬起來，是因為手臂在動，不是因為泳者
        主動撐頭或拱背。教材也把頭開始上升、臉破出水面、吸氣寫成三個
        先後發生的事件，臉破水發生在手往內掃的時候，不會比這更早。所以
        換氣練習的方向是讓手臂決定抬起的時間，並把三個事件分開，而不是
        練頸部或背部去把自己撐起來。
      works_when_summary: >
        看得到在手還沒往內掃之前就先抬頭或先拱腰，或三個換氣事件被擠在
        同一瞬間，而且沒有疼痛與神經症狀。
      fails_when_summary: >
        有疼痛、急性傷或神經症狀時不適用；如果手臂內掃本身做不出來，
        問題不在換氣時序。改了時序而原本的任務沒有改善時，需要重新
        評估方向，不要靠加大抬頭幅度硬撐。
      training_options: >
        慢速下把換氣拆成三步：先只做手臂內掃並允許上身被帶起、再加入
        臉破水、最後才加入吸氣；過程中不主動抬頭也不主動拱腰。之後回到
        完整週期，讓抬起的時間由手臂內掃決定，每個週期起訖回到教材說的
        body line。本條沒有劑量來源，因此不提供次數、組數或週頻率。
      safety_note: >
        若出現頸部或腰背疼痛、麻木、上肢放射症狀、明顯無力、嗆水或
        換氣不足，立即停止；不要用延長閉氣或更用力抬頭的方式硬撐。
    diagnostic:
      decision_tree_note: >
        本路徑的分流點是動力來源歸屬，不是活動度：先確認手臂內掃可完成，
        再判讀頭部上升是否早於內掃、三個換氣事件是否被壓成一點。若頸部
        或腰背有症狀，先停止並評估，不進本路徑。「肩胛帶上提」為證據
        缺口，不得作為分類依據或訓練目標；本條也不對頸椎中立給角度。
