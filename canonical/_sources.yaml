    notes: "2026-09-05 取全文核對。兩處引用逐字對得上：「Your hands, head, and shoulders are the first parts of your body to face the water... If they're moving up and down or left and right without any intention, you'll experience a lot of resistance... But if you can control the motion, you'll be able to keep resistance low.」與「Stability isn't the same as rigidity. Your hands and upper body will move in a rhythmic manner that limits resistance and facilitates an effective undulation of your body. They're not staying still, but they are in control.」後者修正了同機構 2022 年文章的「保持靜止」措辭，是本次唯一由同一出版方自我修訂而拿到的實料。該頁為機構指南、未署名作者、未標日期。"

