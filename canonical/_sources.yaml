      doi: "10.2478/hukin-2014-0058"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 複合鍵拆解後校正：本筆是 de Jesus 等 2014 年的方法學回顧，彙整 23 份仰式出發文獻（2 份游泳專書、8 篇同儕審查期刊、3 篇 BMS 研討會、8 篇 ISBS 會議論文、1 篇生物力學研討會、1 篇博士論文）。原註記寫「疑似與 src.pmc4234766-b 為同一文獻待合併」與「顯示字串未給出單一明確年份，year 留空」，**兩句都不成立**：-b 是複合鍵不是重複登錄（已立墓碑），本筆的 year 欄位一直是 2014、沒有留空。**使用邊界**：本篇是回顧與方法學評估，不報告單一的角度—成績關聯；它自己的結論是各研究對分期定義沒有共識、出發計時終點從約 5 m 到 22.86 m 不等、部分研究的結論因規則改變已對應到不再使用的仰式出發技術。引用時只能用於「該領域的方法異質性與規則變動」這一層，不得從中取具體數值。"

  - id: src.pmc4234766-b
    display: "【複合來源鍵，已解除】已拆為 src.pmc4234766-a、src.de-jesus-2013-backstroke-start-feet"
    type: other
    verification_status: retracted
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 複合來源鍵拆解：本 id 的顯示字串「The Backstroke Swimming Start: State of the Art, PMC4234766; PubMed 23688055」把兩篇不同文獻綁成一個機器鍵——PMC4234766 是 de Jesus 等 2014 年的方法學回顧（J Hum Kinet，已登錄為 src.pmc4234766-a），PMID 23688055 則是 de Jesus 等 2013 年的腳位比較實驗（J Sports Sci 31(15):1665–1675），已獨立登錄為 src.de-jesus-2013-backstroke-start-feet。原本兩筆都標「疑似同一文獻待合併」，那個判讀是錯的：兩者共用 PMCID 只因為本鍵的第一段就是那篇，合併會把 2013 那篇整個吞掉。唯一引用處 `starts-turns.err4` 的證據行已重寫並改掛正確 id。本 id 保留為墓碑、不得再使用。"

  - id: src.de-jesus-2013-backstroke-start-feet
    display: "de Jesus, K., de Jesus, K., Figueiredo, P., Gonçalves, P., Pereira, S. M., Vilas-Boas, J. P., & Fernandes, R. J. (2013). Backstroke start kinematic and kinetic changes due to different feet positioning. Journal of Sports Sciences, 31(15), 1665–1675."
    title: "Backstroke start kinematic and kinetic changes due to different feet positioning."
    type: journal-article
    verification_status: verified
    authors: ["de Jesus K", "de Jesus K", "Figueiredo P", "Gonçalves P", "Pereira SM", "Vilas-Boas JP", "Fernandes RJ"]
    year: 2013
    container: "Journal of Sports Sciences"
    identifier:
      pmid: "23688055"
      doi: "10.1080/02640414.2013.794298"
      url: "https://pubmed.ncbi.nlm.nih.gov/23688055/"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 efetch 核對後獨立登錄，來自拆解複合鍵 src.pmc4234766-b。內容：6 名菁英泳者，各做兩組 4 趟 15 m 全力仰式出發，比較「雙腳完全沒入水面下」與「雙腳露出水面」兩種腳位；矢狀面雙攝影機跨介質二維運動學，加上水下測力板與裝有 load cell 的握把測動力學。結果：腳沒入水者的重心水平起始位置、hands-off 時的重心水平速度、**起跳角度**都較大；腳露出水面者的觸牆時間、離台時重心的水平與向下垂直速度、下肢水平衝量、飛行期向下垂直速度較大；兩者的**重心水平入水距離、背弓角度與 5 m 出發時間相當**。**使用邊界（重要）**：① 本篇是**腳位變項**的比較，不是起跳角度與成績的關聯研究；② 它量到的方向恰好相反——起跳角度較大的那個變項，5 m 時間**沒有比較差**（兩者相當）；因此不得用本篇支持「起跳角度越大成績越差」；③ n=6 全為菁英泳者，且該規則背景是 2005 年改制，早於後續出發台與扶手規則變動。"

