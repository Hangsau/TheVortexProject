    notes: >-
      2026-08-17 更正顯示字串。**原記為「Vibrio vulnificus infection Taiwan 案例」是錯的**——
      本文是台灣水域**環境分離株**的微生物學研究（盛行、基因多樣性、抗藥性、毒力基因），
      不是臨床病例系列，**沒有任何死亡率或臨床預後數據**。
      `open-water-marine-biological-hazards` 原先把「壞死性筋膜炎死亡率 >20%」掛在本來源下，屬來源—宣稱不匹配，已解除。
      **使用邊界**：本來源只能支撐「創傷弧菌存在於台灣水域環境」這一件事，不能支撐感染率、死亡率或臨床處置。

  - id: src.chuang-2019-vibrio-vulnificus-mortality-meta
    display: "Chuang PY, Yang TY, Huang TW, Tsai YH, Huang KC, Weng HH. (2019). Hepatic disease and the risk of mortality of Vibrio vulnificus necrotizing skin and soft tissue infections: A systematic review and meta-analysis. PLoS One 14(10):e0223513."
    title: "Hepatic disease and the risk of mortality of Vibrio vulnificus necrotizing skin and soft tissue infections: A systematic review and meta-analysis."
    type: review
    verification_status: verified
    year: 2019
    authors: ["Chuang PY", "Yang TY", "Huang TW", "Tsai YH", "Huang KC", "Weng HH"]
    container: "PLoS One"
    identifier:
      pmid: "31652263"
      doi: "10.1371/journal.pone.0223513"
      pmcid: "PMC6814278"
    retrieved_on: "2026-08-17"
    notes: >-
      2026-08-17 查證新增，用以取代原先掛在 src.pmc8147101（環境分離株研究）下的死亡率宣稱。
      1966–2018 年中的 12 篇觀察性研究、1,157 名創傷弧菌壞死性皮膚軟組織感染（VNSSTI）患者。
      **合併結果：46.8% 的 VNSSTI 患者本身有肝病（HD）；有肝病者死亡率 53.9%（292/542），
      無肝病者 16.1%（99/615），RR 2.61（95% CI 2.14–3.19）。**
      肝硬化（末期肝病）相較非肝硬化 RR 1.84（1.21–2.79）、相較無肝病 RR 2.00（1.41–2.85）。
      **使用邊界**：① 死亡率必須連族群一起說——「>20%」對整體偏高、對肝病族群則**嚴重低估**，
      不可寫成單一數字；② 12 篇研究以台灣、韓國、美國沿岸為主，作者群為台灣長庚，
      但本文是跨國合併非台灣本土世代；③ 分母是「已發生 VNSSTI 者」，不是「接觸海水者」，
      不能拿來推估開放水域游泳的感染風險。

