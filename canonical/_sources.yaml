  - id: src.astm-f2508
    display: "ASTM F2508-23, Standard Practice for Validation of Walkway Tribometry Using Research-based Reference Materials（前版 F2508-16e1 題為 Validation, Calibration, and Certification of Walkway Tribometers Using Reference Surfaces）"
    title: "Standard Practice for Validation of Walkway Tribometry Using Research-based Reference Materials"
    type: guideline
    verification_status: verified
    year: 2023
    identifier:
      url: "https://store.astm.org/standards/f2508"
    notes: >-
      2026-08-17 查證更正。**使用邊界（極重要）**：F2508 規範的是「步道摩擦計（walkway tribometer）如何用參考表面做驗證、校準與認證」，
      **它不訂定任何摩擦係數門檻值**。原先 `poolside-slip-fall` 以本標準支撐「ASTM 建議濕地最低標 0.6」屬張冠李戴——
      ASTM 從未發布走道最低摩擦係數。0.60／0.40 的分級門檻出自 **ANSI/NFSI B101.1**（見 src.ansi-nfsi-b101-1），
      引用時兩者不得互換。本來源只能用來支撐「摩擦係數量測需經校驗才可比較」這類方法學陳述。

  - id: src.ansi-nfsi-b101-1
    display: "ANSI/NFSI B101.1, Test Method for Measuring Wet SCOF of Common Hard-Surface Floor Materials（2009 初版，2022 改版）"
    title: "Test Method for Measuring Wet SCOF of Common Hard-Surface Floor Materials"
    type: guideline
    verification_status: verified
    year: 2022
    identifier:
      url: "https://webstore.ansi.org/standards/nfsi/ansinfsib1012022"
    notes: >-
      2026-08-17 新增，用以取代原先誤掛在 ASTM F2508 下的摩擦係數門檻。本標準把**濕態靜摩擦係數（wet SCOF）**分三級：
      **≥ 0.60 高抓地力／0.40–0.60 中等／< 0.40 低抓地力**。
      **使用邊界**：① 這三個數字全都是「濕態」值，不可拿來描述乾混凝土；
      ② 這是量測方法與分級標準，不是流行病學來源，不能用來支撐傷害發生率；
      ③ NFSI 宣稱「wet SCOF ≥ 0.60 可使滑倒索賠減少達 90%」屬該機構自述的關聯性數據，非同儕審查文獻，本專案不引用該 90%。

