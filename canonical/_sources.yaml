  - id: src.total-immersion-terry-laughlin-vortex
    display: "【非來源：本專案自述／泛稱歸屬，已撤下】Total Immersion (Terry Laughlin) 感知訓練傳統；Vortex 整理"
    type: other
    verification_status: retracted
    retrieved_on: "2026-09-06"
    notes: "這筆指的是一個**訓練傳統**（Total Immersion 的感知訓練取向）加上本專案自述，不是書裡的某條 drill。Terry Laughlin 的《Total Immersion》（1996；2004 修訂版 ISBN 0-7432-5343-4）是真書，但本專案未取得原書、也未核對過書中是否有「閉眼超人趕上」這條動作；直接把書登上去等於宣稱一件沒查過的事（同 2026-09-06 SW 6.4 錯誤的形態）。日後若讀到原書並找到對應頁碼，再以真來源＋頁碼登錄。 2026-09-06 「非來源」清查撤下。這個 display 扣掉括號補語後只剩本專案自己的名字（「Vortex 整理」「作者綜合」）或一句泛稱（「通用游泳教學法」）——沒有指向任何可回溯的作品，登在 `_sources.yaml` 裡只是讓來源總數多一筆、反向來源索引多一個點不進去的節點。與 E014（把「教練觀測」登錄成來源）、W023（把自己的草稿路徑登錄成來源）是同一種病的第三種寫法：長得像引用、實際回不到任何外部證據，卻能滿足 E005／W002 的來源檢查。**處置不是去找一篇文獻來補**——這些內容本來就是本專案自己整理的，正解是拿掉 `source_ids`、把自述留在讀者看得到的 `source` 顯示字串裡（那句話本身是誠實的），並讓驗證器不再把這種字串算成「已有來源資訊」（新增 E017 + W002／W009／W011 逃生口收緊）。本 id 保留為墓碑、不得再使用。"

  - id: src.toussaint
    display: "【複合來源鍵，已拆解】已拆為 src.toussaint-hollander-1994-energetics-swimming 等 2 筆"
    type: other
    verification_status: retracted
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 複合鍵拆解：顯示字串「Toussaint & Hollander 1994 (Sports Med 18:384–405); Rodríguez & Mader 2011」綁了兩筆互不相關的來源。前者查得到（PMID 7886354，卷期頁碼完全吻合）；後者 PubMed／Crossref 皆無記錄，只能以 unverified 登錄並在 notes 記下未確認的線索。拆解時另外查出：Toussaint & Hollander 1994 的摘要**沒有各距離有氧供能百分比**，而 periodization.zones.swim_energy_by_distance 正是以 🟢 掛著 50m ≈5–20%、100m ≈40–50% 這些數字——已在該區塊補上使用邊界註記。本 id 保留為墓碑、不得再使用。"

  - id: src.toussaint-colwin-1990-maglischo-2003-swimmin
    display: "【複合來源鍵，已拆解】已拆為 src.toussaint-2002-pumped-up-propulsion 等 3 筆"
    type: other
    verification_status: retracted
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 複合鍵拆解：顯示字串「Toussaint, Colwin 等（1990 年代起）；Maglischo (2003) Swimming Fastest」裡，只有 Maglischo 那半是可解析的書目，前半是對一整批文獻的手勢。拆解時查出更嚴重的問題：它支撐的那句「流體力學研究指出划水中升力推進效率低於阻力推進」**與 Toussaint 本人的著作相反**——Toussaint & Beek 1992 明寫菁英技術的共同元素是用複雜撥水動作特別去產生升力；Toussaint 等 2002 挑戰的是 quasi-steady 升力／阻力分解模型（流場非定常、手臂旋轉、存在軸向流），不是宣告阻力推進比升力推進有效率。error.back.06 的敘述已據此重寫，改指 src.toussaint-2002-pumped-up-propulsion 與 src.maglischo-2003-swimming-fastest。Colwin 未登錄：沒有任何線索指出是哪一部作品，登了就是編。本 id 保留為墓碑、不得再使用。"

