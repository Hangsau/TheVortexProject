    notes: "2026-09-06 主動補登（不在原複合鍵裡）——理由是原複合鍵只掛了倡議者本人的說法，沒有任何獨立檢驗。摘要已核，結論是**否定性的**：系統性回顧檢索 1347 篇、全文評估 15 篇，**15 篇全部排除，因為介入措施並不是 USRPT**，因此「USRPT 目前並非建立在同行評審文獻上」；並明指 USRPT 主張的「避免阻力訓練、交叉訓練、低於比賽配速的強度、以及分解式 drill」**高度爭議且缺乏科學證據**。作者判定 USRPT 實質上是高強度間歇訓練（HIT）的一個變體，建議教練謹慎使用、放進多元週期化計畫裡而非取代之。**對本專案的意義**：Vortex 是 drill 密集的教學系統，引用 USRPT 支撐「速度不是訓練分界線」時，必須同時說清楚 USRPT 自己反對 drill 這件事沒有證據——不能只挑對自己有利的一半。"

