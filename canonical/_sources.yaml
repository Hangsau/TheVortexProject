  - id: src.falls-and-hip-fracture-mortality-pmid
    display: "【佔位字串，非真實文獻】原記為「Falls and hip fracture mortality, 一般骨科文獻（待補具體 PMID）」——顯示字串本身就寫著「待補 PMID」，從未指向任何一篇可解析文獻"
    type: other
    verification_status: retracted
    notes: >-
      2026-08-17 判定為**佔位字串**並解除全部引用。它唯一支撐的是 `poolside-slip-fall` 的
      「高齡髖骨折後一年死亡率 20–30%」。改以真實文獻查證後發現**該數字對本專案的讀者族群偏高約 1.5–2 倍**：
      台灣健保資料庫（src.wang-2013-taiwan-hip-fracture-mortality，n=143,595）年死亡率 1999 年 18.10% 降至 2009 年 13.98%；
      台灣術後世代（src.lee-2017-taiwan-hip-fracture-1yr-mortality，n=5,442）整體一年死亡率 16.8%；
      亞太區系統回顧（src.harvey-2024-asia-pacific-hip-fracture-mortality，142 研究／1,139,752 人）一年死亡率
      自新加坡 10.8% 至紐西蘭 23.8%，亞洲約為澳紐的一半。
      20–30% 大致落在澳紐等西方族群上緣，直接套用到台灣讀者會誇大風險。
      **本 id 保持 unverified 且不得再被任何條目引用；成為孤兒來源（W008）是正確結果。**

