  - id: src.akkurt-2017
    display: "【查無此文獻】原記為「Akkurt et al. 2017, J Phys Ther Sci（SCI 髖屈攣縮綜述）」，PubMed 檢索不到對應文獻"
    type: other
    verification_status: retracted
    authors: ["Akkurt"]
    et_al: true
    year: 2017
    retrieved_on: "2026-08-17"
    notes: >-
      **2026-08-17 查證結果：定位失敗，本 id 不得當作證據使用。**
      NCBI E-utilities 以 `Akkurt[au] AND 2017[dp] AND "J Phys Ther Sci"[ta]` 檢索回傳 0 筆；
      放寬為 `Akkurt[au] AND (contracture OR "spinal cord")` 後，2017 年唯一相符者為
      **Akkurt H, Karapolat HU, Kirazli Y. (2017). The effects of upper extremity aerobic exercise
      in patients with spinal cord injury: a randomized controlled study. Eur J Phys Rehabil Med. PMID 27824234**
      ——**期刊不同（Eur J Phys Rehabil Med ≠ J Phys Ther Sci）、主題不同（上肢有氧運動 RCT ≠ 髖屈攣縮綜述）、
      文獻類型不同（RCT ≠ 綜述）**，三項皆不符，不能認定為同一篇。
      故本條屬**無法定位的引用**（可能是記憶誤植或拼裝），不是「暫時查不到」。
      依 Vortex 誠實原則保留 unverified 且不補假引用；引用它的
      `sci-hip-flexor-contracture` 盛行率數字已於同日改標 🟠 + `observation_basis`。

