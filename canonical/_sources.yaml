    display: "Ramirez-Campillo, R., Perez-Castilla, A., Thapa, R. K., Afonso, J., Clemente, F. M., Colado, J. C., de Villarreal, E. S., & Chaabene, H. (2022). Effects of plyometric jump training on measures of physical fitness and sport-specific performance of water sports athletes: a systematic review with meta-analysis. Sports Medicine – Open, 8(1), 108."
