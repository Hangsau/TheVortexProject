  - id: src.stress-fractures-in-swimmers-systematic-revi
    display: "Vasiliadis AV, Lampridis V, Georgiannos D, Bisbinas I. (2018). Swimmers Are At Risk For Stress Fractures? A Systematic Review. Int J Kinesiol Sports Sci 6(3):25-31."
    title: "Swimmers Are At Risk For Stress Fractures? A Systematic Review"
    type: review
    verification_status: verified
    authors: ["Vasiliadis AV", "Lampridis V", "Georgiannos D", "Bisbinas I"]
    year: 2018
    container: "International Journal of Kinesiology and Sports Science"
    identifier:
      doi: "10.7575/aiac.ijkss.v.6n.1p.25"
    url: "https://journals.aiac.org.au/index.php/IJKSS/article/view/4580"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 取回期刊頁面定位成功。檢索 PubMed 與 ResearchGate 至 2017 年 1 月，
      **全文獻僅 10 篇描述泳者應力性骨折**。
      核心結論：**最常見部位是肋骨**（年輕競技泳者，與主項泳式無關），
      其餘為第一肋、恥骨支各一例、以及一例歷史性的**蹠骨**個案；
      作者結論是「競技游泳在此面向相對安全」。
      **使用邊界**：① **本來源的重點是肋骨，不是踝足**——
      把它掛在踝足條目下當作足部應力性骨折的證據會失真，
      它能支撐的是「泳者應力性骨折罕見、且以肋骨為主」以及「蹠骨僅見單一歷史個案」；
