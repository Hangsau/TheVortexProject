    notes: >-
      2026-08-17 查證新增。以媒體報導與 National Coronial Information System（驗屍官資料庫）
      回溯 2014–2018 澳洲水域 **91 例**浮潛／閉氣潛水死亡（男 78、女 13，中位年齡 48 歲，範圍 16–80）；
      **約三分之一涉及閉氣潛水**，64 例為單獨從事，51 例為觀光客，77 例已知 BMI 者中 52 例過重或肥胖。
      失能主因：原發性溺水 39%、心因性事件 31%（但列為死因者僅 21%）。作者結論明列
      「延長閉氣造成的窒息性缺氧與看護不足仍是問題」。
      **使用邊界（重要）**：① 這是**澳洲海域浮潛／閉氣潛水**的死亡資料，**不是泳池 SWB 的發生率**，
      兩者族群與情境不同，不得互換；② 分子來自驗屍紀錄、**沒有分母**，只能支撐「主要證據來自
      個案系列與驗屍報告」這類敘述，不能算出發生率；③ 心因性與肥胖因素在此族群比重高，
      不能外推到年輕泳池閉氣訓練者。

