  - id: src.wang-2013-taiwan-hip-fracture-mortality
    display: "Wang CB, Lin CF, Liang WM, et al. (2013). Excess mortality after hip fracture among the elderly in Taiwan: a nationwide population-based cohort study. Bone 56(1):147–153."
    title: "Excess mortality after hip fracture among the elderly in Taiwan: a nationwide population-based cohort study."
    type: journal-article
    verification_status: verified
    year: 2013
    authors: ["Wang CB", "Lin CF", "Liang WM", "Cheng CF", "Chang YJ", "Wu HC", "Wu TN", "Leu TH"]
    identifier:
      pmid: "23727435"
      doi: "10.1016/j.bone.2013.05.015"
    notes: >-
      2026-08-17 查證新增。台灣健保資料庫 1999–2009 年、≥60 歲髖骨折住院者 143,595 人，追蹤至 2010 年底。
      **年死亡率由 1999 年 18.10% 降至 2009 年 13.98%**；一、二、五、十年的標準化死亡比（SMR）分別為 9.67、5.28、3.31、2.89。
      作者結論：髖骨折影響**短期**死亡率，長期則否。
      **使用邊界**：① 這是全國住院登記的粗死亡率，不是「超額」死亡率；SMR 才是超額指標，兩者不可混用；
      ② 數字逐年下降，引用時必須寫出年份，不能寫成一個固定值；③ 非游泳族群，只能作為高齡跌倒後果的一般背景。

