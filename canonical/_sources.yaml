    notes: "2026-09-06 複合鍵拆解。這串把**兩個不同領域的同名概念**黏在一起：動作學習的「specificity of practice」（Proteau 一系，講練習時的**感覺條件**）與訓練學的「Principle of Specificity」（講**刺激特異性**）。回原文（Rushall 的 Swimming Science Bulletin 49）核對後確認 USRPT 援引的是後者，而且 Rushall 自己指的依據是Chatard 等 1990 與 Craig & Pendergast 1979 的**游速—技術特異性**，與 Proteau 那一系無關。已拆為 src.rushall-2016-usrpt-defined-bulletin-49（主張者原文）＋src.craig-pendergast-1979-stroke-rate-distance-velocity（Rushall 指的原始運動學依據），並主動補登 src.nugent-2019-usrpt-systematic-review（獨立系統性回顧，結論是 USRPT 目前沒有任何合格研究支撐）。本 id 保留為墓碑、不得再使用。"

