    notes: "2026-09-06 主動補登，用途是替蝶式抬頭換氣段落提供頭頸段質量的可查證數字。Table 4.1 的原文節錄（第 83-84 頁）已下載並逐行核對，**Head and neck = 0.081 of total body mass**（分段定義為 C7-T1 與第一肋至耳道）。70 公斤成人換算約 5.7 公斤。**使用邊界**：這是屍體研究與掃描資料綜合出的平均比例，用來估量級，不是個體實測；表中頭與頸是**合併**的一段，單獨頭部更輕。登錄動機見同日對 Rushall（1996）「成人頭部至少 7 公斤」的核對——那個數字沒有量測出處，且要體重 86 公斤以上才成立。"
  - id: src.scharborough-2017-dolphin-kick-prone-supine
    display: "Scharborough, M. B., Robinson, P., Albin, E. E., Broussard, J., Adams, T., & Dubrose, E. (2017). Kinematic Comparison of Dolphin Kicking Performed in a Prone and Supine Body Position. International Journal of Exercise Science: Conference Proceedings, 2(9), Article 81."
    title: "Kinematic Comparison of Dolphin Kicking Performed in a Prone and Supine Body Position"
    type: conference_abstract
    verification_status: verified
    authors: ["M. B. Scharborough", "P. Robinson", "E. E. Albin", "J. Broussard", "T. Adams", "E. Dubrose"]
    year: 2017
    publisher: "International Journal of Exercise Science (Western Kentucky University Digital Commons)"
    identifier:
      url: "https://digitalcommons.wku.edu/ijesab/vol2/iss9/81/"
    retrieved_on: "2026-09-06"
    notes: "n=6 大學校隊泳者（身高 1.77±0.07 m、體重 72.4±7.6 kg、19.8±1.0 歲），俯臥與仰臥各三趟 10 m 全力海豚腳，60 Hz 水下攝影、12 個標記點、四階 Butterworth 濾波、2×2 重複量數 ANOVA。結果：水平速度 t(4)=0.308, p=0.774、踢頻 t(4)=0.371, p=0.730 兩種體位都沒有差異；膝的活動度顯著大於髖 F(1,4)=110.967，但活動度不受體位影響 F(1,4)=1.068, p=0.36（膝 ROM 俯 69.7±4.5／仰 73.6±6.7，髖 俯 37.7±8.3／仰 40.5±9.0）。結論原文：Despite some recent suggestions that a supine dolphin kick may be more effective than a prone dolphin kick, no kinematic difference were observed in this sample of swimmers. 使用邊界：這是 n=6 的會議摘要（未經完整同儕審查、未報告檢定力），沒測到差異不能反過來當成「兩者相等」的證據；它能支撐的只有「目前沒有運動學證據支持仰臥較優」。"

