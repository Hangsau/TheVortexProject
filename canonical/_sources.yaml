    display: "Lin IC, Hussain B, Hsu BM, et al. (2021). Prevalence, Genetic Diversity, Antimicrobial Resistance, and Toxigenic Profile of Vibrio vulnificus Isolated from Aquatic Environments in Taiwan. Antibiotics 10(5):505."
    title: "Prevalence, Genetic Diversity, Antimicrobial Resistance, and Toxigenic Profile of Vibrio vulnificus Isolated from Aquatic Environments in Taiwan."
    type: journal-article
    verification_status: verified
    authors: ["Lin IC", "Hussain B", "Hsu BM", "Chen JS", "Hsu YL", "Chiu YC", "Huang SW", "Wang JL"]
    year: 2021
