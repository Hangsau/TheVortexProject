    display: "Blanksby, B. A., Simpson, J. R., Elliott, B. C., & McElroy, K. (1998). Biomechanical factors influencing breaststroke turns by age-group swimmers. Journal of Applied Biomechanics, 14(2), 180–189."
    title: "Biomechanical Factors Influencing Breaststroke Turns by Age-Group Swimmers"
    type: journal-article
