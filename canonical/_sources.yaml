  - id: src.wang-2013-taiwan-hip-fracture-mortality
    display: "Wang CB, Lin CF, Liang WM, et al. (2013). Excess mortality after hip fracture among the elderly in Taiwan: a nationwide population-based cohort study. Bone 56(1):147–153."
    title: "Excess mortality after hip fracture among the elderly in Taiwan: a nationwide population-based cohort study."
    type: journal-article
    verification_status: verified
    year: 2013
    authors: ["Wang CB", "Lin CF", "Liang WM", "Cheng CF", "Chang YJ", "Wu HC", "Wu TN", "Leu TH"]
    identifier:
      pmid: "23727435"
      doi: "10.1016/j.bone.2013.05.015"
    notes: >-
      2026-08-17 查證新增。台灣健保資料庫 1999–2009 年、≥60 歲髖骨折住院者 143,595 人，追蹤至 2010 年底。
      **年死亡率由 1999 年 18.10% 降至 2009 年 13.98%**；一、二、五、十年的標準化死亡比（SMR）分別為 9.67、5.28、3.31、2.89。
      作者結論：髖骨折影響**短期**死亡率，長期則否。
      **使用邊界**：① 這是全國住院登記的粗死亡率，不是「超額」死亡率；SMR 才是超額指標，兩者不可混用；
      ② 數字逐年下降，引用時必須寫出年份，不能寫成一個固定值；③ 非游泳族群，只能作為高齡跌倒後果的一般背景。

  - id: src.ward-2018
    display: "Ward, S. M. (2018). Kinematic analysis of peak velocities in the breaststroke as a function of the timing of the kick [Master of Science thesis, University of Hawaii at Manoa]."
    title: "Kinematic Analysis of Peak Velocities in the Breaststroke as a Function of the Timing of the Kick"
    type: thesis
    verification_status: verified
    authors: ["Susan M. Ward"]
    year: 2018
    publisher: "University of Hawaii at Manoa (ScholarSpace)"
    identifier:
      url: "https://scholarspace.manoa.hawaii.edu/bitstream/10125/62185/1/2018-05-ms-ward.pdf"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 取全文核對。碩士論文，指導委員 Cris Stickley（主席）、Jan Prins、Yukiya Oba、Bret Freemyer。受試者 n=9（NCAA 第一級校隊，男 4 女 5），單一受試者設計（每位受試者自己三種踢腿時機互比，不跨受試者比），三種方案：C100 傳統時序（100 碼衝刺配速）、DU1 late kick（晚划臂內划時踢）、DU2 delayed late kick（划臂回復早期才踢）。水下攝影數位化取髖部速度，重複量數 ANOVA。結果（平均±SD）：%VDO 速度下降百分比 C100 91.2±4.9／DU1 86.8±5.0／DU2 82.5±5.2（C100 vs DU1 p=0.02、C100 vs DU2 p=0.01、DU1 vs DU2 p=0.03）；%VR 速度回復百分比 C100 91.1±11.8／DU1 96.3±11.6／DU2 97.3±10.2（C100 vs DU1 p=0.02、C100 vs DU2 p=0.01、DU1 vs DU2 p=0.39 不顯著）；最大膝屈角 36.1／33.7／31.6 度；完成踢腿時間 0.6／0.7／0.7 秒。手臂產生的髖部峰值速度（2.2／1.9／1.9 m/s）與腿產生的髖部峰值速度（2.0／1.9／1.8 m/s）**各組間都沒有顯著差異**。使用邊界三條：① 本研究測的是週期內髖部速度起伏，**沒有測游速或成績**——摘要寫的是 higher swimming velocities may be achieved，是推論不是量測；② n=9、單次施測、受試者是被口頭提示改變時機，不是慣用晚踢者，不能外推成長期訓練效果；③ 越晚踢越好的趨勢在 DU2 仍持續，所以「晚踢」不是一個有最佳點的已知答案。附帶：Adam Peaty 的歸屬有原文根據，本論文前言明寫 2016 奧運 Peaty 以「比慣常教法更晚踢」的技術破世界紀錄，並以此為研究動機。另：本登錄原顯示字串宣稱「亦見 Journal of Swimming Research Vol. 26」，全文與參考書目均查無此篇（該論文引用的 JSR 只有 13(1)、(4)、21(1) 三筆），2026-09-06 撤除該書目宣稱。"

