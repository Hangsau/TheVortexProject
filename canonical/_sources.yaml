  - id: src.wolf-2009-ncaa-swimming-injury-patterns
    display: "Wolf BR, Ebinger AE, Lawler MP, Britton CL. (2009). Injury patterns in Division I collegiate swimming. Am J Sports Med 37(10):2037-42."
    title: "Injury patterns in Division I collegiate swimming."
    type: journal-article
    verification_status: verified
    authors: ["Wolf BR", "Ebinger AE", "Lawler MP", "Britton CL"]
    year: 2009
    container: "The American Journal of Sports Medicine"
    identifier:
      pmid: "19633232"
      doi: "10.1177/0363546509339364"
    retrieved_on: "2026-08-17"
    notes: >-
      2026-08-17 查證新增。單一 NCAA Division I 隊伍 2002–2007 五季、44 男 50 女：
      傷害率男 4.00／1000 exposures、女 3.78；37% 造成缺席。
      **傷害部位第一為肩／上臂，其次頸／背**；大一新生傷害最多，年級越高傷害越少。
      非自由式專項相對風險略高（RR 1.33, 1.00–1.77，下界貼 1）。
      **38% 的傷害發生在練習與比賽之外的隊務活動（如重量訓練）**——這是常被略過的一項。
      部位與泳式專項之間**無顯著關聯**。
      **使用邊界**：① 單一隊伍、n 小，屬描述性流行病學，不是族群估計；
      ② 2009 年資料，訓練型態已可能改變（🟡 級）；③ 同樣**未單列肘部**。

