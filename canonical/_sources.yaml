    notes: >-
      2026-08-17 查證新增。**術語更正（本章最主要的內容）**：「shallow water blackout」一詞
      經常被誤用為「過度換氣後的溺水」的同義詞；美國紅十字會、YMCA 與 USA Swimming 已把本症改稱
      **hypoxic blackout**，定義為「閉氣潛沒（且潛前有過度換氣）期間，在排除其他意識喪失原因後，
      水下泳者或潛水者發生的意識喪失」。典型發生於**水深 5 m（15 ft）以內**，但溺水可發生於任何深度，
      「淺水」一詞本身有誤導性。存活取決於即時有效的救援，延誤即提高致死風險。
      **使用邊界**：StatPearls 屬教科書層級證據，非原始研究；**本章不提供任何發生率或死亡率數字**，
      不得拿來支撐盛行率宣稱。

