    authors: ["Swimming Australia"]
    container: "Swimming Australia / Swimming WA"
    identifier:
      url: "https://wa.swimming.org.au/sites/default/files/assets/documents/S%26C%20Exercises%20for%20Development%20Level%20Swimmers.pdf"
    retrieved_on: "2026-09-06"
    notes: >-
      2026-09-06 下載原始 PDF（16 頁）逐句核對。原文可支持者：
      ①「Swimming Australia 的建議是**尚未達到生長陡增期的運動員只做自體重量動作**；
      本方案中使用負重阻力的動作因此是設計給**女生 13 歲以上、男生 14 歲以上**。」
      ② 每週 2–3 次、安排在非連續日；每個動作流各選 5–8 個動作，從 2 組開始。
      ③ 依澳洲肌力與體能協會（ASCA）指引的最低反覆次數：6–9 歲 15–18 次、9–12 歲 10–12 次、
      12–15 歲 8–10 次、15–18 歲 6–8 次，每次以 2 次為級距遞增。
      ④ **強烈建議 16 歲以下不做較進階的舉重動作**（奧林匹克舉重及硬舉、上膊、抓舉等衍生動作）；
      使用該動作流前須先精熟自體重量動作、並在合格教練直接督導下完成 4 年以上結構化課程。
      ⑤ 社區／俱樂部層級的陸訓教練至少須具 ASCA Level 1 資格。
      使用邊界：這是單一國家級協會的實務指引，不是實證研究；13／14 歲是對應族群平均 PHV 的
      **行政切分，不是生理臨界值**，個別泳者仍以實測成熟度為準。

