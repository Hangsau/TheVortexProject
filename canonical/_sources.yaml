  - id: src.vizsolyi-1987
    display: "Vizsolyi P, Taunton J, Robertson G, et al. (1987). Breaststroker's knee. An analysis of epidemiological and biomechanical factors. Am J Sports Med 15(1):63–71."
    type: journal-article
    verification_status: verified
    authors: ["P Vizsolyi", "J Taunton", "G Robertson", "L Filsinger", "H S Shannon", "D Whittingham", "M Gleave"]
    year: 1987
    title: "Breaststroker's knee. An analysis of epidemiological and biomechanical factors"
    container: "The American Journal of Sports Medicine"
    identifier:
      doi: "10.1177/036354658701500109"
      pmid: "3812862"
    retrieved_on: "2026-08-17"
    notes: >-
      問卷調查 n=391，另 21 人詳細評估（訪談、理學檢查、Cybex 等速肌力、電影動作分析）。
      膝痛盛行率：蛙式專項 73%、非蛙式專項 48%。受累部位為內側副韌帶與髕骨內下緣。
      **關鍵的陰性結果必須一併引用**：Cybex 肌力測試與運動學影片分析**未能**顯示傷者與
      非傷者間的統計差異。所謂「起踢時髖外展角 <37° 或 >42° 傷害率明顯上升」是作者在
      無統計顯著性的前提下描述的雙峰型態，**不是已達統計顯著的閾值**，引用時不得寫成
      實證閾值。1987 年舊文獻，標 🟡。

