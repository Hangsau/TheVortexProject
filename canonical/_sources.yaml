    title: "Descriptive Epidemiology of High School Swimming and Diving Injuries."
    type: journal-article
    verification_status: verified
    authors: ["Belilos E", "Jow S", "Maxwell M"]
    year: 2023
    container: "Clinical journal of sport medicine : official journal of the Canadian Academy of Sport Medicine"
    identifier:
      pmcid: "PMC10372189"
      pmid: "36715985"
      doi: "10.1097/JSM.0000000000001121"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 逐字比對摘要。High School RIO 全國傷害監測 2008–2019 學年：
      **563 件游泳與跳水傷害／2,171,260 人次暴露（0.26 件／1000 AE）**。
      女性傷害率高於男性（整體 RR 1.57、練習 RR 1.53、比賽 RR 1.81，均 P < 0.05）。
      **泳者以肩最多（48.6%）**，最常與自由式相關（67.3%），過度使用／慢性佔 58.0%；
      **跳水者以頭／臉最多（36.6%），接觸池面／地面所致佔 68.3%**。
      **使用邊界**：① 摘要**未列出肘部的獨立比例**，也**未報出腦震盪佔比**——
      「肘佔比低」「腦震盪為最常見傷型 31.7%」都不是本來源能支撐的數字；
      ② 族群為美國高中（約 14–18 歲），不可外推到成人分齡或菁英選手；
      ③ 分母是 athlete-exposure 不是人數；④ 便利取樣（參與回報的學校），非全國普查。
      2026-08-18 更正：第 2 批曾為同一篇另建 `src.belilos-2023-hs-swimming-injury-epi`，
      屬重複登錄，已刪除並統一回本 id。

