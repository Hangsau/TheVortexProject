  - id: src.spencer-2018-sipe-systematic-review
    display: "Spencer S, Dickinson J, Forbes L. (2018). Occurrence, Risk Factors, Prognosis and Prevention of Swimming-Induced Pulmonary Oedema: a Systematic Review. Sports Med Open 4(1):43."
    title: "Occurrence, Risk Factors, Prognosis and Prevention of Swimming-Induced Pulmonary Oedema: a Systematic Review."
    type: review
    verification_status: verified
    year: 2018
    authors: ["Spencer S", "Dickinson J", "Forbes L"]
    identifier:
      pmid: "30238206"
      doi: "10.1186/s40798-018-0158-8"
      pmcid: "PMC6146959"
    notes: >-
      2026-08-17 查證新增。**僅 9 篇研究納入，異質性太高而無法做量化統合**——引用時必須說出這點，
      否則會讓讀者以為那些百分比是統合估計值。各研究發生率彼此差距近三個數量級：
      英國鐵人賽 5 年 0.01%、瑞典河賽 3 天 0.5%、以色列海上計時游（三篇，男性青少年軍訓生）1.8–26.7%；
      另一篇報告美國鐵人選手 1.4% 曾經歷 SIPE。約 30% 的人會復發（兩篇研究）。
      **本回顧明確寫出「找不到任何報告 SIPE 死亡的研究」**——條目談致命性時必須誠實反映這點。
      西地那非預防復發只有兩篇極小型非對照研究，結論不確定，**不足以支撐任何用藥建議**。
      2019 年有勘誤（Sports Med Open 5(1):12）。

  - id: src.hardstedt-2021-sipe-incidence-cohort
    display: "Hårdstedt M, Kristiansson L, Seiler C, Braman Eriksson A, Sundh J. (2021). Incidence of Swimming-Induced Pulmonary Edema: A Cohort Study Based on 47,600 Open-Water Swimming Distances. Chest 160(5):1789–1798."
    title: "Incidence of Swimming-Induced Pulmonary Edema: A Cohort Study Based on 47,600 Open-Water Swimming Distances."
    type: journal-article
    verification_status: verified
    year: 2021
    authors: ["Hårdstedt M", "Kristiansson L", "Seiler C", "Braman Eriksson A", "Sundh J"]
    identifier:
      pmid: "34186036"
      doi: "10.1016/j.chest.2021.06.034"
      pmcid: "PMC8628172"
    notes: >-
      2026-08-17 查證新增。瑞典最大開放水域賽事 Vansbrosimningen，2016–2019 四年、47,573 人次前瞻世代。
      **SIPE 發生率 0.44%（CI 0.39–0.51）**，逐年 0.34%／0.47%／0.41%／0.57%。
      性別差異極大：**女性 0.75% vs 男性 0.09%**（參賽男女比例相當，調整後 OR 8.59）；
      年齡自 18–30 歲 0.08% 升至 ≥61 歲 1.1%（最老 vs 最年輕 OR 12.74）。
      **使用邊界**：① 分母是「游程人次」不是「人數」；② 2016–2017 靠臨床判斷、2018–2019 才用肺部超音波診斷，
      前後兩期的病例定義不同；③ 這是單一賽事單一國家，不可外推成全球發生率。

  - id: src.volk-2021-sipe-navy-seal
    display: "Volk C, Spiro J, Boswell G, et al. (2021). Incidence and Impact of Swimming-Induced Pulmonary Edema on Navy SEAL Candidates. Chest 159(5):1934–1941."
    title: "Incidence and Impact of Swimming-Induced Pulmonary Edema on Navy SEAL Candidates."
    type: journal-article
    verification_status: verified
    year: 2021
    authors: ["Volk C", "Spiro J", "Boswell G", "Lindholm P", "Schwartz J", "Wilson Z", "Burger S", "Tripp M"]
    identifier:
      pmid: "33245874"
      doi: "10.1016/j.chest.2020.11.019"
    notes: >-
      2026-08-17 查證新增。美國海軍特種作戰儲訓生 2,117 人、15 個月前瞻觀察，**SIPE 106 例（5.0%）**，
      另有 10 例為已診斷者的再次發作。症狀：咳嗽 90.4%、粉紅泡沫痰 35.6%、咳血 23.7%；
      80.1% 的人血氧仍 ≥ 90%，23% 理學檢查完全正常。**ECG 對診斷與篩檢皆無用**；身高體重與風險無關。
      **使用邊界**：受試者是年輕男性軍事儲訓生、承受極端訓練負荷，
      5.0% **絕不可外推到一般開放水域泳者或鐵人選手**（同期一般賽事族群約 0.44%，相差逾十倍）。

