      作者自稱是蛙泳膝的首例 MRI 影像報告。**不得用於任何發生率宣稱**。
      本條的真正價值在其背景陳述，且該陳述直接影響 Vortex 既有的 contested 標記：
      **關節鏡研究至今未能找出對應蛙泳膝的特定結構異常**，僅部分報告觀察到增厚的內側滑膜皺襞、
      以內側為主的滑膜炎、或髕股軟骨流失與蛙式選手膝痛併存。
      因此「蛙泳膝的主要病理是 MCL 還是髕股／皺襞」不是資料不足的暫時分歧，
      而是**結構層面至今無定論**——引用時不得寫成任一子型已被確立。標 🟡。

