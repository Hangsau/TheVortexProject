  - id: src.mdi-management-review-annals-of-joint
    display: "Bishop ME, Patel H, Erickson BJ, Dodson CC. (2022). Multidirectional instability in female athletes. Ann Joint 7:10."
    title: "Multidirectional instability in female athletes."
    type: review
    verification_status: verified
    authors: ["Bishop ME", "Patel H", "Erickson BJ", "Dodson CC"]
    year: 2022
    container: "Annals of Joint"
    identifier:
      pmid: "38529164"
      pmcid: "PMC10929405"
      doi: "10.21037/aoj-20-33"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 定位成功。原顯示字串「MDI management review」把它描述成一般性的 MDI 處置綜述，
      **實際標題是「Multidirectional instability in female athletes」**，
      屬 Annals of Joint「女性運動員運動傷害」專輯的**敘事性綜述**。
      內容要點：MDI 定義為廣泛性關節囊鬆弛加上一個方向以上的症狀性不穩且必含下方不穩；
      女性因關節鬆弛度較高而特別易患 MDI（男性整體肩不穩較高，但主因是接觸性運動等外在因子）；
      **治療主軸是強化動態穩定肌群的物理治療**，復健失敗者才考慮開放或關節鏡關節囊緊縮術。
      **使用邊界**：① **敘事性綜述，非系統回顧、無合併統計**，不可引用為量化證據；
      ② 視角是**女性運動員**，當成性別中立的處置準則會失真；
      ③ 未針對游泳專項，游泳者 MDI 需另尋來源。

