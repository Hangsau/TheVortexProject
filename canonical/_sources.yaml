  - id: src.harvey-2024-asia-pacific-hip-fracture-mortality
    display: "Harvey LA, Payne NL, Tan A, et al. (2024). Variation in mortality following hip fracture across the Asia Pacific region: Systematic review and proportional meta-analysis. Arch Gerontol Geriatr 126:105519."
    title: "Variation in mortality following hip fracture across the Asia Pacific region: Systematic review and proportional meta-analysis."
    type: review
    verification_status: verified
    year: 2024
    authors: ["Harvey LA", "Payne NL", "Tan A", "Zhang J", "Lai YC", "Taylor ME", "Armstrong E", "McVeigh C", "Mikolaizak AS", "Hairu R", "Scott TA", "Bishop M", "Close J"]
    identifier:
      pmid: "38941947"
      doi: "10.1016/j.archger.2024.105519"
    notes: >-
      2026-08-17 查證新增。244 篇研究納入統合；其中一年死亡率由 142 篇（1,139,752 人、14 個國家／地區）貢獻，
      **範圍自新加坡 10.8%（95%CI 9.6–12.1）至澳洲 23.3%（95%CI 22.3–24.5）與紐西蘭 23.8%**。
      **使用邊界**：① 引用「一年死亡率」時必須同時說出是哪個地區——本研究的核心結論就是「亞太區內差異極大」，
      給單一數字等於抹掉該研究的結論；② 亞洲國家短期死亡率低至澳紐的四分之一，一年期仍約為一半，
      因此**不得把西方族群的 20–30% 直接套用於台灣讀者**；③ 收案為 ≥50 歲低能量創傷髖骨折住院者，非游泳族群。

