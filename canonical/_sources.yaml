    notes: "2026-09-06 首次登錄。三方聯合聲明本身只給定義與立場，可操作的條文在這份簡報裡，因此分開登錄：教學端限下潛前單次吸氣、水下活動不得競賽化或反覆、不得出『看誰遠／看誰久』的題目；救生員端明列為 prohibit（禁止並介入制止），且涵蓋競技隊訓練；教練端原文是『generally conduct this activity on the surface of the water (except dolphin kick training)』，附帶只用於有經驗且狀況良好的泳者、一至多兩口深呼吸、限制反覆次數、給足恢復。這段原文很重要——本庫原本把它寫成『任何缺氧訓練只能在水面做，不能在水下做』的絕對禁令，漏掉了 generally 與海豚腿例外，已更正（見 breathing.safety.hypoxic_blackout 的 policy_boundary_zh）。另提供一組本庫先前沒有的頻率數字：YMCA 系統泳池自 2008 年起至少 5 起缺氧昏迷死亡、至少 18 人失去意識後獲救。"

