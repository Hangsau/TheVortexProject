  - id: src.seiler-kjerland-2006
    display: "Seiler KS, Kjerland GØ. (2006). Quantifying training intensity distribution in elite endurance athletes: is there evidence for an \"optimal\" distribution? Scand J Med Sci Sports 16(1):49-56."
    title: "Quantifying training intensity distribution in elite endurance athletes: is there evidence for an optimal distribution?"
    type: journal-article
    verification_status: verified
    authors: ["Seiler KS", "Kjerland GØ"]
    year: 2006
    container: "Scandinavian Journal of Medicine & Science in Sports"
    identifier:
      pmid: "16430681"
      doi: "10.1111/j.1600-0838.2004.00418.x"
    retrieved_on: "2026-09-06"
    notes: >-
      2026-09-06 核對摘要。原文可支持者：11 名男性越野滑雪選手，連續 32 天共 384 堂課
      （37 堂力量、347 堂耐力），以通氣閾值 VT1/VT2 劃三區；耐力課（n=318）的強度分布
      心率法為 Z1 75±3%／Z2 8±3%／Z3 17±4%，session RPE 法為 76±4／6±5／18±7；
      另 60 堂課的血乳酸法為 ≤2.0 mM 占 71%、2–4 mM 占 7%、>4 mM 占 22%。
      **使用邊界：受試者原文為 well-trained junior / nationally competitive junior skiers**
      （全國賽層級青少年），標題中的 elite endurance athletes 指的是對照的文獻族群，
      引用時不得把受試者寫成菁英。分布百分比的單位是**課次**，不是時間。

  - id: src.seiler-2010
    display: "Seiler S. (2010). What is best practice for training intensity and duration distribution in endurance athletes? Int J Sports Physiol Perform 5(3):276-291."
