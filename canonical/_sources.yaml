    authors: ["Harvey LA", "Payne NL", "Tan A", "Zhang J", "Lai YC", "Taylor ME", "Armstrong E", "McVeigh C", "Mikolaizak AS", "Hairu R", "Scott TA", "Bishop M", "Close J"]
