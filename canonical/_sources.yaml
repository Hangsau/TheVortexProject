    display: "Swimming Australia. Strength & Conditioning Exercises for Development Level Swimmers（16 頁海報式陸上訓練指引，經 Swimming WA 官網發布）。"
    title: "Strength & Conditioning Exercises for Development Level Swimmers"
    type: web_guide
