  - id: src.bushman-2006
    display: "【查無此文獻】原記為「Bushman et al. 2006, Phys Sportsmed（早期 OC × VO₂max 量化）」，該期刊無此作者文獻"
    type: other
    verification_status: unverified
    authors: ["Bushman"]
    et_al: true
    year: 2006
    retrieved_on: "2026-08-17"
    notes: >-
      **2026-08-17 查證結果：定位失敗，本 id 不得當作證據使用。**
      `Bushman[au] AND "Phys Sportsmed"[ta]` 回傳 **0 筆**；`Bushman[au] AND (VO2 OR "aerobic capacity")` 亦無相符文獻。
      唯一真實存在的 Bushman × 口服避孕藥文獻是
      **Bushman B, Masterson G, Nelsen J. (2006). Anaerobic power performance and the menstrual cycle:
      eumenorrheic and oral contraceptive users. J Sports Med Phys Fitness. PMID 16596112**
      ——**期刊不同（J Sports Med Phys Fitness ≠ Phys Sportsmed）、測量指標不同（無氧功率 ≠ VO₂max）**，不能認定為同一篇。
      即使認定為同一篇，該研究測的是無氧功率與月經週期，**也無法支撐它目前掛著的「OC 使用率 30–50%」盛行率主張**
      ——那是流行病學使用率，不是運動表現研究的輸出。此為「來源存在與否」之外的第二層錯誤：**引用與主張不對應**。

