  - id: src.hardstedt-2021-sipe-incidence-cohort
    display: "Hårdstedt M, Kristiansson L, Seiler C, Braman Eriksson A, Sundh J. (2021). Incidence of Swimming-Induced Pulmonary Edema: A Cohort Study Based on 47,600 Open-Water Swimming Distances. Chest 160(5):1789–1798."
    title: "Incidence of Swimming-Induced Pulmonary Edema: A Cohort Study Based on 47,600 Open-Water Swimming Distances."
    type: journal-article
