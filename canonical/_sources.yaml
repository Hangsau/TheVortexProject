  - id: src.rovere-nichols
    display: "Rovere GD, Nichols AW. (1985). Frequency, associated factors, and treatment of breaststroker's knee in competitive swimmers. Am J Sports Med 13(2):99–104."
    type: journal-article
    verification_status: verified
    authors: ["G D Rovere", "A W Nichols"]
    year: 1985
    title: "Frequency, associated factors, and treatment of breaststroker's knee in competitive swimmers"
    container: "The American Journal of Sports Medicine"
    identifier:
      doi: "10.1177/036354658501300204"
      pmid: "3985267"
    retrieved_on: "2026-08-17"
    notes: >-
      2026-08-17 由「作者/年份/期刊待查」的記憶式引用查證定位完成（PubMed esearch → efetch）。
      n=36 競技蛙式選手，訪談＋理學檢查。86% 曾有至少一次蛙式相關膝痛，47.2% 每週至少一次。
      與較頻繁膝痛顯著相關者：年齡增加、競賽年數增加、**蛙式訓練距離增加、暖身距離減少**。
      **方向必須照抄**：頻繁膝痛者被發現的是**髖關節內旋（internal rotation）活動度較低**——
      **不是**外旋不足。Vortex 舊草稿寫「髖外旋活動度不足」屬歸因錯誤，已於 2026-08-17 更正。
      另：每週膝痛者中 47% 有壓痛且增厚的內側滑膜皺襞，觸診可誘發與蛙踢相同的疼痛。
      作者建議處置順位為**先減蛙式訓練距離**，其次冰敷、改踢腿技術、增加髖旋轉的伸展、
      並確保暖身距離足夠。僅取得摘要層級，1985 年舊文獻，標 🟡。

