      否則會讓讀者以為那些百分比是統合估計值。各研究發生率彼此差距近三個數量級：
      英國鐵人賽 5 年 0.01%、瑞典河賽 3 天 0.5%、以色列海上計時游（三篇，男性青少年軍訓生）1.8–26.7%；
