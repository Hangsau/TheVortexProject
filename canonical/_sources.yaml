    display: "Helmich I, Chang YY, Gemmerich R, et al. (2024). Neurobehavioral consequences of repetitive head impacts in Para swimming: A case report. J Sci Med Sport 27(1):16-19."
    title: "Neurobehavioral consequences of repetitive head impacts in Para swimming: A case report."
    type: journal-article
    verification_status: verified
    authors: ["Helmich I", "Chang YY", "Gemmerich R", "Rodrigo L", "Funken J", "Arun KM", "Van de Vliet P"]
    year: 2024
    container: "Journal of Science and Medicine in Sport"
    identifier:
      pmid: "37923648"
      doi: "10.1016/j.jsams.2023.10.015"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 定位成功。**這是 n = 1 的個案報告**（標題即寫 "A case report"），
      受試者是一名 dysmelia（肢體缺損）Para 泳者：因缺乏可觸牆的肢體，**必須用頭撞牆完成比賽**。
      量測到平均撞擊 **13.6 g、平均撞擊力 6689.9 N**；有撞擊的 T1 前後行為與腦功能指標下降，
      無撞擊的 T2 則否。
      **使用邊界**：① **單一受試者，不能當發生率或風險證據**，
      只能支撐「此機制在 Para 游泳存在且可量測」；
      ② 受影響族群是**肢體缺損（用頭觸牆）選手，不是視覺障礙選手**——
      原條目寫成視障選手的累積風險是族群張冠李戴；
      ③ 原顯示字串只寫「ScienceDirect 2023/2024」，年份含糊：
      線上先行 2023-10-24、正式刊期 2024 年 1 月。

