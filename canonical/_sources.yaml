  - id: src.lebrun-2003-triphasic-oc-vo2max
    display: "Lebrun CM, Petit MA, McKenzie DC, Taunton JE, Prior JC. (2003). Decreased maximal aerobic capacity with use of a triphasic oral contraceptive in highly active women: a randomised controlled trial. Br J Sports Med 37(4):315–320."
    type: journal-article
    verification_status: verified
    authors: ["Lebrun CM", "Petit MA", "McKenzie DC", "Taunton JE", "Prior JC"]
    et_al: false
    year: 2003
    identifier:
      pmid: "12893716"
      doi: "10.1136/bjsm.37.4.315"
      pmcid: "PMC1724664"
    retrieved_on: "2026-08-17"
    notes: >-
      2026-08-17 新增。這才是 Vortex「三相型 OC 使 VO₂max 下降」說法的真正出處
      （原本掛在查無此文的 `src.bushman-2006` 名下，且數字被放大）。
      **數字必須照抄，不得四捨五入或擴張**：雙盲安慰劑對照 RCT，**n = 14**（VO₂max ≥ 50 ml/kg/min 的高訓練量女性）；
      從濾泡期到 OC 期，OC 組 VO₂max **下降 4.7%**，安慰劑組 **+1.5%**。
      **這個 4.7% 出現時必須同時寫出 n=14。**
      **同研究的陰性結果一樣重要，引用 4.7% 時必須併陳**：無氧速度測試、
      **有氧耐力（90% VO₂max 力竭時間）**、等速肌力、最大通氣量、心率、呼吸交換率、血比容
      **均無顯著變化**；唯一另一項顯著者是皮脂厚度總和上升（p<0.01）。
      → 因此**不能**用本研究支撐「400m 以上耐力項目受影響顯著」——該研究直接測了耐力且測不出差異。
      作者結論用語為「may influence elite sporting performance in some women；仍需進一步研究」。
      另注意「兩名受試者下降 4 與 9 **ml/kg/min**」是**絕對值**，不是百分比，
      舊稿的「6–15%」「10–11%」疑似由此誤讀而來，已於同日撤除。

