  - id: src.cossor-2001
    display: "Cossor, J. M., & Mason, B. R. (2001). Swim start performances at the Sydney 2000 Olympic Games. In J. R. Blackwell & R. H. Sanders (Eds.), Proceedings of Swim Sessions, XIX International Symposium on Biomechanics in Sports (pp. 70-74). San Francisco: University of San Francisco."
    title: "Swim start performances at the Sydney 2000 Olympic Games"
    type: conference_paper
    verification_status: verified
    authors: ["J. M. Cossor", "B. R. Mason"]
    year: 2001
    publisher: "ISBS Conference Proceedings Archive"
    identifier:
      url: "https://ojs.ub.uni-konstanz.de/cpa/article/view/3870"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 查證。本文分析雪梨 2000 奧運游泳項目決賽與準決賽選手的出發表現，把總出發時間定義為「起跳訊號到頭部中心通過 15 公尺」，並拆成 on-block／flight／underwater 三個次階段。可引用的結論有二：① 出發時間佔全程比賽時間 0.8%–26.1%（隨項目距離而變，距離越短佔比越高）；② 決定出發快慢最顯著的變數，男女組都是水下距離與水下時間——水下距離與 15 公尺時間呈負相關，也就是待在水下越久（在規則允許內）到 15 公尺越快。使用邊界：**本文沒有報告 11%／5%／84% 這組三階段時間佔比**。該組數字出自 Slawson 等人 2013（見 src.slawson-2013-osb11-start-categorisation），Tor 2015 博論第 73 頁逐字寫的是 approximately 11%, 5% and 84% respectively (Slawson, Conway, Cosser, Chakravorti, & West, 2013)——該處把 Cossor 拼成 Cosser，本庫先前的誤植極可能由此而來。2026-09-06 已把 84% 從本登錄名下移除。"

