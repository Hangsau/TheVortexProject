    notes: >-
      **2026-08-17 查證結果：定位失敗，本 id 不得當作證據使用。**
      NCBI E-utilities 以 `Akkurt[au] AND 2017[dp] AND "J Phys Ther Sci"[ta]` 檢索回傳 0 筆；
      放寬為 `Akkurt[au] AND (contracture OR "spinal cord")` 後，2017 年唯一相符者為
