  - id: src.ansi-nfsi-b101-1
    display: "NFSI B101.1-2022, Test Method for Measuring the Wet SCOF of Hard-Surface Walkways（沿革：ANSI/NFSI B101.1-2009 初版 → NFSI B101.1-2020 → NFSI B101.1-2022 現行版）"
    title: "Test Method for Measuring the Wet SCOF of Hard-Surface Walkways"
    type: guideline
    verification_status: verified
    year: 2022
    identifier:
      url: "https://webstore.ansi.org/standards/nfsi/nfsib1012022"
    notes: >-
      2026-08-17 新增，用以取代原先誤掛在 ASTM F2508 下的摩擦係數門檻。本標準把**濕態靜摩擦係數（wet SCOF）**分三級：
      **≥ 0.60 高抓地力／0.40–0.59 中等（標示為 slip-resistant）／< 0.40 低抓地力**；2026-09-04 覆核 2022 版門檻未變。
      **2026-09-04 更正三處**：① 現行版**不是 ANSI 標準**——NFSI 自 2006 至 2019 為 ANSI 認證的標準制定組織，
      2020 年終止與 ANSI 的關係轉為獨立 SDO，故 2020 版起 designation 由「ANSI/NFSI B101.1」改為「NFSI B101.1」，
      只有 2009 初版才是 American National Standard，本 id 的 slug 保留初版寫法只作機器鍵，不代表現行版性質；
      ② 標題在改版時已更動——2009 版為 Common Hard-Surface Floor **Materials**，2020 版起改為 Hard-Surface **Walkways**，
      原登錄把 2009 版標題掛在 2022 年份下；③ 沿革漏掉 2020 版，實為三版而非兩版。
      **使用邊界**：① 這三個數字全都是「濕態」值，不可拿來描述乾混凝土；
      ② 這是量測方法與分級標準，不是流行病學來源，不能用來支撐傷害發生率；
      ③ NFSI 宣稱「wet SCOF ≥ 0.60 可使滑倒索賠減少達 90%」屬該機構自述的關聯性數據，非同儕審查文獻，本專案不引用該 90%；
      ④ 它已非 ANSI 標準，援引時不得以「美國國家標準」的權威層級表述。

