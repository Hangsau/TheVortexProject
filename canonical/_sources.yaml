      即使認定為同一篇，該研究測的是無氧功率與月經週期，**也無法支撐它目前掛著的「OC 使用率 30–50%」盛行率主張**
      ——那是流行病學使用率，不是運動表現研究的輸出。此為「來源存在與否」之外的第二層錯誤：**引用與主張不對應**。

  - id: src.cdc-mmwr-2003-2007
    display: "Centers for Disease Control and Prevention. (2011). Estimated burden of acute otitis externa — United States, 2003-2007. MMWR Morb Mortal Wkly Rep 60(19):605-9."
    title: "Estimated burden of acute otitis externa--United States, 2003-2007."
    type: journal-article
    verification_status: verified
    authors: ["Centers for Disease Control and Prevention (CDC)", "Piercefield EW", "Collier SA", "Hlavsa MC", "Beach MJ"]
    year: 2011
    container: "MMWR. Morbidity and Mortality Weekly Report"
    identifier:
      pmid: "21597452"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 逐字比對摘要定位成功。原顯示字串「CDC MMWR 急性外耳道炎門診資料 2003–2007」
      沒有作者、期刊、卷期卻標「已驗證」；實際文獻**發表於 2011 年**，
      2003–2007 是資料期間不是文獻年份，原字串把兩者混為一談。
      摘要數字：**2007 年估計 240 萬次就診（每千人 8.1）**；2003–2007 年門診率
      以 5–9 歲最高（每千人 18.6）、10–14 歲次之（15.8）；**53% 的就診發生在 ≥20 歲成人**（每千人 5.3）；
      夏季高峰；南部區域最高（9.1）；年直接醫療費用達 5 億美元。
      **使用邊界**：① **240 萬次／每千人 8.1 是 2007 單年數字**，
      不可寫成「2003–2007 年年門診約 240 萬次」；
