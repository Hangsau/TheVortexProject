    authors: ["Brian A. Blanksby", "Jennifer R. Simpson", "Bruce C. Elliott", "Keith McElroy"]
    year: 1998
    container: "Journal of Applied Biomechanics"
    identifier:
      doi: "10.1123/jab.14.2.180"
      url: "https://doi.org/10.1123/jab.14.2.180"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 Crossref（ISSN 1065-8483 + 書目查詢）核對後獨立登錄，來自拆解誤標鍵 src.pmc8960438-a／-c。**本刊未被 PubMed 收錄，故無 PMID／PMCID**——原本兩個舊 id 上掛的 PMC8960438 是 Chainok 等 2022 年那篇的識別碼，與本篇無關。內容：23 名分齡蛙式泳者，各做三趟 50 m 推牆出發全力游；結果變項是「進牆前 5 m 到離牆 5 m」的往返時間（5 m RTT），水下攝影加測力板。與 5 m RTT 顯著相關（p < .01）的有：2.5 m RTT、50 m 成績、平均單划速度、峰值反作用力、pivot time、衝量、離牆峰值水平速度、手臂與腿部恢復划水的距離、出水距離、出水時間與出水水平速度，以及受試者的身高與體重。逐步迴歸留下的預測式是 17.113 − 0.322×出水距離 − 0.036×身高 − 0.723×出水水平速度 + 0.723×pivot time − 0.65×離牆峰值水平速度。轉身有淨收益：5 m RTT 涵蓋 20% 的距離，只佔總游泳時間的 18.26%。**使用邊界（重要）**：① 迴歸模型留下的預測項**全部在離牆側**（出水距離、出水水平速度、pivot time、離牆峰值水平速度）加上身高，**沒有任何一項是進牆速度**；本篇不能用來支持「進牆速度是轉身成績的首要預測變數」或「進牆速度越高、推出速度越高」。② 族群是分齡（青少年）泳者、泳式限蛙式、情境是 25 m 池；不可外推成所有泳式的轉身通則。③ 1998 年舊文獻，確定性標 🟡 不標 🟢。"

