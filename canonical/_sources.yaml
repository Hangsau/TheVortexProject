  - id: src.slawson-2013-osb11-start-categorisation
    display: "Slawson, S. E., Conway, P. P., Cossor, J., Chakravorti, N., & West, A. A. (2013). The categorisation of swimming start performance with reference to force generation on the main block and footrest components of the Omega OSB11 start blocks. Journal of Sports Sciences, 31(5), 468-478."
    title: "The categorisation of swimming start performance with reference to force generation on the main block and footrest components of the Omega OSB11 start blocks"
    type: journal_article
    verification_status: verified
    authors: ["S. E. Slawson", "P. P. Conway", "J. Cossor", "N. Chakravorti", "A. A. West"]
    year: 2013
    container: "Journal of Sports Sciences"
    identifier:
      pmid: "23131017"
      doi: 10.1080/02640414.2012.736631
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 取 PubMed 書目與摘要核對。本文主體是以 Omega OSB11 出發台主台與後踏板的測力元件峰值力，把出發動作分成九類；受試者 46 名英國菁英泳者、逾 1000 趟出發。本庫引用的不是這個分類法，而是文獻慣引到本文的「on-block／flight／underwater 三階段時間佔比約 11%／5%／84%」。使用邊界：這組數字不在本文摘要內，本庫是循 Tor 2015 博論第 73 頁的歸屬（見 src.tor-2015-underwater-phase-swimming-start）取得，未能開啟本文全文逐字確認，屬二手歸屬；可確定的只有「84% 不是 Cossor & Mason 2001 的數字」。"

  - id: src.tor-2015-underwater-phase-swimming-start
    display: "Tor, E. (2015). Factors affecting the underwater phase of the swimming start [Doctor of Philosophy thesis, Victoria University]."
    title: "Factors affecting the underwater phase of the swimming start"
    type: thesis
    verification_status: verified
    authors: ["Elaine Tor"]
    year: 2015
    publisher: "Victoria University (Institute of Sport, Exercise and Active Living)"
    identifier:
      url: "https://vuir.vu.edu.au/34057/1/TOR%20Elaine%20-%20thesis_nosignatures.pdf"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 取全文（232 頁）核對。以澳洲國家隊菁英泳者為對象，研究 Omega OSB11 kick-start 的水下階段。本庫取用兩件事：① 第 73 頁逐字「The percentage time contribution of each sub-phase is approximately 11%, 5% and 84% respectively (Slawson, Conway, Cosser, Chakravorti, & West, 2013)」——這是 84% 的歸屬證據，且該處把 Cossor 誤拼為 Cosser；② 第 111 頁逐字「水下階段是出發最長的一段，且多次被證實是決定整體出發效率最關鍵的一段（Cossor & Mason, 2001; Naemi & Sanders, 2008; Thow et al., 2012）」，以及水下階段可解釋出發時間 95% 的變異（Connaboy 2010; Tor 2014）。使用邊界：本論文的受試者是菁英 kick-start 使用者，2010 年 OSB11 出發台引入後的技術，早期 grab／track start 的數據不可直接套用。"
  - id: src.havriluk-2020-breaststroke-head-timing-delay
    display: "Havriluk, R. (2020, December 6). Swimming Technique Concepts: Breaststroke Breathing Head Timing Delay. Swimming World Magazine, December 2020 issue."
    title: "Swimming Technique Concepts: Breaststroke Breathing Head Timing Delay"
    type: web_article
    verification_status: verified
    authors: ["Rod Havriluk"]
    year: 2020
    container: "Swimming World Magazine"
    identifier:
      url: "https://www.swimmingworldmagazine.com/news/swimming-world-presents-swimming-technique-concepts-breaststroke-breathing-head-timing-delay/"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 取原文核對。Havriluk 是生物力學背景的技術評論者（Swimming Technology Research），本文主張蛙式換氣時頭部動作應晚於手臂動作啟動。可引的逐字內容：a swimmer begins the arm motion and then begins the head motion；As she begins her arm motion, her head stays in the streamline with her vision directed straight down until her hands come into her field of view；The head timing delay is only about one-quarter of a second；延遲結束時 she is already generating about 10 pounds of hand force。使用邊界：這是單一示範個案的影像＋測力分析，不是對照研究，沒有樣本數與統計；四分之一秒與 10 磅是該個案的值，不是族群常模。**本文沒有說「外划時換氣已不再被現代頂尖選手使用」，也沒有描述停停走走的節奏**，本庫原先掛在此人名下的那段敘述已改寫成本文真正說的內容。"

  - id: src.havriluk-2017-breathing-misconceptions-revisited
    display: "Havriluk, R. (2017, December). Technique Misconceptions: Breaststroke and Butterfly Breathing Revisited. Swimming World Magazine."
    title: "Technique Misconceptions: Breaststroke and Butterfly Breathing Revisited"
    type: web_article
    verification_status: verified
    authors: ["Rod Havriluk"]
    year: 2017
    container: "Swimming World Magazine"
    identifier:
      url: "https://www.swimmingworldmagazine.com/news/swimming-world-presents-technique-misconceptions-breaststroke-and-butterfly-breathing-revisited/"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 取原文核對，並與同作者 2015-06 與 2020-12 兩篇交叉比對，三篇立場一致。Havriluk 的主張是：換氣要在**頸部做完整活動範圍的伸展、同時下巴留在水面高度**，這樣身體反而更接近水平、阻力更小；他明確把「換氣時不應改變頸部角度」列為 technique misconception（2015 篇逐字：A common technique misconception is that a breastroker should not change the angle at the neck to breathe；An effective breathing motion requires extension at the neck through the full range of motion），並引 Urbanchek 1995 描述無效技術是 the angle at the neck was fixed so that it was like the head was in a cast with your neck and your shoulder。**本庫先前引用他來支持「頭部跟著肩胛骨移動、不獨立仰起」，方向剛好相反**，已於 2026-09-06 更正。使用邊界：本文是技術評論，只給質性描述（less vertical motion、more level body position），**沒有任何阻力或速度的量測值**；且他反對的是「抬頭、頸、上胸整塊出水」，不是反對維持身體水平。"

