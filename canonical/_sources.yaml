    notes: "2026-09-06 從 src.pmid-32119507 複合鍵拆出並首次獨立登錄。全文可核的數字寫在這裡供日後比對：16 例分布於 15 起事件（其中一起同時兩人），四人死亡；全體年齡 7–47 歲、平均 17 歲，16 人中 13 名男性；四名死者全部 17–22 歲、全為男性、全被列為 advanced 至 expert 等級的泳者、全部有刻意過度換氣。DUBB 三類行為＝刻意過度換氣、靜態閉氣、缺氧訓練（長距離水下游或延長閉氣間歇）；同時從事一種以上者致死風險上升。本文只提到一名『為了考海豹部隊而訓練』的個案，沒有任何軍方群體統計——本庫原本『美軍同期也有數十起相關溺斃』一句在本文中無據，已撤下。"

