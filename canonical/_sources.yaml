    notes: 2026-09-04 efetch 核對。**本條是補登錄，不是新增內容**——`free.tech.33` 的 mechanism 早就寫著「青年泳者統合結果顯示核心穩定訓練對短距離、尤其
      50 m 與仰式效果最明顯」，卻沒有對應的 evidence 也沒有任何來源；實查後這句逐字對得上本篇的 subgroup analysis，屬漏登錄而非捏造。數據：八個資料庫檢索、16 篇對照試驗（n=438）、PEDro
      評分、隨機效果模型；排除兩篇高異質性研究後，核心穩定訓練對游泳表現有中等且顯著的效果（**SMD = −0.71, 95% CI −0.91 至 −0.51, p < 0.00001, I² =
      21%**）；次群組分析顯示對 **50 m 衝刺與仰式**最有效；最有效的訓練參數為 **8 週、每週 ≤3 次、每次 >30–60 分鐘**；男性泳者的改善幅度略大於女性。**使用邊界**：①
      族群是**青年泳者**，作者結論明言「需要更多成人族群與長期介入的研究來確認持續效益」，不得外推到成人或 masters；② SMD 為負值代表成績時間縮短，引用時不要把負號讀成效果相反；③ 「對
      50 m 與仰式最有效」是**次群組分析**結果，次群組本就檢定力較低，不宜當成泳式間效果差異的定論；④ **本篇另有 2026-02-18 的更正啟事**（PMID 41709241），2026-09-04
      嘗試取回更正內容失敗（BMC 轉址 Springer 後回 303），**因此更正了什麼、是否影響效果量，本專案尚未核對**；引用本篇數字時須連帶意識到這一點。
