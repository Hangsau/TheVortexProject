  - id: src.ecg-scd-3-6-0-4-10-89-url
    display: "Corrado D, Basso C, Pavei A, Michieli P, Schiavon M, Thiene G. (2006). Trends in sudden cardiovascular death in young competitive athletes after implementation of a preparticipation screening program. JAMA 296(13):1593-601."
    title: "Trends in sudden cardiovascular death in young competitive athletes after implementation of a preparticipation screening program."
    type: journal-article
    verification_status: verified
    authors: ["Corrado D", "Basso C", "Pavei A", "Michieli P", "Schiavon M", "Thiene G"]
    year: 2006
    container: "JAMA"
    identifier:
      pmid: "17018804"
      doi: "10.1001/jama.296.13.1593"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 逐字比對摘要，**3.6 → 0.4／10 萬人年、降 89% 完全相符**（P for trend < .001）。
      義大利 Veneto 區 1979–2004 年 12–35 歲族群研究：篩查運動員 55 例心因猝死
      （1.9／10 萬人年），未篩查非運動員 265 例（0.79／10 萬人年）且期間**沒有顯著變化**——
      這個對照組才是「自然實驗」成立的關鍵。相對風險：早期篩查期 0.56（95% CI 0.29–1.15），
      晚期 0.21（0.09–0.48）。**下降幾乎全來自心肌病變猝死減少**（1.50 → 0.15／10 萬人年）。
      **使用邊界**：① 單一區域（Veneto）觀察性自然實驗，不是 RCT；
      ② 族群是**全體競技運動員，不是游泳者**——不能支撐游泳專項的篩查效益；
      ③ 這是義大利強制篩查制度下的結果，不可外推到篩查涵蓋率低的地區；
      ④ ACC/AHA 對常規 ECG 篩查的反對意見依然存在，本來源只是爭議的一方。

