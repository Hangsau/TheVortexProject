  - id: src.cochrane-2023-jellyfish-interventions
    display: "McGee RG, Webster AC, Lewis SR, Welsford M. (2023). Interventions for the symptoms and signs resulting from jellyfish stings. Cochrane Database Syst Rev 6(6):CD009688.（2013 年版 pub2 的更新）"
    title: "Interventions for the symptoms and signs resulting from jellyfish stings."
    type: review
    verification_status: verified
    year: 2023
    authors: ["McGee RG", "Webster AC", "Lewis SR", "Welsford M"]
    identifier:
      pmid: "37272501"
      doi: "10.1002/14651858.CD009688.pub3"
      pmcid: "PMC10240560"
    notes: >-
      2026-08-17 查證新增。9 篇研究（6 RCT + 3 quasi-RCT）、574 人。
      **作者結論一句話：「given the very low certainty of all the evidence, we are unsure of the
      effectiveness of any of the treatments evaluated」——所有處置方式的證據確定性都是 very low。**
      熱敷 vs 冷敷對 Physalia（僧帽水母）六小時內顯著止痛 RR 2.25（CI 1.42–3.56，2 篇 142 人），
      但對 Carybdea alata／Chironex fleckeri 為 RR 1.66（CI 0.56–4.94，2 篇 71 人，跨越 1）。
      局部外用（海水、淡水、Sting Aid、木瓜酵素嫩肉粉、異丙醇、氨水、加熱水、醋酸、碳酸氫鈉）**全部無法判定有效性**；
      其中氨水因一名受試者一度灼傷而中止。2013 年版另有一發現：醋或嫩肉粉相較熱水**使皮膚外觀更差**（RR 0.31, CI 0.14–0.72）。
      **使用邊界（極重要）**：① 本回顧**不支持任何具體水溫或浸泡時間**——2013 年版明言
      「what type of application, temperature, duration of treatment and type of water (salt or fresh)
      仍不清楚」，因此「43–45°C」這類具體數字不得掛在本來源下；
      ② 「箱型水母用醋」屬體外刺絲胞抑制實驗與地區急救指引的推論，**不是臨床試驗結論**，引用時須說明層級；
      ③ 本回顧只談處置，不含流行病學。

