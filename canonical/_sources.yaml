    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 解除引用。radiologykey.com 是**未經授權重製放射學教科書章節的網站**，
      相對應頁面為「Imaging of Water Sports Injuries」，**站上不顯示作者、年份、原書名與頁碼**，
      無法回溯到可重取的原始出處，也不應作為引用對象。原顯示字串卻標「已驗證」。
      **它承載的「踝部佔游泳整體傷害約 1%」因此失去來源支撐，且與實測資料衝突**：
      Trikha 等 2022 年 NCAA D-I 泳者資料中，540 件肌肉骨骼傷害裡
      **足／踝／小腿佔 81 件（15.0%）**（見 src.trikha-2022-collegiate-swimmer-health-events）。
      兩者分組範圍不同（單指踝 vs 足踝小腿合計），不足以直接否證，
      但 1% 與 15% 差一個數量級，在原數字連作者年份都沒有的情況下不得續用。
      該頁唯一仍具參考價值的敘述（蛙鞋致踝足骨髓應力反應與伸肌支持帶／肌腱部分損傷）
      屬影像學描述性觀察，已改以 🟠 觀察等級處理，不作流行率數字。
      本 id 保持 unverified 且不得再被引用。

