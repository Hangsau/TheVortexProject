      本次以 PubMed esearch 三組關鍵字重查（不接受前人「搜不到」當結論），
      候選 PMID 41342747／33010194／21893484／35291633／30787648／27409075 逐篇讀摘要。
      其中 PMID 41342747（Li & Liu, J Sports Med Phys Fitness 2026;66(1):82-91，
      45 年游泳肌骨傷害系統綜述＋統合分析，n=10,973，膝傷見於 34/94 篇＝36.1%）
      確實是一篇涵蓋膝傷的游泳流病系統綜述，但**沒有任何依據能證明它就是本佔位字串所指**——
      掛上去等於憑空造出歸因。若日後真要引用該篇，另行以其真實身分登錄新 slug，
      不得回填本墓碑。
      墓碑保留是為了擋住同一個空字串被重新登錄。

