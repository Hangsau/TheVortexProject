    display: "Tsai CT, Lin JN, Lee CH, Sun W, Chang YC, Chen YH, Lai CH. (2020). The epidemiology, characteristics and outbreaks of human leptospirosis and the association with animals in Taiwan, 2007-2014: A nationwide database study. Zoonoses Public Health 67(2):156-166."
    title: "The epidemiology, characteristics and outbreaks of human leptospirosis and the association with animals in Taiwan, 2007-2014: A nationwide database study."
    type: journal-article
    verification_status: verified
    year: 2020
    authors: ["Tsai CT", "Lin JN", "Lee CH", "Sun W", "Chang YC", "Chen YH", "Lai CH"]
    container: "Zoonoses and Public Health"
    identifier:
      pmid: "31916706"
      doi: "10.1111/zph.12667"
    retrieved_on: "2026-08-17"
    notes: >-
      2026-08-17 查證新增，用以取代「台灣為鉤端螺旋體中度流行區」這句原本無來源的敘述。
      台灣疾管署 2007-10 至 2014-12 全國通報資料：10,917 例通報，其中 665 例（6.1%）確診。
      **年平均發生率 0.4/100,000。** 確診者集中於高屏（248 例，37.3%）與台北（174 例，26.2%）。
      確診 vs 未確診者比較：男性 83.6% vs 67.9%、高風險職業（農民／畜牧／獸醫）24.8% vs 13.7%、
      接觸鼠 8.6% vs 4.9%、接觸豬 9.4% vs 1.9%（均 p < .01）。北部以鼠、南部以豬為主要暴露。
      2009 年屏東因水災合併豬隻曾發生群聚。另有 23 例合併恙蟲病、4 例合併 Q 熱。
      **使用邊界（重要）**：① 本研究確立台灣為地方流行區，但**確診病例的風險輪廓是職業性與洪災暴露，
      不是娛樂性開放水域游泳**——引用時不得把它讀成「台灣泳者感染風險高」；
      ② 開放水域賽事群聚的證據來自國外（見 src.pmc2858141，德國三鐵賽事），台灣尚無對應世代；
      ③ 0.4/100,000 是全人口年發生率，不是水域暴露者的發生率。

