      2016-17 與 2019-20 學年回溯資料：**641 名泳者（男 301／女 340）、1030 件健康事件**
      （女性 635 件 61.7%、男性 395 件 38.3%）。
      **540 件肌肉骨骼傷害的部位分布：肩 126（23.3%）、脊椎 95（17.6%）、
      足／踝／小腿 81（15.0%）、膝／大腿 67（12.4%）、手／腕／前臂 52（9.6%）**。
      490 件非肌肉骨骼事件：呼吸道感染 119（24.3%）、未指明內科疾病 93（19.0%）、
      **腦震盪 58（11.8%）**、**耳部感染 25（5.1%）**、腸胃道 24（4.9%）。
      女性泳者肌肉骨骼傷害 RR 1.5（95% CI 1.22–1.83）、非肌肉骨骼 RR 1.32（1.04–1.68）；
      腦震盪女性 9.1% vs 男性 4.3%（RR 2.11，1.13–3.96）；
      58 件腦震盪中 8 件（13.8%）終結該季、14 件（24.1%）終結運動生涯。
      **使用邊界**：① 單一聯盟回溯性資料，分母是**事件數不是人次暴露**，
      不可與 High School RIO 的「每 1000 AE」直接比較；
      ② 「足／踝／小腿」是**合併分組**，不等於單獨的踝關節佔比；
      ③ 菁英大學層級，不可外推到兒童、成人初學或分齡選手。

