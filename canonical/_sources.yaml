      2026-09-04 起本庫「80/20」說法的來源。核對摘要，原文寫的是：每週訓練 10 至 13 次的
      全國／國際級耐力選手，其強度分布收斂於「約 80% 的**課次**在低強度（2 mM 血乳酸）、
      約 20% 由高強度區段（如約 90% VO2max 的間歇）主導」。另一句常被略過但對本庫重要：
      對已經訓練有素的選手，加重高強度間歇的訓練強化研究**並未提供令人信服的長期成績增益證據**。

