# ── 欄位契約（v2；S3a 修訂）─────────────────────────────────────────────────
#
# 【為什麼 v1 契約要改】
# v1 把 title / authors / year / identifier / retrieved_on 全列為「必填」，
# 並要求 identifier 至少有一個可重取識別（doi/pmid/pmcid/isbn/url）。
# 但 S3a 實際遷移的 138 筆顯示字串，多數只有「作者＋年份」（如 Nicol et al. 2022），
# 有些連作者都沒有（如 PMC6409673、PLOS ONE 2020），甚至根本不是文獻
# （如「通用游泳醫學共識」）。照 v1 契約走，唯一能「填滿」的方法就是去猜 DOI、
# 猜期刊、猜完整標題——這正是專案與 knowledge-hub 規則明文禁止的捏造。
#
# 因此 v2 改成「條件必填」：無條件必填的只有那些「不查證也能確定為真」的欄位；
# 其餘欄位只有在 verification_status: verified（真的查證過）時才必填。
# 寧可讓資料看起來不完整，也不讓它看起來完整但其實是編的。
#
# 【無條件必填】
#
#   id            string  格式 src.<slug>；全域唯一
#
#   display       string  來源在 canonical 條目中的原始顯示字串，**逐字保留**。
#                         這是溯源錨點：S3c 查證時要靠它對回原文位置。
#                         條目端的 source 欄位不得為了對齊本欄而改寫。
#
#   type          string  值域（封閉清單）：
#                           journal-article / review / book / book-chapter /
#                           guideline / org-page / dataset / video / other
#                         S3a 判型規則（保守）：只有顯示字串**明講**才標非 other——
#                           book   字串點名書（Maglischo《Swimming Fastest》）
#                           review 字串寫明 systematic review
#                         其餘一律 other。**不得**因為看到期刊名或 PMID 就推定
#                         journal-article；那是猜測不是轉錄。
#
#   verification_status  string  值域（封閉清單，只有兩個值）：
#                           verified    識別碼已實際 dereference 並確認
#                                       與本筆的作者／年份／標題相符
#                           unverified  尚未查證，或字串資訊不足以查證
#                         注意：本欄講的是「來源查驗狀態」，與條目上的確定性
#                         標記（🟢🟡🟠🔴🔵）是兩回事，不可互相代替。
#
# 【verification_status: verified 時必填；unverified 時可省略或留 null】
#
#   title         string  完整標題。不確定就**不要填**，不要用摘要或自造描述充數。
#
#   authors       list    作者姓名字串清單；組織作者用組織名稱。
#                         unverified 階段只填顯示字串裡真的出現的姓氏，不展開 et al.；
#                         verified 後改用權威 metadata 回傳的完整作者清單。
#                         et_al 仍保留為原始 display 曾略記作者的溯源標記。
#
#   year          int     發表年份（西元年）。顯示字串給不出單一明確年份時留空。
#
#   identifier    mapping 可重取識別，可含 doi / pmid / pmcid / isbn / url。
#                         verified 時至少要有一個。
#                         unverified 時可為空 mapping {} 或整個省略。
#                         顯示名稱、期刊縮寫、「文獻／教練觀測」等級都不算識別。
#
#   retrieved_on  string  查驗日 YYYY-MM-DD。**只有真的查過才填**。
#                         unverified 一律不填——沒查過就沒有查驗日。
#
# 【選填】
#
#   container     string  期刊名／書名／機構名。S3a 一律不填：從顯示字串推期刊名
#                         風險過高，留給 S3c 查證時一併補。
#
#   et_al         bool    顯示字串以 et al. 略記，代表 authors 蓄意不完整。
#                         用布林欄位標記，而不是把字面 "et al." 塞進 authors——
#                         那會讓它看起來像一個人名。
#
#   notes         string  補充說明：疑似重複、複合字串、無法定位、待辦事項等。
#
# ── ID 命名與消歧規則（S3a 定案）──────────────────────────────────────────
#
# slug 依序取第一個可用者：
#   1. 第一作者姓 + 年份        → src.nicol-2022、src.maglischo-2003
#   2. 無作者但有 PMCID         → src.pmc6409673
#   3. 無作者但有 PMID          → src.pmid-24984154
#   4. 無作者但有 DOI           → 取 DOI 末段  src.journal-pone-0241345
#   5. 以上皆無                 → 由顯示字串轉寫的描述性 slug
#
# 【消歧：碰撞時加 -a / -b / -c，且刻意不合併】
# 同姓同年（或同識別碼）會碰撞，例如：
#   "Staunton et al. 2025" 與 "Staunton, Ruiz-Navarro & Born 2025"
# 這兩個字串**有可能是同一篇，也可能是不同篇**——在沒有 DOI 的情況下無法確定。
# 規則是：碰撞者各給獨立 ID（依 display 字串排序加 -a/-b/-c 後綴），
# 並在 notes 互相標注「疑似同一文獻，待 S3c 查證後合併」。
#
# **寧可留下可合併的重複，不可誤併成一筆。**
# 誤併會把兩篇不同文獻的主張混在同一個 source_id 底下，事後從資料上看不出來；
# 重複則只是暫時多幾筆，S3c 查到 DOI 後合併是安全的單向操作。
#
# 【後續批次：字母只能往後續排，既有 ID 一律不動】（S3a-2 定案）
# 已寫進 canonical 的 source_ids 是契約。新來源若與既有 ID 撞 base：
#   * 既有已用 -a/-b 者，新成員從 -c 起續排；
#   * 既有是無字母的 src.<base>，視同佔用 -a 位，新成員從 -b 起續排，
#     不得為了整齊把既有那筆改成 src.<base>-a。
# 兩邊在 notes 互相標注（既有那筆追加「S3a-2 補記」句），關係靠 notes 表達，不靠改 ID。
#
# ── 使用方式 ────────────────────────────────────────────────────────────────
#
# canonical 條目引用來源（source 顯示字串保留，source_ids 是機器鍵）：
#   - certainty: 🟢
#     text: ...
#     source: Nicol et al. 2022          # 顯示層，逐字不動
#     source_ids: [src.nicol-2022-c]     # 機器鍵
#
# 條目也可以用 sources（複數，list of string）當顯示層——
# health/injuries.yaml 與 psychology.yaml 就是這個形式，
# my-site 的 vortex-injuries.html 直接 range 這個欄位，因此**不改欄位名**。
# 驗證器對 source 與 sources 一視同仁：兩者都要有 source_ids。
#
# 驗證器（tools/validate.py）：
#   E005  source_ids 指向本檔不存在的 ID          → ERROR
#   W002  區塊有 source／sources 顯示字串但缺 source_ids  → WARN
#         （S3a-2 起與 certainty 解耦：有沒有標確定性，跟來源該不該註冊是兩件事）
#   W009  區塊標 🟢/🟡 但完全沒有來源資訊          → WARN（仍綁 certainty，語意本該如此）
#   W008  本檔登錄但無任何條目引用的孤兒來源       → WARN
#
# ── 已知限制（交給 S3c）──────────────────────────────────────────────────
#
# S3c 狀態（2026-07-27）：第一批 authoritative identifier dereference 完成。
# 74 筆由 PubMed／PMC／Crossref metadata 完全對上後標 verified；另 1 筆
# McKenzie 2023 因原 DOI 值夾帶全形註記使 Crossref 查詢失敗，改以 PubMed 37515375
# 與 Wiley DOI metadata 人工交叉核對後標 verified。現為 verified 75／unverified 401。
# 其餘 S3a／S3a-2 歷史盤點保留如下，數字描述的是「遷入當時」而非當前狀態。
#
# S3a（138 筆）
#   1. 40 筆的 identifier 是從顯示字串或同層 url 欄位**逐字轉錄**而來
#      （PMID / PMCID / DOI / URL），沒有 dereference 確認，所以仍是 unverified。
#      S3c 只要把這些識別碼查一遍，就能直接翻成 verified。
#   2. 20 筆是複合字串（一個字串裡有多筆文獻），待拆分。
#   3. 5 筆根本不是文獻引用（通則／共識敘述），須判定改標確定性或補來源。
#   4. 34 筆無識別碼且缺作者或年份，不足以唯一定位。
#
# S3a-2（338 筆）
#   5. 90 筆有逐字轉錄的 identifier（多來自 periodization/* 與 health/drafts/*，
#      這兩批字串本身就帶 DOI / PMID / PMCID）。字串裡出現的「(已驗證)」是
#      **原作者寫在顯示字串裡的字**，不是本註冊表的查驗結論——逐字保留但
#      不據此標 verified；沒有 dereference 就沒有 retrieved_on。
#      → 2026-09-06 已結案：這批殘留 49 筆的 display 全數改寫成真書目（作者・年份・
#        篇名・期刊），識別碼只留在 identifier 欄；canonical/ 內 121 條讀者可見的
#        引用字串同步換掉。其中 12 筆的主題詞與實際篇名對不上，已在各自 notes 記
#        下不符內容與使用邊界。本檔與 canonical/ 都不應再出現「(已驗證)」字樣。
#   6. 55 筆是複合字串，待拆分。
#   7. 73 筆是指向 Research/心理/*.md 錨點的**內部交叉參照**，不是外部文獻。
#      它們仍須有 ID（否則引用端無法機器解析），但 S3c 要追到該節的原始文獻，
#      屆時可能改成指向真正的文獻條目。
#   8. Drills/*.yaml 的來源多為書章節指認（Race Club Ch N、Maglischo、
#      "There's a Drill for That"），缺頁碼與版本，S3c 須補 book-chapter 細節。

