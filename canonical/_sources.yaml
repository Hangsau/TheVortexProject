    notes: "2026-09-06 從 src.pmid-21259156 複合鍵拆出並首次獨立登錄，同時吸收原複合字串裡那個沒有指向的『PHV 文獻』——PHV 平均年齡（女 12.5、男 14）就出自本文件 p.15，不是另一篇獨立文獻。URL 是 Swim BC（卑詩省分會）託管的 PDF，Swimming Canada 官網該路徑回 403，取用時以本鏡像為準。查證時比對出兩件事寫在這裡備查：① 本文件的實際分齡（FUN 女 5–8／男 6–9；L2T 女 8–11／男 9–12；T2T 女 11–14／男 12–15；T2C 女 14–16／男 15–18；Compete to Win 女 16+／男 18+）與本庫原本登錄的不同——原本登錄的那一套（T2T 女 11–15／男 12–16、T2C 女 15–21／男 16–23、T2W 女 18+／男 19+）是跨項目通用的 Canadian Sport for Life LTAD 分齡表，四段全部吻合，顯然是把通用表誤標成游泳專項表。附帶一提，該通用表的數字在 CS4L LTAD 2.1 原件正文裡抽不出來（疑似只存在於圖表影像），只有二手來源可查，因此本庫不另登錄它、也不在公開散文裡當成有出處的事實引用，這條線索只留在此備查。② 本文件確實列有分齡週泳量（L2T 8–14；T2T 24–30 建立到 40–50；T2C 與 Compete to Win 40–50+ km/wk），本庫原本『查無 Swimming Canada 原始數據表』的說法不成立。另注意本文件本身主張 windows of optimal trainability，與 src.pmid-21259156、src.van-hooren-2020-sensitive-periods 的批判直接對立——引用時三者要並置，不能只取一邊。"

