    notes: "switch drill 本身是廣泛流傳的教學動作，但「通用游泳教學法」不是可回溯的歸屬；若日後查到最早提出者（如某本教材或某個課程體系）再以真來源登錄。 2026-09-06 「非來源」清查撤下。這個 display 扣掉括號補語後只剩本專案自己的名字（「Vortex 整理」「作者綜合」）或一句泛稱（「通用游泳教學法」）——沒有指向任何可回溯的作品，登在 `_sources.yaml` 裡只是讓來源總數多一筆、反向來源索引多一個點不進去的節點。與 E014（把「教練觀測」登錄成來源）、W023（把自己的草稿路徑登錄成來源）是同一種病的第三種寫法：長得像引用、實際回不到任何外部證據，卻能滿足 E005／W002 的來源檢查。**處置不是去找一篇文獻來補**——這些內容本來就是本專案自己整理的，正解是拿掉 `source_ids`、把自述留在讀者看得到的 `source` 顯示字串裡（那句話本身是誠實的），並讓驗證器不再把這種字串算成「已有來源資訊」（新增 E017 + W002／W009／W011 逃生口收緊）。本 id 保留為墓碑、不得再使用。"

