  - id: src.hellard-2019
    display: "Hellard P, Avalos-Fernandes M, Lefort G, Pla R, Mujika I, Toussaint JF, Pyne DB. (2019). Elite Swimmers' Training Patterns in the 25 Weeks Prior to Their Season's Best Performances: Insights Into Periodization From a 20-Years Cohort. Front Physiol 10:363."
    title: "Elite Swimmers' Training Patterns in the 25 Weeks Prior to Their Season's Best Performances: Insights Into Periodization From a 20-Years Cohort"
    type: journal-article
    verification_status: verified
    authors: ["Hellard P", "Avalos-Fernandes M", "Lefort G", "Pla R", "Mujika I", "Toussaint JF", "Pyne DB"]
    year: 2019
    container: "Frontiers in Physiology"
    identifier:
      pmid: "31031631"
      pmcid: "PMC6470949"
      doi: "10.3389/fphys.2019.00363"
    retrieved_on: "2026-09-06"
    notes: >-
      2026-09-06 取回全文核對。原文可支持者（逐字）：127 名法國菁英泳者（男 60、女 67；
      46 名短距離、81 名中距離），20 個賽季（1992–2012）、289 個泳者-賽季，觀察窗為賽季最佳
      成績前的 25 週；「∼86–90% of the training was swum at an intensity of [La]b ≤ 4 mmol⋅L-1」，
      再細分為 40–44% 在 <2 mmol、**44–46% 在 2 至 ≤4 mmol**、6–9.5% 在 >4–6 mmol、
      3.5–4.5% 在 >6 mmol。本文對本庫最關鍵的一句是作者自己的對照：其他耐力運動在
      2–4 mmol 這一區通常只占 2–16%，游泳卻放了將近一半——這才是「游泳不吻合極化模型」
      的實證，取代先前查無出處的計數。原文並給出機制解釋：游泳在 <2 mmol 的速度與划頻
      遠低於實際比賽，長時間停在該區等於練不像比賽的動作。
      短距離組另辨識出三種總訓練負荷型態：兩個約 14–15 週的長 macrocycle、兩個約 12–13 週、
      或單一平坦 macrocycle；**長型態成績最快**，且最常出現在奧運週期。
      使用邊界：本文只涵蓋賽季最佳前 25 週，不可用來宣稱年度 macrocycle 數量。

