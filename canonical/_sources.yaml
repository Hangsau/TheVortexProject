    notes: "2026-09-06 首次登錄。查證『美軍同期也有數十起相關溺斃』時定位到本篇——它極可能就是那句話的原型，但兩個關鍵詞都錯了：不是美軍（本篇是泳池與潛水的一般案例彙整），也不是同期（1976 年，比 MMWR 的 1988–2011 早一個世代）。摘要數字：58 例，56 例為男性，最常見年齡層 16–20 歲（全距 12–33），全部為公認的泳技或潛水良好者，約 80% 發生在有救生員的泳池，35 人存活、23 人死亡；閉氣實驗顯示失去意識到死亡之間可能不超過 2.5 分鐘。『泳技好』與『有救生員在場』這兩點與 MMWR 四名死者全是 advanced–expert 等級互相印證，是本庫安全章比死亡人數更有教學價值的發現。"

