      10 位女性泳者約 4 位具三聯症風險」，該數字是納入 17 篇異質研究的綜整估計，非單一族群盛行率，不可寫成「盛行率 40%」；② 作者明言游泳為非負重運動，三聯症在泳者身上如何作用尚不清楚，且納入研究數少、量化資料異質性大；③
      本刊非 PubMed 收錄，無 PMID，引用時以 DOI 為機器鍵。
