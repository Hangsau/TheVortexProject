    notes: "2026-09-05 拆分：原登錄把本篇與 de Asís-Fernández 2022 閉氣統合分析綁在同一個鍵，且把該統合分析的 DOI 掛在本篇的 pmid 旁邊，等於一個鍵同時宣稱兩份文獻。統合分析已另立 src.de-asis-fernandez-2022-apnoea-meta，本鍵只留 Kapus 2013。摘要核對：12 名男性受試者分為實驗組與對照組（因此每組僅約 6 人），兩組都做每週三次自行車測功計間歇、共六週，實驗組以每分鐘 10 次呼吸執行。實驗組訓練後肺活量 +8±8%（p=0.02）、吸入 3% CO2 時的運動中通氣反應 −45±27%（p=0.03）。作者自己在 Key Points 註明：這種呼吸型態無法在較高強度下執行，因此不預期有氧耐力（峰值攝氧量）改善。"

