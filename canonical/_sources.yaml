    notes: >-
      2026-08-18 逐字比對摘要。魁北克 1961–2004 年因跳水致脊髓損傷者的訪談研究：
      目標 203 人，**實際受訪 89 人（回覆率 44%）**。92% 男性、85% 未滿 35 歲；
      **傷前知道跳水有脊髓損傷風險者僅 37%，受過水域安全訓練者僅 33%**。
      場地：泳池 51%（45 例）／自然水域 49%（44 例）；泳池案例中 87% 是單戶住宅泳池、57% 為地上型。
      **深度標示缺失：地上型泳池 100%、地下型 74%**；地下型泳池的傷害 63% 撞在深淺池底斜坡上。
      **52% 的泳池與 79% 的自然水域事發水深不足 1.4 m**；47% 通報有飲酒。
      **使用邊界**：① **回覆率僅 44%，存在選擇偏誤**，比例應視為受訪者分布而非母體分布；
      ② 這是**休閒跳水（住宅泳池、碼頭）**，**不是競技出發台起跳**——
      不可用來支撐競賽出發的風險，只能支撐「淺水跳入」這一共通機制；
      ③ 資料截至 2004 年，其後泳池設計規範與警示標示已有變動（🟡 vintage）。

