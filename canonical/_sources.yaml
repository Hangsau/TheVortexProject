  - id: src.who-2024-12-13-drowning-deaths-decline-globa-2024
    display: "World Health Organization. (2024-12-13). Drowning deaths decline globally, but the most vulnerable remain at risk [news release]. Accompanying the Global status report on drowning prevention 2024."
    title: "Drowning deaths decline globally, but the most vulnerable remain at risk"
    type: other
    verification_status: verified
    authors: ["World Health Organization"]
    year: 2024
    container: "WHO news release"
    url: "https://www.who.int/news/item/13-12-2024-drowning-deaths-decline-globally-but-the-most-vulnerable-remain-at-risk"
    retrieved_on: "2026-08-18"
    notes: >-
      2026-08-18 取回原文核對。WHO 新聞稿逐字數字：
      **「300 000 people dying by drowning in 2021 alone」**；
      「Almost half of all drowning deaths occur among people below the age of 29 years,
      and a quarter occur among children under the age of 5 years」；
      自 2000 年以來全球溺水死亡率**下降 38%**；每小時逾 30 人溺斃；
      若趨勢不變，至 2050 年恐累計 720 萬人死於溺水。
      **2026-08-18 更正（歸屬顛倒）**：`drowning` 條目原寫「WHO 2024：2021 全球溺水死亡約 274,200 人
      （另估 ~30 萬，方法不同）」——**方向反了**。
      **30 萬才是 WHO 自己報的數字**，274,200 是 GBD／IHME 系列估計（見 src.pmc11954903），
      原文把 WHO 沒說過的數字掛在 WHO 名下，再把 WHO 的實際數字降級成「另估」。
      **使用邊界**：① 這是**新聞稿**不是報告本體，數字須以《Global status report on drowning
      prevention 2024》為準；② WHO 與 GBD 兩套估計方法不同，**不可混用或相減**；
      ③ 全球彙總數字，無泳池／開放水域分層。

