    type: review
    verification_status: verified
    authors: ["Ramirez-Campillo R", "Perez-Castilla A", "Thapa RK", "Afonso J", "Clemente FM", "Colado JC", "de Villarreal ES", "Chaabene H"]
    year: 2022
    container: "Sports Medicine - Open"
    identifier:
      pmid: "36036301"
      pmcid: "PMC9424421"
      doi: "10.1186/s40798-022-00502-2"
      url: "https://pubmed.ncbi.nlm.nih.gov/36036301/"
    retrieved_on: "2026-09-06"
    notes: "2026-09-06 efetch 核對後獨立登錄，來自拆解複合鍵 src.pmc9424421-a／-b。內容：26 篇納入研究、618 名水上運動員（介入組 330／對照組 288），年齡 10–26 歲，介入 4–36 週，PEDro 中位數 5.5。結果分兩類：陸上體能指標有中至大效果（1RM 深蹲、立定跳遠、蹲跳、反向跳，ES 0.67–1.47）；**水中垂直跳與水中敏捷完全無效果**（ES −0.15 至 0.03，p 0.477–0.899）；**計時泳段速度有小幅但顯著的效果（ES 0.42, p = 0.005）**。GRADE 證據確定性 very low 到 moderate。**使用邊界（重要）**：① 族群是**水上運動員泛稱**，含游泳、鐵人三項、划船、水上芭蕾、水球，不是純游泳樣本；② 本篇**沒有量出發、轉身或蹬牆的分段時間**，不能用來支持「增強式主要幫助出發與轉身」——它量到的恰恰相反，水中跳躍與敏捷無效果、整段計時反而有小效果；③ 效果量小（0.42）且證據確定性最高只到 moderate，不宜寫成定論。"

