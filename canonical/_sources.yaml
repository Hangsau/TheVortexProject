      **「文獻中已被使用且有效」的並列清單，不是遞進階梯**；原文只說「合理的做法是從相對簡單的
      動作開始，隨信心與能力提升再進到多關節動作」。
      使用邊界二：全文檢索「5 or 6」零命中、「biological age」與「chronologic」皆零命中——
      **本文沒有給出任何起始年齡下界（如 5 歲）或成熟度年齡差距數字**。

