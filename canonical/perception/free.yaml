# ============================================================
# Canonical 知識結構 — 感知領域 / 自由式
# ------------------------------------------------------------
# 範圍與定位（2026-06-28 收斂）：
#
# 過去的雄心：每個動作（感知時刻）都建一張對應卡，含「公開層 + 教練判讀層」。
# 實際發展：物理層 / 硬體邊界 / drill / 誤區 / L0-L6 地圖等「公開層」內容，
# 已分散到更專門的 canonical（technical-analysis / drills / teaching-errors /
# l-indicators / water-sense-levels）。my-site 從那些檔讀，不從本檔讀。
#
# 因此本檔的當前範圍：**只保留教練診斷層的 protocol 範例**——
# 「操作→前後對比→鑑別問題」這套不靠講對詞、靠泳者前後差異判讀的方法論。
# 這是 swim-coach app 教練側才用的東西，不渲染到 my-site。
#
# 目前實作：一張完整範例（EVF 捕水）展示 protocol 結構。其他動作的診斷
# protocol 屬未來研究/設計題，不再保留 skeleton 占位以免造成「stub 假象」。
# 需要新增時依此範例的 manipulation / contrast / discriminators 三段式設計。
# ============================================================

domain: perception
domain_name_zh: 感知
stroke: free
stroke_name_zh: 自由式
schema_version: 3
scope_note: 教練診斷 protocol 範例層；公開內容已遷至 technical-analysis 等 canonical

# 自由式感知本質的一句話總結（保留供 swim-coach 引用）
stroke_premise:
  one_line: 划手距離(SL)是技術指標，划頻(SR)是生理指標——兩者是不同對象，不可混為一談。
  certainty: 🔵

# ------------------------------------------------------------
# 教練診斷 protocol 範例——EVF 捕水
# 結構：manipulation（操作） → contrast（前後對比追問） → discriminators（鑑別「講對詞 ≠ 有感知」）
# 設計新動作的 protocol 時依此範本擴充。
# ------------------------------------------------------------
diagnostic_protocols:

  - id: protocol.free.evf
    moment_zh: 捕水（EVF, Early Vertical Forearm）
    abc_type: A
    abc_note: EVF 崩潰、只靠手掌蠻力划水 = A 型（手感缺失）的主要訊號。

    public_layer_pointers:
      # 「物理是什麼 / 為什麼這樣 / 對應 drill / 對應誤區 / L 層位置」這些公開層內容
      # 不重複寫在這——指向已有的 canonical 條目。
      technical_analysis: [free.tech.9, free.tech.10]   # EVF 機制 + 前鋸肌硬體邊界
      drills: [Fr16, Fr10, Fr17]                         # 握拳→張開、帆船、三點觸碰
      teaching_errors: [free.err1, free.err2]            # 對應的常見錯誤口令
      l_levels: [L3, L4]

    perception_probe:
      certainty: 🟠   # 教練觀測層（非實證），是經驗累積的判讀法
      observation_basis: >-
        觀察者是本專案作者的教學實務累積，族群涵蓋本專案的全光譜教學對象
        （兒童、兒童競技、青少年競技、鐵人三項、成人初學），不是文獻。
        外推邊界：① 這是**判讀程序**不是量表——沒有做過信度檢驗，
        不同教練用同一套追問是否讀出相同結論，本專案沒有資料；
        ② 適用前提是泳者已到 L3，L3 之前「說不出差異」是正常而非訊號，
        對這類學員繼續追問只會製造挫敗；
        ③ 「講對詞 ≠ 有感知」這條反過來也成立——講不出來也不等於沒感知，
        語言能力（尤其兒童與非母語者）會壓低報告品質，此時要改看操作後的動作變化而非口頭報告。
      principle: |
        不靠「泳者講對詞」判斷（講對詞 ≠ 有感知，奧運選手也未必能講出來）。
        靠：操作 → 前後對比 → 區辨追問。
      manipulation: 握拳游一趟 → 張開手游一趟
      contrast_question: 兩趟哪裡不一樣？（用什麼詞不重要）
      signal_structure:
        # 算到位的是「結構」，不是某句具體話
        - 報得出前後差異（不是「都一樣」）
        - 能把差異定位到「手掌」
      discriminators:
        # 排掉「講對詞但沒感知」與「只是形式記憶」
        - cue: 把改變歸到「前臂」
          probe: 阻力在手掌還是前臂？
          reading: 歸前臂 = 形式記憶/常見誤解，不是捕水感知
        - cue: 只說「我有抬肘」
          probe: 上臂往旁邊，還是跟前進方向平行？
          reading: 只會講動作 ≠ 有感知
        - cue: 說沒差別 / 講不出來
          reading: 感知還沒建立——不是 cue 不對，是還沒到 L3，回頭補基礎
