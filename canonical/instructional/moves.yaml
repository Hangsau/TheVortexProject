    lnote: L4 手感的主推進相核心。
    links:
      drills:
      - Fl15
      - Fl16
  - id: fly.move.6
    n: 6
    name: 出水（推完了）
    one: 手推到水壓消失即出水
    l: L5
    physical: 出水順序：<mark>肘→前臂→手掌（小指先出）</mark>。Upsweep 結束時手掌「推不到水了」，此時與第二踢同步、髖部上升帶動手臂出水。出水應是被彈出去的，不是被拉出去的。
