domain: instructional
sub: moves
schema_version: 1
note: 6 泳式／技能頁的技術組件（動作）。2026-10-14 由 my-site data/vortex/<stroke>.yaml 遷入（原本在 my-site 手動維護，不過 validate、未進 10-01 審查）。my-site 的 6 個檔改由 sync_vortex.py 的 sync_moves() 生成，勿再手改。欄位：one 一句話、l 對應 L 級、physical 物理描述、boundary 感知／硬體邊界、drills 以 drill 中文名連結、cue_bad／cue_why／cue_good 口訣校正、lnote L 級說明。字串內的 <mark>／<span class="cert"> 是呈現標記，原樣保留。
strokes:
- stroke: free
  premise: 划手距離是<mark>技術</mark>指標，划頻是<mark>生理</mark>指標——兩者是不同的對象，不可混為一談。<span class="cert">🔵</span>
  moves:
  - id: free.move.1
    n: 1
    name: 入水位置
    one: 手在肩前入水，不跨中線
    l: L2–L3
    physical: 入水點應在<mark>肩線延伸前方</mark>、手臂接近完全伸展處（約肩寬、距頭部 30–45 公分），指尖朝前斜下切入。跨越中線會讓入水後第一個動作變成大幅<mark>外掃</mark>，產生橫向分力誘發蛇行，肩胛骨無法穩定。小指可略轉朝下入水，有助降低入水阻力（教練觀測，主要見於 hip-driven 自由式，非通用物理量）🟠。
    boundary: 入水位置的本體感知極不可靠——泳者對自己手臂落點的判斷準確度遠低於實際，這是感知問題不是解剖限制。最可靠的確認是側錄，不要單靠「感覺手在肩前」。
    drills:
    - 單臂划手
    - 描黑線
    - 靜音入水
    cue_bad: 頭部正前方輕輕滑入水
    cue_why: 入水過短會壓縮延伸時間、失去晚期回臂的加速能量轉移，且手在頭頂落水製造正面阻力。
    cue_good: 指尖領先、積極前伸，在肩線前方切入
    lnote: L2 延伸感知的建立基礎；入水過短會讓 L2 延伸感知無法萌芽。
    links:
      drills:
      - Fr11
      - Fr13
      - Fr21
  - id: free.move.2
    n: 2
    name: 捕水 EVF
    one: 高肘抓水，推進的起點
    l: L3–L4
    physical: 高肘的目的是<mark>降低上臂阻力</mark>，不是讓前臂推進。上臂是自由式中阻力最大的部位——高肘讓上臂與游進方向平行、截面積最小化，同時讓<mark>手掌</mark>朝向後方、推進面積最大化。手掌才是主推進面，不是前臂。
    boundary: <mark>前鋸肌</mark>是 EVF 的硬體前提。前鋸肌疲勞後肩胛骨失穩，高肘姿態無法維持——這不是技術感知問題，是肌肉撐不住。長距離後段崩潰多半是前鋸肌耐力問題，不要用感知訓練介入。
    drills:
    - 握拳划手
    - 帆船划手
    - 三點觸碰
    cue_bad: 前臂壓下去推水
    cue_why: 前臂是圓形截面，推進效果遠差於手掌；高肘是為了降上臂阻力。
    cue_good: 肘尖保持朝向前方游進方向
    lnote: L3–L4 的核心技術點；連動鏈耦合要到 L5。
    links:
      drills:
      - Fr16
      - Fr10
      - Fr17
  - id: free.move.3
    n: 3
    name: 拉水加速
    one: 手掌加速向後推，不是定速划
    l: L3–L4
    physical: 捕水後進入推進相，手掌從 3 點鐘加速推到 9 點鐘，路徑<mark>接近直線向後</mark>——傳統 S 形路徑是高速攝影出現前缺乏測量工具的誤解，S 形其實是身體轉體造成的視覺副產品。手速必須從捕水起點<mark>逐漸加速</mark>，不是定速推水；後象限是推進力峰值，深度約 8–10 吋，手掌不應穿破水面。
    boundary: 拉水推進感知屬可訓練的感知能力，不是硬體邊界。但若前鋸肌已失守導致捕水結構瓦解、轉為直臂蠻力划水，加速感會跟著消失——此時根因在硬體支撐，不在拉水技術本身。
    drills:
    - 單臂划手
    - 握拳划手
    - 指尖拖水
    cue_bad: 刻意走 S 形路徑
    cue_why: 每次方向改變都要減速再加速，每次減速都是推進力損失；且把注意力放在路徑形狀會脫離水壓感知。
    cue_good: 手掌向後加速、維持路徑穩定
    lnote: L3 手感核心；提速後能否穩定維持加速感是手感在 L4–L5 的關卡。
    links:
      drills:
      - Fr11
      - Fr16
      - Fr12
  - id: free.move.4
    n: 4
    name: 旋轉耦合
    one: 旋轉時機對上推力峰值
    l: L4–L5
    physical: 身體旋轉本身<mark>不產生推進力</mark>，但旋轉速度峰值與划手推力峰值<mark>耦合</mark>時，能量疊加放大推力。旋轉是放大器，不是引擎。旋轉要和推水末段的時機配合；肌電研究只描述肩胛肌群在各相位何時活動，不能據此斷定旋轉由誰發動。
    boundary: 旋轉幅度有解剖與風格差異：Hip-driven 髖旋轉 45–60°，Shoulder-driven 僅 20–30°，不同風格泳者的旋轉描述截然不同都屬有效。幅度受時間窗口限制——高划頻下物理上沒有時間完成大幅旋轉，這是力學邊界不是感知問題。
    drills:
    - 俄式滾轉
    - 三划滑行
    - 髖部划水
    cue_bad: 主動轉髖帶動划手
    cue_why: 混淆因果——髖是被動跟隨者；高划頻下刻意轉髖造成時機錯亂與額外能量消耗。
    cue_good: 推到尾、掌心水壓鬆掉那一刻，對側自然跟著轉過去
    lnote: 耦合感知屬 L5 層次；L3–L4 基礎捕水推進未穩前不優先處理。
    links:
      drills:
      - Fr24
      - Fr23
      - Sc7
  - id: free.move.5
    n: 5
    name: 踢水節律
    one: 踢水和划手整合，不是各跑各的
    l: L3–L5
    physical: 踢水有四個功能，不只推進：<mark>推進</mark>（補划手空窗期）、<mark>升力</mark>（下半身維持水平、降正面截面積）、<mark>慣性</mark>（速度波動最小化）、<mark>平衡穩定</mark>（抵消回臂側向分力）。六拍踢的對側配對來自反扭矩：右手入水時身體向該側滾轉，對側腳踢下抵消蛇行。感知重點是整合，不是力道。
    boundary: <mark>踝關節蹠屈幅度</mark>是踢水效率的硬體邊界。踝關節僵硬者（跑步背景常見）腳掌無法朝後，踢水效率大幅下降甚至制動——這是解剖限制，須先確認踝關節能否完整蹠屈，不能用感知訓練介入。柔韌性可後天訓練改善，但改善先於速度提升。
    drills:
    - 超人踢水
    - 流線踢水
    - 垂直踢水
    cue_bad: 腿要踢有力、踢得快
    cue_why: 踝關節蹠屈不足時加大力量只是更有力地製造阻力；力量不是問題，整合節律才是。
    cue_good: 踢腿有跟上划手嗎？還是各自跑？
    lnote: 腳感的核心訓練軸；L3 建立踢水推力感、L4 整合、L5 外部干擾下維持。
    links:
      drills:
      - Fr5
      - Fr7
      - Fr8
  - id: free.move.6
    n: 6
    name: 頭部位置
    one: 頭不抬，眼球上轉換氣
    l: L2–L4
    physical: 頭部是自由式中<mark>本體感知最不可靠</mark>的部位——「感覺頭壓低了」不等於頭實際是低的。阻力約隨速度平方上升，克服阻力所需的功率約隨速度三次方上升；高速時波阻上升得更陡，接近競速時約佔總阻力 25%（低速時較低）。頭部微抬→下半身下沉→踢水要對抗傾斜→能量預算被佔用，代價隱性累積，長距離尾段才顯現。換氣靠嘴巴轉進<mark>弓形波凹陷</mark>，視線靠眼球上轉，頭部本身不移動。
    boundary: 頭部位置幾乎全是感知問題而非解剖限制——這也是為什麼陸上示範正確、下水卻自動回到微抬習慣（感知系統沒被重新校正）。因為本體感知最不可信，這個環節必須靠外部確認（錄影、蛙鏡基準線），不能只信主觀感覺。
    drills:
    - 頭帶平衡 — 面朝下
    - 頭帶平衡 + 旋轉
    - 無氣泡
    cue_bad: 換氣時眼睛看天花板 / 抬頭換氣
    cue_why: 頭部過度旋轉打斷旋轉連動鏈、誘發換氣側手入水偏移；抬頭直接造成下半身下沉。
    cue_good: 嘴角轉進水面凹陷，眼睛看斜前方，另一側鏡片還有一半在水裡
    lnote: L2 換氣建立的關鍵；頭部過度旋轉是全身張力遮蔽水感最常見的觸發點。
    links:
      drills:
      - Fr2
      - Fr4
      - Fr22
  - id: free.move.7
    n: 7
    name: 划距感知
    one: 察覺這趟划得比較短了
    l: L4–L6
    physical: SL（每划距離）是技術品質最直接的外部指標，也是疲勞崩潰的<mark>第一個訊號</mark>——SL 下降先於 SR 下降。泳者本能反應剛好相反：感覺慢→划更快（提高 SR）→每划推進力下降但划次增加→消耗更多能量→技術繼續惡化。精英的優勢不是更高 SR，而是<mark>高 SR 下維持 SL 不下降</mark>。
    boundary: 划距感知是可訓練的覺察能力，不是硬體邊界——目標是把「游完才發現划短了」推進到「游泳中途就能偵測」。但疲勞後主觀感知可信度下降，此時需回到 SPL 客觀數字，不能單靠感覺。
    drills:
    - 高爾夫計分
    - 三划滑行
    - 指尖拖水
    cue_bad: 游累了就划快一點
    cue_why: 疲勞時提 SR 掩蓋 SL 下降，短期有用但長期加速技術崩潰。
    cue_good: 先確認每划還有水感、推多遠，再考慮快慢
    lnote: 能在中途察覺 SL 開始縮短是 L5→L6 的核心里程碑；疲勞崩潰序列的第一層。
    links:
      drills:
      - Fr20
      - Fr23
      - Fr12
  - id: free.move.8
    n: 8
    name: 旋轉連動鏈
    one: 回臂入水放大對側推力（進階）
    l: L5–L6
    physical: 回臂手從最高點<mark>加速下落</mark>、入水時動能傳遞到對側划手末段推力，產生 coupling 能量。耦合要有效，回臂必須<mark>持續加速到入水</mark>（不能在入水前減速）。肩旋轉峰值在拉水前段、髖旋轉峰值在拉水末段，兩者分開強化整個拉水週期。
    boundary: 這是 L5 以上才會浮現的感知層次，屬感知成熟度問題而非硬體邊界。在 L3–L4 過早追求「整體連在一起」的感覺，往往是個別環節（抓水、踢水推進）尚未穩固卻誤以為「很好」——需先確認基礎感知穩定，不是直接進入連動鏈。
    drills:
    - 俄式滾轉
    - 三划滑行
    - 超人趕上
    cue_bad: 回臂要快、要有力
    cue_why: 回臂在空中不接觸水，本身不產生推進力；用力揮臂只製造全身張力、讓張力遮蔽水感。重點是鬆弛加速與時機，不是力道。
    cue_good: 回臂放鬆、持續加速到入水那一刻
    lnote: L5 的耦合感知層次；連動鏈要等基礎捕水與推進感知穩固後才會出現。
    links:
      drills:
      - Fr24
      - Fr23
      - Fr15
- stroke: back
  premise: 看不到自己的手、視線朝上——仰式的方向控制靠「頭是不動的軸」，身體繞著頭轉，不是靠眼睛修正。<span class="cert">🔵</span>
  moves:
  - id: back.move.1
    n: 1
    name: 仰漂安全感
    one: 讓水撐住身體的起點
    l: L1
    physical: 仰漂的浮力是<mark>真實存在</mark>的，身體不需出力維持位置。耳朵入水後聽覺改變、視線朝上失去空間參照，是仰式特有的陌生訊號，但與身體是否安全無關。<mark>頭部過高會讓髖部下沉</mark>，是位置問題不是浮力不足。
    boundary: 浮力由體組成與肺容積決定，是物理現實不是技術；下腹去找浮板只是移除焦慮，不是支撐工具。
    drills:
    - 仰式流線踢水
    - 頭帶側身平衡踢水
    lnote: L1 前置，動作開始前必須先建立。
    links:
      drills:
      - Bk1
      - Bk4
  - id: back.move.2
    n: 2
    name: 仰漂三指標
    one: 耳入水、額不碰水、腳到水面
    l: L1–L3
    physical: 三指標同時成立代表身體在最低阻力位置：<mark>耳朵在水裡</mark>（頭高度正確）、<mark>額頭不碰水</mark>（頭不過低）、<mark>腳踢得到水面</mark>（腰沒弓起）。任一跑掉阻力都明顯增加。頭部過高會幾何性地讓髖部下沉。
    boundary: 三指標是物理位置，不是感覺；加速後阻力上升是位置偏移的物理結果，不是用力多寡。
    drills:
    - 頭帶側身平衡踢水
    - 泳鏡平衡
    - 仰式流線踢水
    lnote: 全身張力的核心，L3–L4 反覆確認。
    links:
      drills:
      - Bk4
      - Bk22
      - Bk1
  - id: back.move.3
    n: 3
    name: 上踢推進
    one: 腳背向後上推水，身體前進
    l: L2–L3
    physical: 仰式推進主力是<mark>上踢</mark>（足背朝後朝上，蹠屈形成推進面），對應自由式的下踢；下踢是回收動作，由另一腳重量自然帶下，不需刻意控制。主要肌群是<mark>股四頭肌</mark>（伸膝），和自由式的下踢一樣是伸膝推水。
    boundary: <mark>踝關節蹠屈柔韌性</mark>是硬體前提（McCullough 2009）；踝關節僵硬時足背無法朝後，嚴重時上踢的推進效率大降、甚至變成阻力。柔韌性訓練優先於力量訓練。
    drills:
    - 浮板壓腿踢水
    - 超人仰式踢水
    - 指天
    - 垂直仰式踢水
    cue_bad: 向下踢 / 用力踢水
    cue_why: 向下踢方向本身就錯（自由式邏輯干擾）；力量不是瓶頸，踝關節柔韌性與方向才是。
    cue_good: 腳背朝後上推，膝關節最後伸展帶出鞭打
    lnote: L2 腿部感知建立的基礎動作。
    links:
      drills:
      - Bk3
      - Bk6
      - Bk18
      - Bk7
  - id: back.move.4
    n: 4
    name: 入水角度
    one: 小指先入，沿肩線不過中線
    l: L3–L4
    physical: 小指側先行、沿肩線延伸方向入水，角度 <mark>30–45°</mark>，不跨越中線。小指先入水阻力最小，且入水後手掌自然轉向推進方向。<mark>跨越中線</mark>會誘發蛇行偏移、橫向動量增加、旋轉軸偏移、能量散逸（幾何必然）。
    boundary: 視覺回饋缺失是仰式的解剖事實——泳者看不到自己的手，方向偏移無法靠視覺自我修正。
    drills:
    - 加速入水
    - L形鑽
    - 快速L形切換
    cue_bad: 把手放直進去
    cue_why: 描述手臂形狀不等於入水位置；直臂仍可能跨過鼻樑造成蛇行。
    cue_good: 手臂沿身體側面前方延伸進水，不越過鼻樑
    lnote: L3–L4 手感相關。
    links:
      drills:
      - Bk25
      - Bk14
      - Bk15
  - id: back.move.5
    n: 5
    name: 捕水 EVF
    one: 高肘在身後抓水，拉身體過去
    l: L3–L4
    physical: 高肘讓<mark>前臂面向推進方向</mark>，手掌是主推進面，不是前臂。仰式捕水在<mark>身後</mark>（不是身前），手掌在肩線後方約 10–15cm 建立高肘。捕水完成時肘部角度約 100–120°（教練觀測）。<mark>手臂直線推水</mark>會縮小有效槳面積、推進力下降、肩部剪力增加。
    boundary: 前臂正對推進方向時，能推水的有效面積最大（以阻力為主的推進）；高肘崩潰常見原因之一是肩部肌耐力不足。
    drills:
    - 寬Y型划水
    - 握拳仰式
    - 仰式拉力板
    - 水線輔助拉水
    cue_bad: 手伸越深抓水越多 / 直臂深插
    cue_why: 深位讓手掌推進方向偏離水平、肩內旋受傷風險上升、姿態耗能增加；舊式深插與現代高肘相對深度是兩回事。
    cue_good: 肘在上手在下，前臂整面對水，拉身體過去而非推水出去
    lnote: L3–L4 手感核心。
    links:
      drills:
      - Sc1
      - Bk19
      - Bk24
      - Bk26
  - id: back.move.6
    n: 6
    name: 旋轉不對稱
    one: 回臂側肩抬高，划水側自然深沉
    l: L4–L5
    physical: 仰式旋轉不是兩側對稱轉 45°，而是<mark>單側主動</mark>：回臂側肩膀主動向上抬高、近乎觸及下巴，划水側的深沉是這個上抬的<mark>被動結果</mark>（教學描述，未經量測證實）。十名男性競技泳者肩滾轉平均 49.73±5.73°（Gonjo 2020），存在個體最優值。旋轉使<mark>背闊肌進入最佳預拉長度</mark>，並增加有效拉力臂。
    boundary: 臉朝上限制了滾轉幅度——頭保持不動、臉朝上，十名男性競技泳者的肩滾轉約 50° 仍不影響換氣（Gonjo 2020）；滾轉幅度比自由式小，頭一跟著轉臉就會入水。
    drills:
    - 手臂主導平衡
    - 交替手臂主導
    - 俄式滾轉（仰式）
    cue_bad: 把划水側肩膀往下壓 / 保持平躺不旋轉
    cue_why: 主動下壓製造肩部張力、增加傷害風險；「平躺」對應最低效率狀態，背闊肌無法預拉，划水只剩小肌群。
    cue_good: 抬高回臂側肩膀靠近下巴，另一側自然就沉
    lnote: L4–L5 最易搞反方向的環節。
    links:
      drills:
      - Bk8
      - Bk9
      - Bk20
  - id: back.move.7
    n: 7
    name: 旋轉幅度穩定
    one: 加速時旋轉不縮小
    l: L4–L5
    physical: 仰式在速度增加時<mark>維持旋轉幅度不縮小</mark>（Gonjo 2021），與自由式相反——「衝刺時縮小旋轉提高划頻」的策略在仰式不適用。疲勞時的代償是維持肩旋轉但<mark>增加髖旋轉</mark>（核心穩定性下降，旋轉由肩轉移至髖），看似還在轉但推進效率下降。
    boundary: 旋轉穩定性需要核心旋轉控制作為硬體前提；核心不足時旋轉會打滑（肩滾了但手沒固定）。
    drills:
    - 雙臂同步仰式
    - 三划滑行（仰式）
    - 高速仰式
    cue_bad: 加速時縮小旋轉提高划頻
    cue_why: 自由式邏輯，在仰式相反；旋轉幅度穩定本身就是仰式效率特徵，縮小通常伴隨推進力下降。
    cue_good: 加速時旋轉維持，不能縮小
    lnote: L4–L5，旋轉幅度穩定是功能需求。
    links:
      drills:
      - Bk12
      - Bk21
      - Bk23
  - id: back.move.8
    n: 8
    name: 頭部固定方向
    one: 身體繞頭轉，頭是不動的軸
    l: L5
    physical: 方向控制的核心是<mark>身體繞著頭旋轉，頭是旋轉軸不動</mark>。頭若跟著身體旋轉，方向感立刻消失、路線開始蛇行。基礎位置是耳朵與水面齊平、下巴略收、頭頂與脊椎成直線。<mark>視線略朝上方</mark>（非正後方），朝正後方會頸部過伸。
    boundary: 頸部活動度與視覺參照缺失是解剖事實；盯住天花板固定點是物理檢測法，不是感覺要求。
    drills:
    - 單臂仰式
    - L形切換接正式仰式
    - 暫停點
    cue_bad: 頭跟著身體轉
    cue_why: 頭轉動立刻消除方向參照，路線開始蛇行。
    cue_good: 盯住天花板一個點，身體繞著頭轉
    lnote: L5 方向感內化。
    links:
      drills:
      - Bk13
      - Bk16
      - Bk17
  - id: back.move.9
    n: 9
    name: 流線型（出發/轉身）
    one: 雙臂夾耳全入水，滑到速度降才划
    l: L5–L6
    physical: 100m 仰式出發加轉身合計約佔整場 <mark>1/3</mark>（González-Ravé 2025），流線型品質是 100m 成績最重要的單一技術預測因子之一。出發/轉身後速度最高，阻力以 <mark>F ∝ v²</mark> 增長最快，此時流線型效益最大。雙臂伸直夾耳、頭完全入水，維持到速度降至游進速度附近才開始第一划。<mark>提前浮頭</mark>會立即拉高 Cd 造成實質速度損失。
    boundary: 屏氣耐受與水下視野是物理限制；提前浮頭常是身體反射而非意識選擇，需逐步延長滑行距離建立。
    drills:
    - 仰式流線踢水
    - 加速入水
    cue_bad: 流線型要放鬆
    cue_why: 在要求一種狀態，而非創造可滑行的物理條件。
    cue_good: 感覺速度開始慢下來，那個時候才划第一划
    lnote: L5–L6，現代文獻列為僅次於旋轉的訓練優先級。
    links:
      drills:
      - Bk1
      - Bk25
- stroke: breast
  premise: 蛙式是四式中阻力最大的泳式，每個週期都在製造又對抗阻力——核心是手腳<mark>時序</mark>，不是力量。<span class="cert">🔵</span>
  moves:
  - id: breast.move.1
    n: 1
    name: 阻力存在（火箭漂）
    one: 先感覺阻力才能減阻
    l: 前置感知
    physical: 蛙式是四式中<mark>阻力最大</mark>的泳式，每個動作週期都在製造和對抗阻力。身體緊與鬆的<mark>阻力截面積不同</mark>，滑行距離就不同——這是所有蛙式技術的底層。
    boundary: 緊鬆差異太小常代表身體緊鬆程度沒真正改變，是動作幅度問題而非感知敏銳度問題。
    lnote: 任何動作習慣建立之前進行。
  - id: breast.move.2
    n: 2
    name: 腿部推進（夾水）
    one: 踢完身體還在走
    l: L2
    physical: 蛙腿的推進發生在<mark>腳掌翻到朝後之後的外擺與內夾</mark>：外擺讓身體加速、內夾維持速度，兩段的渦流在內夾後合併、向後脫落（Tanaka CFD 2024，單一選手模擬）——這就是「把水往後推」在流體裡的樣子。L2 重點是腳掌翻轉、夾水、感覺水被往後推。
    boundary: 坐岸邊潑水時腳掌翻不出來，是<mark>踝關節活動度</mark>問題，不是感知問題；踝蹠屈柔韌性可靠軟組織訓練改善。
    drills:
    - 牆邊蛙式腿
    - 浮力棒踢腿
    - 墓碑浮板踢腿
    cue_bad: 像青蛙一樣踢
    cue_why: 青蛙用腳趾間蹼往前推，蛙式選手用小腿內側和腳往後推，方向相反，注意力會落在腳趾而非小腿內側。
    cue_good: 腳掌外翻後像刀片往後劈水
    lnote: L2 腿與手分開建立。
    links:
      drills:
      - Br1
      - Br5
      - Br10
  - id: breast.move.3
    n: 3
    name: 手部撐水（撐起換氣）
    one: 外划撐起頭自然出水
    l: L2
    physical: L2 階段蛙式的手<mark>功能是撐起換氣，不是產生推進力</mark>。外划內抱讓頭自然浮出水面才算有效；追求手有沒有推水是跳級。
    boundary: 換氣後肩頸上臂容易疲勞，通常是手沒真正撐起、靠肌力補——屬肌耐力範圍。
    drills:
    - 蛙式手臂外撇
    - 戴呼吸管游蛙式
    lnote: L2 的手不做推進力討論。
    links:
      drills:
      - Br12
      - Br26
  - id: breast.move.4
    n: 4
    name: 外划邊界（Outsweep）
    one: 捕水出現外划即停
    l: L3
    physical: 外划<mark>產生的向前推進力很小</mark>，功能是把手移到捕水最佳起始位置（Nicol 2022）。幅度有上限：超過肩膀寬度，側向分量增加、收腿阻力上升，向前有效推力下降。
    boundary: 外划寬度受<mark>上肢力量</mark>決定——力量不足卻過寬，肘部下沉破壞後續高肘捕水。
    drills:
    - 寬Y型划水
    - 頭朝下划水（窄Y）
    cue_bad: 手要划到最寬處再拉回來 / outsweep 越寬越好
    cue_why: 側向分量隨幅度增加，向前有效分量佔比反而下降，同時收腿展開更寬、阻力增加，超過最優幅度後收益快速遞減。
    cue_good: 外划在肌力可控範圍內，終點才是捕水發力起點
    lnote: 外划終點即捕水點，是 L3 EVF 前提。
    links:
      drills:
      - Sc1
      - Sc2
  - id: breast.move.5
    n: 5
    name: 手部 Insweep 加速
    one: 水壓出現立刻加速內夾
    l: L3–L4
    physical: Insweep（內划）是蛙式手臂的<mark>主推進相</mark>，精英比次精英更早啟動，允許更大推進力輸出（Nicol 2022）。手掌在胸口下方匯合，此階段最大加速度。
    boundary: 前鋸肌等上肢肌耐力是維持高肘捕水姿態的硬體前提。
    drills:
    - 握拳蛙式
    - 蛙式拉手＋自由式踢水
    cue_bad: 外划是主要推進動作 / 外划要有力
    cue_why: 外划本身推進力很小，誤以為外划用力會提前消耗注意力在外划阻力上，錯失捕水時刻的前臂鎖水感。
    cue_good: 外划最小施力，insweep 才全力加速
    lnote: L3 手感最常見的感知錯位點。
    links:
      drills:
      - Br19
      - Br15
  - id: breast.move.6
    n: 6
    name: 腿部 Insweep 加速
    one: 腳掌到位再加速夾入
    l: L3–L4
    physical: 外擺讓身體加速，<mark>內夾負責把速度撐住</mark>，兩段渦流在內夾後合併向後脫落（Tanaka 2024，單一選手 CFD）。內夾時<mark>腳越快，腳底量到的推進力越大（r=0.89）</mark>（Koga 2025，相關非因果）。腳掌須翻到斜後方有水壓再加速。
    boundary: 腳掌翻轉不完全是踝關節 / 髖內旋限制（硬體），與翻到位但加速時機太晚（感知）不同，先確認腳掌方向再判斷。
    drills:
    - 垂直蛙式踢腿
    - 超人蛙式踢腿
    cue_bad: 腳要用力夾 / 踢快一點
    cue_why: 用力或加快頻率不等於內夾加速：腳掌沒翻到朝後就用力，只是在水裡揮腿；同一研究中「更用力把膝蓋蹬直」反而伴隨較小的腳底推進力（Koga 2025）。
    cue_good: 踩到東西再推
    lnote: 腳掌到位後的內夾加速是 L3–L4 腿部核心。
    links:
      drills:
      - Br3
      - Br8
  - id: breast.move.7
    n: 7
    name: 收腿路徑
    one: 腳跟往外側臀部靠
    l: L2–L3
    physical: 最小阻力收腿路徑是<mark>腳跟往外側臀部靠，不是往正中間</mark>。髖外旋同時發生，大腿前移量最小，正面阻力最低，腳掌提前到翻轉位置。收腿是阻力最大的時刻（Tanaka 2024）。
    boundary: 膝距能不能窄，根本決定因子是<mark>髖內旋幅度（Hip Internal Rotation）</mark>；股骨前傾角為固定骨骼結構，反覆練路徑無效時先評估髖內旋限制。
    drills:
    - 仰面超人蛙式踢腿
    - Barrowman腿（交替踢）
    cue_bad: 腳跟碰屁股
    cue_why: 幾何路徑必然往正中間收：膝蓋大幅前移、正面截面積激增、腳掌收完朝上需額外旋轉錯過最佳蹬水時機。
    cue_good: 腳跟往外側臀部靠 + 確認靠左/右哪側
    lnote: 指導語設計最差的典型案例。
    links:
      drills:
      - Br9
      - Br11
  - id: breast.move.8
    n: 8
    name: 滑行結束點
    one: 速度開始快速掉才啟動下一划
    l: L4–L5
    physical: 蛙式是四式中<mark>唯一每個循環都有完整滑行</mark>的泳式。最優滑行結束點是速度開始快速下降時啟動下一個外划。太早打斷動能、太晚需更大力量重新加速。精英 arm glide phase 反而更長（Nicol 2022）。
    boundary: 滑行長短依情境變動：衝刺最短、長距離較長；最優判準是<mark>不流失動能</mark>，不是追求滑行優美感。
    drills:
    - 拉停踢停
    cue_bad: 要滑行 / 滑行越長代表技術越好
    cue_why: 在要求形式，學生不知道多久；過長滑行代表速度流失再重建，是耗能的，停頓後的重新加速會被誤認為良好推進。
    cue_good: 感覺速度開始快速掉，那個瞬間才划
    lnote: L4→L5 核心門檻，蛙式感知最難的一個。
    links:
      drills:
      - Br30
  - id: breast.move.9
    n: 9
    name: 手腳時序
    one: 手射出去腿才收，不重疊
    l: L4
    physical: 蛙式效率<mark>最敏感的變數</mark>是 arm-leg coordination 時序（Nicol 2022）。兩個推進峰值（手 insweep + 腿踢）要盡量接近但<mark>不重疊</mark>——重疊時兩個推進力互相干擾。Late kick（Peaty）在 insweep 啟動時才踢腿。
    drills:
    - 重疊時序
    - 划次速度訓練
    cue_bad: 手腳同時動 / 手完全前伸到底才能啟動踢腳
    cue_why: 同時動等於同時踩油門和煞車，推進力相互干擾；手完全伸直才踢則製造完全停頓空窗，是競技速度流失主因。收腿準備可在 insweep 末段開始。
    cue_good: 划手時腿保持流線、踢腳時手保持流線，推進相交替不重疊
    lnote: L4 的核心問題。
    links:
      drills:
      - Br31
      - Br32
  - id: breast.move.10
    n: 10
    name: 連鎖觸發
    one: 每個動作製造下一個的條件
    l: L5
    physical: L5 感知是<mark>每個動作製造了下一個動作需要的條件</mark>：手掌水壓建立→insweep 啟動；insweep 帶起身體→俯衝角度準備；阻力下降→蹬腿啟動；渦流整合完成→速度下降→下一外划啟動。每個接點是感知觸發，不是計時或記憶形式。
    drills:
    - 時速拉手
    - 單臂蛙式
    lnote: L5 連鎖結構，末端感知穩固是前提。
    links:
      drills:
      - Br20
      - Br18
  - id: breast.move.11
    n: 11
    name: 波動（俯衝角度）
    one: 角度對了升力自然出現
    l: L5
    physical: Wave style 波動有兩個功能：<mark>減阻</mark>（收腿時身體傾斜、膝蓋前移量最少）和<mark>流體升力</mark>（俯衝角度產生壓力差向上的力，物理機制確立，蛙式中量化貢獻尚未直接測量）。角度對了升力自然出現，不需特別做動作。
    boundary: <mark>腰椎伸展幅度</mark>限制肩膀能升起的高度——屬效率上限，動作可完成但 coupling 能量天花板降低，隨年齡下降。
    drills:
    - 水下波動
    - 潛水下衝
    cue_bad: 波動要更大 / 讓肩膀升起來 / 刻意游波動
    cue_why: 在強調動作幅度、從動作形式反找感知，效果差；波動過度則上身過度出水製造額外波阻、dome 位置蹬腿損失推進方向。
    cue_good: 往下切時，有沒有什麼把你頂上來（只升到二頭肌位置，不是胸口出水）
    lnote: L5 全身張力的關鍵，波動是推進的副產品。
    links:
      drills:
      - Br23
      - Br21
- stroke: fly
  premise: 蝶式的推進是頭到腳的<mark>波動傳遞</mark>，不是手腳上下擺動；波動起於壓胸，終於腳尖。<span class="cert">🔵</span>
  moves:
  - id: fly.move.1
    n: 1
    name: 波動啟動（壓胸起波）
    one: 胸骨下壓，能量傳到腳
    l: 前置–L2
    physical: 推進是<mark>頭尾方向波動傳遞</mark>，不是上下擺動。波動起源於<mark>胸骨/下肋主動下壓</mark>，沿體軸傳至踝，振幅逐節放大（Sanders 1995 正弦 H1 波、鞭打力學）。腳踝是終點加速器，不是發力源。
    boundary: <mark>胸椎活動度</mark>是波動觸發的硬體前提。胸椎僵硬者胸部下壓幅度受限，腰部會過度代償。胸椎活動度不足是硬體問題，需陸上活動度訓練優先，不是感知問題。
    drills:
    - 胸部下壓
    - 仰面流線蝶腿
    cue_bad: 臀部上下動帶起波浪
    cue_why: 髖部是波動放大器（中繼），不是發力源；意識放臀部會用主動上下代償，波動傳不到腿尖。
    cue_good: 壓胸起波（頭部+胸骨協同下壓）
    lnote: 前置感知波動游是整個框架的起點。
    links:
      drills:
      - Fl1
      - Fl5
  - id: fly.move.2
    n: 2
    name: 第一踢（入水踢）
    one: 手入水同時踢，啟動波動
    l: L2–L3
    physical: 第一踢在手臂入水同時發生：<mark>啟動波動鏈</mark>、填補手未捕水時的推進空隙、定位身體深度（決定 EVF 角度）、提供髖部上浮力矩。entry-kick 時機越早，臂推進期越長、阻力越低（r=-0.45, Strzała 2017）。加速度貢獻 1.9 m/s²。
    boundary: 第一踢的功能依賴波動傳遞已建立；波動未建立時，第一踢只是「又一次腿部發力」。
    drills:
    - 胸部下壓
    - 跨過木桶
    lnote: 第一踢與第二踢功能完全不對稱，須分別訓練。
    links:
      drills:
      - Fl1
      - Fl12
  - id: fly.move.3
    n: 3
    name: 外划定位
    one: 輕展開到捕水位置
    l: L3–L4
    physical: 外划<mark>不是推進動作，是捕水位置的定位動作</mark>——讓手臂到達 EVF 起始位置。有升力推進（約 1.4 m/s²）但不可主動強調，主動外划壓縮 Insweep 加速空間。外划相是蝶式週期中技術最不穩定的環節（Porto 2024）。
    boundary: <mark>肩關節活動度</mark>是外划到位的硬體前提。肩活動度不足者外划無法順滑展開，會用過大幅度代償。硬體問題與感知問題不同：靜止狀態建不起前臂水壓即指向硬體。
    drills:
    - 寬Y型划水
    - 頭朝下划水（窄Y）
    cue_bad: 手入水靠近中線/額頭正前方
