      - Fl15
      - Fl19
- stroke: starts-turns
  premise: 出發與轉身的動作窗口極短（0.5–1 秒），完成後才感受得到結果——沒有「做到一半修正」的空間，品質取決於切換瞬間的流線型與方向。<span class="cert">🔵</span>
  moves:
  - id: starts-turns.move.1
    n: 1
    name: 推蹬（出發）
    one: 向前墜落，不是主動跳出
    physical: 精英選手起跳角度 <mark>21–27°</mark>（部分研究低至 -18.7°，即向下入水），遠低於傳統教學的 30–40°。降低起跳角度→<mark>水平速度增加</mark>，飛行距離縮短但入水後速度保留更好。Kick Start（現代主流）前後腳分工不同：後腳產生水平速度（蹬推向前），前腳產生垂直速度（調整飛行弧線）。
    boundary: 起跳台上等待裁判指令時全身張力升高，入水瞬間的感知容易被遮蔽——這是張力造成的感知遮蔽（高風險時刻），不是技術不足，比賽出發訓練須特別注意。
    cue_bad: 用力跳出去
    cue_why: 強化向上分力，起跳角度過高，水平速度損失。
    cue_good: 讓重心向前倒，後腿釋放它
    lnote: 出發第一個切換點；水平速度是成績主要預測因子。
  - id: starts-turns.move.2
    n: 2
    name: 入水（出發）
    one: 全身穿過同一個洞
    physical: 入水目標是<mark>全身穿過同一個洞</mark>——手先切入，身體沿同一路徑跟進，腿最後穿過。入水角度身體略低於水平（不是垂直插入）。重心水平速度與入水距離是成績的主要預測因子，入水角度是次要因子（PLOS ONE 2020）。
    boundary: <mark>腳踝完全伸展（蹠屈）</mark>是入水減阻的硬體前提；踝關節僵硬者腳趾無法朝後（腳趾朝腳背的縮緊狀態），入水截面積增大、阻力上升——屬解剖限制不是技術問題。
    cue_bad: 插水不要打水花
    cue_why: 技術目標而非感知目標，泳者聚焦表面形式（水花大小），反而忽略穿越的連貫性。
    cue_good: 想像全身穿過同一個洞，手開的洞腳也要穿過去
    lnote: 出發第二個切換點；入水流線型品質直接決定後續速度保留。
  - id: starts-turns.move.3
    n: 3
    name: 接近轉身
    one: 靠計步，不靠抬頭看牆
    physical: 翻滾接近的核心是<mark>頭部朝下、不抬頭看牆</mark>。抬頭看牆會讓頸部伸展、破壞翻滾的旋轉動量，並強迫身體提前減速。有經驗的泳者靠<mark>計步（stroke count）</mark>判斷翻滾時機——從五線旗到牆的划手次數是固定的，熟悉後不需視覺確認。
    cue_bad: 翻滾要快
    cue_why: 「快」沒有感知錨點，常造成翻滾提前或過度旋轉。
    cue_good: 讓速度帶著你翻，不要主動做翻滾的動作
    lnote: 計步感知未建立會讓每次翻滾時機不穩定（要嘛踢到牆、要嘛碰不到）。
  - id: starts-turns.move.4
    n: 4
    name: 觸牆推蹬
    one: 腳到指尖一條線彈出
    physical: 觸牆前<mark>雙臂已在流線型</mark>（在腳觸牆之前完成），讓推蹬力量直接轉換為流線型水平速度，不需推蹬後再整理姿勢。推蹬時身體是一條線：背部平坦、臀部收緊、雙臂已伸展。力量路徑由後往前連貫傳遞（腳→腿→臀→背→肩→指尖）。各式觸牆差異：自由式/仰式單手翻滾、流線型在翻滾過程建立；蛙式/蝶式雙手同時觸牆、流線型建立速度更關鍵。
    cue_bad: 推牆要有力
    cue_why: 力量感知無方向，常造成向下蹬而非向前蹬，水平速度損失。
    cue_good: 推蹬後感覺力量從腳底傳到手尖，是一條線
    lnote: 手臂未在觸牆前到位會讓動能損失在整理姿勢的時間。
  - id: starts-turns.move.5
    n: 5
    name: IM 轉身：背→蛙
    one: 觸碰觸發旋轉，三種轉法擇一
    physical: 規則：觸牆時肩部仍在仰式位置（與水平面夾角 < 90°）；離牆時肩部須已通過垂直面朝向蛙式（≥ 90° 旋轉完成）。三種轉法 7.5m 成績<mark>無顯著差異</mark>（PMC7918682）：即使 Crossover 推出速度統計顯著較高（2.17 vs 2.03 m/s），優勢在 7.5m 內被抵消。Open turn 旋轉弧度最大、容錯率高；Bucket turn 向後翻滾、憋氣需求高（須完整 pullout）；Crossover turn 觸牆與旋轉幾乎同時、動作窗口最短、腳觸牆位置最淺（0.50 foot plant index）、推蹬最水平。
    boundary: 選轉法不靠感覺判斷哪種「比較快」，用計時測試（觸牆到 7.5m）比較——個人執行最一致的那種，才是實際最快的（Open 練到完全一致可能比 Crossover 練到 80% 穩定更快）。
    lnote: 三種轉法沒有感知上的「最優」，依個人感知強項選擇。
  - id: starts-turns.move.6
    n: 6
    name: IM 轉身：蝶→背
    one: 觸牆即縮腿，折疊最短路徑
    physical: 蝶→背是四個 IM 轉身中<mark>最快</mark>的（PubMed 30694108）。速度優勢來自：不需翻滾，雙手觸牆後直接縮腿，腳快速落牆推出。三個常見效率損失：觸牆後停頓確認、縮腿路徑過長、觸牆後換氣。<mark>折疊感</mark>（膝蓋快速收向胸口，不繞圈）代表縮腿路徑最短、腳最快落牆。推出後以仰姿維持流線型，力量路徑與仰式轉身相同。
    lnote: 蝶式剛結束的換氣衝動須主動忍住，否則打斷旋轉動量。
  - id: starts-turns.move.7
    n: 7
    name: 蛙式 Pullout
    one: 水下單次手划＋一次蛙踢
    physical: 蛙式轉身/出發後不做連續的水下海豚腿（規則只允許一次蝶腳），改為 <mark>pullout</mark>：流線型滑行 → 手划（從流線型前方往身體兩側向後拉，類似 outsweep → insweep，但更接近下壓拉水）→ 蛙踢收腿/踢出 → 出水。規則：水下最多一次踢腿。三種技術（Fly-Kick First 蝶腳先行 / Combined 合併式 / Pull-Down First 手划先行）成績<mark>無統計差異</mark>（PMC9445308）。破水時，規則要求頭在第二次手划手轉向內的最寬處之前出水，所以蛙踢要把身體送上水面、接上第二次手划，而不是在水下停住。
    boundary: 收腿時膝蓋外張（不朝後）會增加迎水面積；憋氣不足者會在 pullout 中途換氣拖慢整體——前者是路徑問題，後者是憋氣耐受的生理限制。
    lnote: 不要一開始就教固定技術；多數泳者有下意識偏好（先踢或先划），從現有偏好調整比從零改更有效率。
  - id: starts-turns.move.8
    n: 8
    name: 開放式轉身
    one: 頭低貼水面，縮小半徑掉頭
    physical: 蛙式、蝶式雙手同時觸牆後的掉頭。一側手立刻離牆、<mark>手肘貼身體在水下往後帶</mark>；另一手彎著肘從頭上越過入水；雙膝與小腿收緊、兩腳疊在一起，雙腳側向踩牆、蹬出的途中轉回俯臥。重點是<mark>頭和肩膀貼近水面、轉動半徑小</mark>，速度主要輸在觸牆到離牆之間的停留。離牆時身體須是俯臥。
    boundary: 肩活動度或頸部受限的人，雙手越頂與頭轉向後方換氣的動作會受限，這是解剖限制，改用較小的動作範圍，不是靠硬轉。
    lnote: 先在離牆處練水平旋轉，再回牆邊分解；兩側都要練。
    links:
      drills:
      - ST7
      - ST8
      - ST9
  - id: starts-turns.move.9
    n: 9
    name: 仰式翻滾轉身
    one: 過旗計步、翻成俯臥、一個連續手划、翻滾、仰臥蹬出
    physical: 過旗後按划手數游，肩膀轉過垂直面進入俯臥，立即接一個連續的單手划或雙手同時划來啟動翻滾，翻滾後雙腳同高踩牆，蹬出時<mark>必須已回到仰臥</mark>。翻成俯臥後不能停頓或滑行。翻滾的收腿與雙臂在頭上伸直的原則與自由式翻滾相同。
    lnote: 計步數隨速度與蛙鞋改變，要重新標定；水下段遵守安全條件。
    links:
      drills:
      - ST4
      - ST13
  - id: starts-turns.move.10
    n: 10
    name: 終點觸牆
    one: 最後一划不滑行、不抬頭，伸長觸牆
    physical: 終點觸牆的目標是<mark>進牆時速度還在</mark>：最後一划調整時機，距離不對就補半划或加踢腿。自由式與仰式單手伸長觸牆、身體側向延伸；蛙式與蝶式<mark>雙手分開、同時觸牆</mark>。仰式終點看不到牆，靠過旗後的划手數判斷，觸牆時必須是仰臥。
    lnote: 觸牆也要在疲勞時練；進牆減速的損失在每次轉身與終點都會出現。
    links:
      drills:
      - ST14
  - id: starts-turns.move.11
    n: 11
    name: 接力交接
    one: 腳不早於前一棒觸牆離台，預測而不是等待
    physical: 規則要求下一棒的腳不能比前一棒觸牆更早離開出發台，提早離台整隊犯規。下一棒要在前一棒進牆的最後一兩划，根據他的節奏預測觸牆時間，讓腳離台落在觸牆之後。風險是提早犯規，不是慢一點。
    lnote: 訓練中的目測只能用來練判讀；正式比賽怎麼判定，以當次賽事規程為準。
    links:
      drills:
      - ST15
  - id: starts-turns.move.12
    n: 12
    name: 自由式破水
    one: 最後一踢與第一划同步，頭不抬
    physical: 水下海豚踢結束時，第一划與最後一下海豚下踢同步發動，不是轉成自由式踢之後才划。第一划之前維持流線，手肘在身體內側發動，前伸手繼續往前送，下巴貼近胸口、不抬頭找水面。起跳後的第一划不換氣；200 公尺以上，轉身後的第一划可以換氣。水下不超過 15 公尺，之前頭須破水。
    lnote: 出水一定要單獨練；整套細節見自由式 Breakout 七要點。
    links:
      drills:
      - ST18
  - id: starts-turns.move.13
    n: 13
    name: 仰式破水
    one: 最後一下上踢發動第一划，仰式踢不放鬆
    physical: 水下仰臥海豚踢，換成仰式踢，第一划用最後一下海豚上踢發動，並在頭破水之前開始。轉換時踢水強度不減，前伸手保持伸直，頭與上半身對齊、往前破水而不是向上。水下不超過 15 公尺，之前頭須破水。用鼻夾或上唇壓鼻孔，把空氣留在肺裡到出水。
    lnote: 水下距離與踢數依個人，有人看著、不憋到極限。
    links:
      drills:
      - ST20
  - id: starts-turns.move.14
    n: 14
    name: 蝶式破水
    one: 第一划在水下發動，頭在第一划時破水
    physical: 水下海豚踢之後，第一划在水下發動、把身體帶到水面，頭在這一划破水，之後一直待在水面直到下一次轉身或終點。水下一次手划加一或多次腿踢，水下不超過 15 公尺。第一划是否換氣是取捨：換氣會抬頭、打斷流線，不換氣要多忍一下，看距離與當下狀況決定。
    lnote: 固定踢數與是否換氣各游幾趟比較，不套統一規定。
    links:
      drills:
      - ST18
- stroke: open-water
  premise: 開放水域沒有牆、沒有池底線，每一划都要自己推進、自己找方向。安全前提：不獨自下水、帶顯眼的救生浮標、先確認水溫與水況。<span class="cert">🔵</span>
  moves:
  - id: open-water.move.1
    n: 1
    name: 定向抬頭
    one: 只讓眼睛剛出水，看完臉回水
    physical: 抬頭看前方時，只把眼睛抬到水面看目標，看完臉立刻回水，再轉頭換氣。抬得越高、停得越久，髖與腿越往下沉。看與換氣可以分開做或合併做，依浪況選。抬頭的頻率看自己偏多少，不用固定數字。
    lnote: 先在泳池練，確認抬頭那一划腿沒有沉。
    links:
      drills:
      - OW1
      - OW2
  - id: open-water.move.2
    n: 2
    name: 游直線
    one: 左右對稱，偏多少自己要知道
    physical: 左右划手不對稱、單邊換氣、踢腿偏向，都會在沒有參照物時讓人偏航。先在安全的條件下測自己的偏向，再決定抬頭頻率。雙邊換氣在開放水域的用途是保留選邊：避浪、看浮標、看對手。
    lnote: 偏向若沒改善，回到單一泳式的技術分析處理手跨中線或踢腿。
    links:
      drills:
      - OW3
      - OW4
  - id: open-water.move.3
    n: 3
    name: 跟游
    one: 跟在腳後或髖側，用別人帶動的水流
    physical: 游在前一位泳者的正後方或髖側，利用他帶動的水流減少自己的阻力。省力的方向明確，但不寫百分比。仍要每隔一段抬頭確認方向，不完全交給前面的人。許多鐵人賽允許跟游，細節依報名賽事規則。
    lnote: 先在泳池兩人一組輪流領游，再到開放水域。
    links:
      drills:
      - OW6
      - OW7
  - id: open-water.move.4
    n: 4
    name: 集體出發
    one: 開頭強度遠高於巡航，之後降回去
    physical: 多人同時出發的開頭強度很高，為了搶位置、避開碰撞；重點是衝完之後能降回巡航配速。出發方式有沙灘跑入、水中出發、浮台出發。初學者可以站在外側或後排，開頭有空間。
    lnote: 練的是切換，不是單純衝刺；用配速而不是數字定義快與回穩。
    links:
      drills:
      - OW5
      - OW9
  - id: open-water.move.5
    n: 5
    name: 繞浮標
    one: 內線短但擠，外線長但順
    physical: 靠內線的路徑短，但擁擠、被碰撞的機會多；外線較長但順。轉向時可用仰臥滾轉縮小轉彎半徑，需要先在安全環境練熟。繞浮標的方向以賽事說明為準，左右兩個方向都要會。
    lnote: 初學者先選外線。
    links:
      drills:
      - OW8
      - OW10
  - id: open-water.move.6
    n: 6
    name: 防寒衣游
    one: 身體位置被托起，肩部多了布料的阻力
    physical: 防寒衣的浮力集中在軀幹與大腿，腿沉的人受益最大；肩周圍的布料增加回臂阻力、限制活動度，常見因應是回臂較寬較低、划頻略高。穿脫與合身要提前練。是否允許或強制，依水溫與賽事規則。
    lnote: 不在比賽日第一次穿。
    links:
      drills:
      - OW13
  - id: open-water.move.7
    n: 7
    name: 海豚跳
    one: 淺水雙手前撲入水、蹬底再起
    physical: 在淺水段用海豚跳前進：雙手併攏前撲入水，頭在手臂之間，入水角度向前而不是向下，腳蹬底再起身，重複。水太淺或水底狀況不明時不做，改走或跑到夠深再游。
    lnote: 水深與底質是安全條件，不是建議。
    links:
      drills:
      - OW11
  - id: open-water.move.8
    n: 8
    name: 出水上岸
    one: 手碰底才站，先站穩再走
    physical: 游到手划到底、碰到水底的沙才站起來，最後一段可以加踢腿喚醒下肢。從水平轉為站立的瞬間，血液分布改變，部分人會頭暈；先站穩再起跑。
    lnote: 頭暈就停下來，扶著東西站穩。
    links:
      drills:
      - OW12
- stroke: race
  premise: 用公開比賽成績自己做的分析：一趟比賽的時間花在哪裡、差在哪裡，比賽當天的環境怎麼影響成績，年齡、比賽場數、隊伍怎麼影響好幾年的進步。數字是自己算的，分析前寫好計畫、資料分兩半驗證；對原因的解釋另外標出，還沒有答案的放在研究庫的開放問題。<span class="cert">🔵</span>
  moves: []
