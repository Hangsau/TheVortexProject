    - FrSide1
    interventions: []
    water_interventions: []
  cross_ref: ''
  cross_ref_ids: []
  coverage_gap:
  - no_intervention
- id: prob.free.forward-push
  stroke: free
  category: entry
  title: 入水後手臂用力往前頂，捕水被延後
  public:
    observable: |-
      - 入水後手繼續用力朝前頂，卻沒有順勢轉入捕水。
      - 另一手已離水，前手仍在延伸位置等待。
    mechanism_summary: 手臂主動向前頂與由身體旋轉帶出的延伸是不同事件。前伸若拖延捕水，就會留下推進空窗；要把前伸和捕水放在同一時間軸觀察。
  links:
    technical_analysis:
    - free.tech.22
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: 「手伸遠一點」——在水中主動向前延伸增加划距
  cross_ref_ids:
  - free.err21
  coverage_gap:
  - no_intervention
  - no_drill
- id: prob.free.deep-pull
  stroke: free
  category: pull
  title: 手往池底深壓，上臂也跟著沉下去
  public:
    observable: |-
      - 捕水前整條上臂往池底壓。
      - 手臂越壓越深，頭或軀幹也出現上下位移。
    mechanism_summary: 深壓整條上臂會改變迎水截面；捕水重點是建立合適的手與前臂方向，不是把手放得越深越好。
  links:
    technical_analysis:
    - free.tech.9
    drills:
    - FrSide1
    interventions: []
    water_interventions: []
  cross_ref: 拉水越深推進越多——忽略「越深 = 越大阻力」的代價
  cross_ref_ids:
  - free.err25
  coverage_gap:
  - no_intervention
- id: prob.free.locked-knee-kick
  stroke: free
  category: kick
  title: 膝蓋全程僵直，整條腿上下擺
  public:
    observable: '- 踢水全程看不到膝部隨動，整條腿像同一根桿子擺動。'
    mechanism_summary: 教練說的全程僵直，與膝完全伸直時的正常解剖鎖定不同。可以比較小幅隨動的踢法，但不能因為看到膝伸直就宣稱會受傷或一定沒效率。
  links:
    technical_analysis:
    - free.tech.41
    drills:
    - Fr7
    interventions: []
    water_interventions: []
  cross_ref: 「用腰帶腿踢」——踢水要從腰開始（鎖死膝蓋）
  cross_ref_ids:
  - free.err13
  coverage_gap:
  - no_intervention
- id: prob.free.toes-up-kick
  stroke: free
  category: kick
  title: 踢水時腳尖持續勾起，腳掌朝向前進方向
  public:
    observable: |-
      - 踢腿時腳尖一直朝小腿方向勾起。
      - 同樣努力下，足部朝向沒有隨踢腿換向。
    mechanism_summary: 踝蹠屈可用量會影響足部朝向，但相關研究不能證明拉鬆腳踝就會變快。需另外確認被動範圍與主動控制，才能區分下列兩條陸上路徑。
  links:
