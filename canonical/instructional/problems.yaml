- id: prob.free.stiff-recovery
  stroke: free
  category: recovery
  title: 回臂刻意夾高或繃緊，手臂前送卡住
  public:
    observable: |-
      - 回臂刻意夾高、貼身或繃成固定形狀。
      - 前送過程出現停顿、抖動，無法連續回到入水點。
    mechanism_summary: 回臂路徑需要配合個人活動度與距離的能量需求；彎臂和直臂都可能合用。強迫固定形狀若使回位卡住，應回頭檢查路徑，而不是把某一種肘高當作標準。
