  coverage_gap:
  - no_intervention
- id: prob.free.cross-midline-pull
  stroke: free
  category: pull
  title: 拉水時手掌斜向肚臍，身體左右偏移
  public:
    observable: |-
      - 水下拉水時，手由肩線斜向肚臍或對側。
      - 划手推進伴隨反覆左右擺動。
    mechanism_summary: 手部作用方向偏向橫向時，向後送水的有效分量會改變。關注的是推進方向，不要求手在身體或池底座標中畫出同一條固定直線。
  links:
    technical_analysis:
    - free.tech.7
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: S 形划水路徑是高效划水的目標；拉水朝肚臍方向斜拉——常見「拉到肚臍」口令造成跨越中線
  cross_ref_ids:
  - free.err10
  - free.err24
  coverage_gap:
  - no_intervention
  - no_drill
- id: prob.free.dropped-elbow
  stroke: free
  category: pull
  title: 捕水時肘先下沉，前臂沒有立起來
  public:
    observable: |-
      - 捕水開始時，肘比手更早向下掉。
      - 前臂還沒轉成迎水面，上臂就已向下壓。
    mechanism_summary: 肘與前臂的位置會同時影響上臂迎水面與捕水方向。外觀能指出捕水配置改變，不能據此算出推進力歸零或判定特定肌群失效。
  links:
    technical_analysis:
    - free.tech.9
    - free.tech.21
    drills:
