  - no_intervention
  - no_drill
- id: prob.free.cross-midline-entry
  stroke: free
  category: entry
  title: 手從頭的正前方跨過中線入水
  public:
    observable: |-
      - 由正面看，手跨到頭部中線的另一側入水。
      - 入水後先向外掃回，身體伴隨左右偏移。
    mechanism_summary: 跨中線的入水點會讓後續捕水需要額外橫向調整。先看入水位置與身體偏移是否同時出現，不從這個外觀直接判定肩部病變。
  links:
    technical_analysis:
    - free.tech.20
    drills:
    - Fr13
    interventions: []
    water_interventions: []
  cross_ref: 「頭部正前方入水」是標準入水點
  cross_ref_ids:
