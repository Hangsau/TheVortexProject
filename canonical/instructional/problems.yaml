    - movement.intervention.ankle-plantarflexion.capacity-control
    water_interventions: []
  cross_ref: 用力踢水才能快——力量優先於柔韌性；腳踝僵硬是先天條件，無法改善
  cross_ref_ids:
  - free.err11
  - free.err14
  coverage_gap: []
- id: prob.free.excess-roll
  stroke: free
  category: rotation
  title: 身體轉到接近側躺，下一次捕水接不上
  public:
    observable: |-
      - 身體轉得接近完全側躺，前手捕水被拖住。
      - 轉回來時又需要大幅反向調整。
    mechanism_summary: 旋轉需要與對側手產力銜接；轉得更大或更快，並不保證能增加有效推進。問題在轉體後捕水接不上，而不是偏離某個固定角度。
