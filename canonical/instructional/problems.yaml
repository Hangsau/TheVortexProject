- id: prob.free.head-lift-breath
  stroke: free
  category: head
  title: 換氣時抬頭看前上方，腿同時下沉
  public:
    observable: |-
      - 換氣時眼睛看向前上方，頭部明顯離開原有體線。
      - 同一瞬間髖或腿下沉，回頭後才恢復。
    mechanism_summary: 抬頭會改變全身平衡，腿部可能需要額外維持姿態。側轉換氣與主動抬頭應分開觀察；利用水面凹陷換氣也需要足夠速度與合適頭位。
