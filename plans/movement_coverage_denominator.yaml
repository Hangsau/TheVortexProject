known_gaps:
  - id: gap.free.up-kick
    description: "自由式上踢（up-kick）沒有任何獨立條目。全域搜尋僅兩處提及，且都是仰式條目的對照句（back.tech.30、teaching-errors.yaml 的仰式誤區段），不足以成立相位。"
    kind: content-missing
    action: "動作圖譜填充階段須補自由式上踢內容，或明確標示為證據缺口"
  - id: gap.udk.tech.5-self-contradiction
    description: "udk.tech.5（certainty 🔴）同一句中「上踢→下踢過渡」出現兩次卻配不同肌群（第一次腹肌+腹斜肌，第二次腹斜肌+豎脊肌），原文自身不一致。"
    kind: source-content-error
    action: "需回原文修正後才能作為 udk 過渡相位的證據"
  - id: gap.starts-turns.three-scenes
    description: "starts-turns 單一 stroke 值承載出發／水下／轉身三個場景，且多條為泳式專屬變體（starts-turns.tech.27 蛙式滑行深度、tech.26 蛙式 pullout、tech.44 自由式 breakout、tech.35 明載蛙式不用 UDK）。原文無任何條目把三場景串成單一序列。"
    kind: structural
    action: "動作圖譜的 stroke-demand 須同時帶 scene 與泳式變體標記，不可當成單一線性相位序列"
  - id: gap.free.three-phase-models
    description: "自由式同時存在三套相位模型：Race Club 六階段時鐘模型（free.tech.8）、Kudo 功率二相（free.tech.2/16）、零散描述詞。三者時間切分互相重疊，free.tech.8 模型內不含 catch/pull/push。"
    kind: structural
    action: "stroke-demand 必須指明採用哪一套 phase_model，不得跨模型混用相位"
