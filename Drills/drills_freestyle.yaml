# Freestyle Drills — There's a Drill for That
# Source: There's a Drill for That (Laurie Sherret)
# Perception layer annotations: Vortex L0–L6 framework (Hangsau 2026)
# 9-axis tag fingerprint v1.0 (2026-06-27): 見 Drills/TAG_SCHEMA.md
#
# Fields:
#   l_target: Vortex L level this drill primarily addresses
#   abc_type: A=手感缺失 B=腳感缺失 C=全身張力問題 null=通用
#   perception_goal: 泳者應該感覺到什麼
#   success_signal: 感知成功的樣子
#   failure_signal: 感知失敗的樣子
#   deficiency_fixes: 對應書中 Common Stroke Deficiencies 編號
# 9-axis tag fingerprint:
#   body_position / constraints / movement_pattern / skill_focus / stroke_phase
#   drill_function / cognitive_load / tactile_anchor / difficulty_tier

drills:
  - id: Fr1
    name_en: "Standing Breathing"
    name_zh: "站姿呼吸"
    strokes: [freestyle]
    category: breathing
    equipment: []
    l_target: [L0]
    abc_type: null
    purpose_zh: "建立正確呼吸時機與吐氣節律，消除憋氣習慣"
    how_to:
      - "站在及腰水深，從腰部前彎把臉放進水裡，視線朝池底、頸部與脊椎成一線"
      - "轉頭換氣時想成「下巴滑動」，只轉到一個泳鏡離開水面，用嘴吸氣"
      - "臉回到水中後緩慢而穩定地吐氣，再換到另一側吸氣，兩側交替"
      - "進階：一手向前伸直，朝另一側換氣；臉回到水中時該手在水下划過，另一手接著划"
    perception_goal: "吐氣連續均勻；轉頭換氣時下巴滑動而非抬頭；一個泳鏡在水面下"
    success_signal: "轉頭幅度小，感覺是身體帶動頭轉；呼吸不緊張"
    failure_signal: "需要抬頭才能呼吸；轉回水中時憋氣感"
    deficiency_fixes: [1, 2]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: standing
    constraints: []
    movement_pattern: static
    skill_focus: [breath_rhythm]
    stroke_phase: non_stroke
    drill_function: warmup
    cognitive_load: low
    tactile_anchor: pool_floor_visual
    difficulty_tier: foundation

  - id: Fr2
    name_en: "Head Lead Balance – Face Down"
    name_zh: "頭帶平衡 — 面朝下"
    strokes: [freestyle]
    category: balance
    equipment: []
    l_target: [L1]
    abc_type: null
    purpose_zh: "建立面朝下的身體線條與平衡，感覺肺部入水帶動臀部上浮"
    how_to:
      - "面朝下俯臥，雙手放在大腿前側，維持身體線條"
      - "輕踢水保持穩定前進，放鬆肩頸，把肩膀往下壓讓頸部「拉長」"
      - "視線朝池底，肺部與額頭當成一個整體往水裡壓，臀部會自然浮起"
      - "這是建立姿勢的練習不是求快，輕踢、保持耐心"
    perception_goal: "肺部往下壓水時臀部自然浮起；頸部長而放鬆；全身像一根漂浮的木材"
    success_signal: "不需要用腿撐起臀部；視線自然朝向池底"
    failure_signal: "臀部下沉；頸部緊繃；感覺在用力踢腿維持位置"
    deficiency_fixes: [3]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: [no_arms]
    movement_pattern: progressive
    skill_focus: [buoyancy_balance, streamline_line]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: low
    tactile_anchor: pool_floor_visual
    difficulty_tier: foundation

  - id: Fr3
    name_en: "Head Lead Balance – On Your Side"
    name_zh: "頭帶平衡 — 側躺"
    strokes: [freestyle]
    category: balance
    equipment: []
    l_target: [L1]
    abc_type: null
    purpose_zh: "在45度側躺位置建立平衡感知，為旋轉打基礎"
    how_to:
      - "側躺約45度，雙手放在大腿前側，肋骨收住穩定姿勢，視線朝池底"
      - "輕踢水；想讓臀部更靠近水面時，把肺部、肩膀、頭當成一個整體往水裡壓"
      - "左右兩側都練"
    perception_goal: "45度角側躺穩定不搖晃；肺部往水裡壓；視線朝向池底"
    success_signal: "不需要調整姿勢就能維持45度；臀部靠近水面"
    failure_signal: "過度旋轉到90度；感覺在上坡踢水"
    deficiency_fixes: []
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: side
    constraints: [no_arms]
    movement_pattern: progressive
    skill_focus: [buoyancy_balance]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: low
    tactile_anchor: pool_floor_visual
    difficulty_tier: foundation

  - id: Fr4
    name_en: "Head Lead Balance with Rotation"
    name_zh: "頭帶平衡 + 旋轉"
    strokes: [freestyle]
    category: balance
    equipment: []
    l_target: [L1, L2]
    abc_type: C
    purpose_zh: "結合雙側平衡，加入換氣旋轉，感覺身體帶動頭轉而非頭帶動身體"
    how_to:
      - "從側躺位置開始，加入旋轉，每6到10次踢水從一側臀部翻轉到另一側"
      - "旋轉由臀部底部發動，是快速的翻轉，搭配穩定緊湊的踢水"
      - "加入換氣：頭轉到最小，靠身體旋轉帶起換氣，每三次旋轉換一次氣"
      - "換氣後立刻回到平衡位置"
    perception_goal: "旋轉從臀部啟動；頭轉量最小；回到水中立即找到平衡"
    success_signal: "換氣後立刻回到另一側45度平衡；頭部像跟著身體走"
    failure_signal: "抬頭換氣；旋轉後失去平衡需要調整"
    deficiency_fixes: [1, 2, 4, 5]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: transitional
    constraints: [no_arms, breath_added]
    movement_pattern: rotational
    skill_focus: [hip_drive, rotation_connection]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: intermediate

  - id: Fr5
    name_en: "Superman Kick"
    name_zh: "超人踢水"
    strokes: [freestyle]
    category: kick
    equipment: []
    l_target: [L1, L2]
    abc_type: B
    purpose_zh: "手臂伸前的流線姿勢踢水，感覺收腹讓背部平坦，肺部壓水"
    how_to:
      - "超人姿勢俯臥，雙臂向前伸直與肩同寬"
      - "收小腹把背打平，頭部中立、頸與脊椎對齊、視線朝池底"
      - "放鬆肩膀往下壓讓頸部拉長，肺部往水裡壓幫助臀部上浮"
      - "在這姿勢下持續踢水"
    perception_goal: "收腹後背部感覺平坦；肺部往水裡壓；頸部與脊椎對齊"
    success_signal: "臀部靠近水面；踢水感覺從髖部啟動"
    failure_signal: "背部拱起；踢水感覺只在膝蓋以下"
    deficiency_fixes: []
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: [no_arms]
    movement_pattern: continuous
    skill_focus: [streamline_line, kick_origin]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: low
    tactile_anchor: pool_floor_visual
    difficulty_tier: foundation

  - id: Fr6
    name_en: "Arm Lead Balance or 6-Count"
    name_zh: "手臂主導平衡（六拍）"
    strokes: [freestyle]
    category: balance
    equipment: []
    l_target: [L2, L3]
    abc_type: null
    purpose_zh: "單臂伸前的側身平衡，感覺錨定不移動，平衡來自核心"
    how_to:
      - "以右側躺開始，右臂在身體下方向前伸；左臂橫過身體、手放右臀上，手肘收緊貼身"
      - "輕踢水，靠身體旋轉換氣（不抬頭），維持約45度、視線朝池底"
      - "換邊：左臂前伸重複，踢10到20下再翻到另一側；前伸手錨定在水面下方、由核心維持平衡"
      - "熟練後縮短到每側6次踢水；開始抓水時臀部立即啟動，划手與轉臀同步"
    perception_goal: "前臂穩定不搖晃，感覺是核心在穩定身體，不是手臂在平衡"
    success_signal: "切換側邊時流暢；髖部帶動旋轉感明顯"
    failure_signal: "需要揮動手臂才能保持平衡；踢腿不穩定"
    deficiency_fixes: [4, 5, 10]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: side
    constraints: [single_arm]
    movement_pattern: alternating
    skill_focus: [buoyancy_balance, hip_drive]
    stroke_phase: glide
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: intermediate

  - id: Fr7
    name_en: "Streamline Kick"
    name_zh: "流線踢水"
    strokes: [freestyle]
    category: kick
    equipment: []
    l_target: [L1, L2]
    abc_type: B
    purpose_zh: "流線姿勢踢水（正面與背面），感覺踢水效率不依賴浮板"
    how_to:
      - "仰躺streamline：收小腹「往上往內」把背打平，肺部往水裡壓"
      - "膝蓋不破水面，腳掌把水「煮沸」而非大濺水，腳趾微內八，從臀部和大腿發力（不是膝蓋）"
      - "俯臥streamline：同樣收小腹打平背，膝蓋只微彎、腳趾微伸，腳在水下煮沸水面"
      - "需要時抬頭換氣，再回到streamline找平衡"
    perception_goal: "踢水讓水面沸騰而非大飛濺；腳不出水面；膝蓋微彎"
    success_signal: "身體線條穩定向前；沒有浮板也能維持位置"
    failure_signal: "膝蓋大幅彎曲；水面大飛濺；感覺在蹬自行車"
    deficiency_fixes: [7]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: [no_arms]
    movement_pattern: continuous
    skill_focus: [kick_origin, streamline_line]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: low
    tactile_anchor: water_sound
    difficulty_tier: foundation

  - id: Fr8
    name_en: "Vertical Kick"
    name_zh: "垂直踢水"
    strokes: [freestyle]
    category: kick
    equipment: []
    l_target: [L2, L3]
    abc_type: B
    purpose_zh: "垂直踢水訓練從髖啟動的踢腿，消除自行車踢法"
    how_to:
      - "在深水區直立踢水，先把雙手交叉放在對側肩膀上"
      - "身體保持垂直挺直（不前傾不後仰），做10、20、30或60秒的組數"
      - "進階：把手舉出水面（水球姿勢）；最難：雙臂上舉成streamline"
      - "重點：從臀部發力、腳趾下壓、踢水穩定緊湊、腳微內八、核心收緊"
    perception_goal: "踢水從腹股溝和大腿啟動；腳踝放鬆；踢水緊實短促"
    success_signal: "身體在水中保持垂直；踢水不需要膝蓋大幅彎曲"
    failure_signal: "身體前傾或後傾；需要很大的踢幅才能維持高度"
    deficiency_fixes: [7]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: vertical
    constraints: [no_arms]
    movement_pattern: static
    skill_focus: [kick_origin, core_tension]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: intermediate

  - id: Fr9
    name_en: "360 Roll"
    name_zh: "360度滾轉"
    strokes: [freestyle]
    category: balance
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "緩慢旋轉360度訓練核心控制，感覺身體從髖部以下整體旋轉"
    how_to:
      - "從面朝下俯臥位置開始，在水中緩慢旋轉360度同時維持平衡"
      - "穩定緊湊地踢水、核心收緊；先把手放大腿，在每個位置（面朝下、側躺、仰躺、另一側）短暫停留"
      - "旋轉從臀部下方發動，肩膀到腳當成一個整體一起轉，雙腳併攏、腳趾下壓"
      - "熟練後可加速並沿水道中線前進；再進階把手上舉成streamline，維持平背收肋"
    perception_goal: "旋轉從臀部下方啟動；肩膀到腳像一個整體轉動；不用頭帶動旋轉"
    success_signal: "在泳道中線保持直線旋轉；每個姿勢都能找到平衡"
    failure_signal: "頭部帶動旋轉；漂離中線；旋轉不均勻"
    deficiency_fixes: [4, 5]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: transitional
    constraints: [no_arms]
    movement_pattern: rotational
    skill_focus: [hip_drive, rotation_connection]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: intermediate

  - id: Fr10
    name_en: "Sailboat"
    name_zh: "帆船划手"
    strokes: [freestyle]
    category: arm
    equipment: []
    l_target: [L3, L4]
    abc_type: A
    purpose_zh: "單臂高肘划水感知，強調錨定後整體旋轉推進，像用身體跳過手臂"
    how_to:
      - "一手向前伸直（如左手），另一手剛離開水面、手肘高舉、指尖輕觸水面，以左臀約45度乘載"
      - "踢幾下取得動力，前伸手開始抓水，沿直線用力推到臀部，過程中保持高手肘（EVF）"
      - "感覺推水的推進與臀部滑開；左手推到底時右手前刺，換左手變成「帆」，像翻越到另一側"
      - "抓水卡住時，手錨定後把肩膀略往內轉、手肘自然略外轉，幫助建立EVF；全程放慢"
    perception_goal: "前臂垂直入水錨定後，感覺身體整個翻越過去；拉手配合髖旋轉"
    success_signal: "每次划水都感覺到明確推力；換側流暢"
    failure_signal: "拉水感覺在直臂往後推；旋轉和划手脫節"
    deficiency_fixes: [6, 11]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: side
    constraints: [single_arm]
    movement_pattern: pause_pulse
    skill_focus: [catch_evf, hip_drive]
    stroke_phase: catch
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: hand_pressure
    difficulty_tier: advanced

  - id: Fr11
    name_en: "One Arm Stroke"
    name_zh: "單臂划手"
    strokes: [freestyle]
    category: arm
    equipment: []
    l_target: [L3, L4]
    abc_type: A
    purpose_zh: "單臂划手強調早期入水捕水，感覺核心同時帶動換氣與划手旋轉"
    how_to:
      - "單手自由式，朝非划手側換氣；另一手貼身、手放大腿"
      - "用臀部轉到兩側45度，換氣時不過度旋轉；抓水要早、靠近水面開始"
      - "抓水時手肘略往上往外轉、位置高於手掌；一趟練一手，下一趟換手"
      - "重點是技術不是速度，靠核心同時帶動軀幹與划手完成換氣，快速換氣後盡快回到面朝下視線朝池底"
      - "進階：改成朝划手側換氣"
    perception_goal: "捕水發生在水面附近而非深處；感覺肘部比手高"
    success_signal: "換氣自然，不需要額外用力抬頭；每側都能流暢完成"
    failure_signal: "捕水太深；換氣需要額外抬頭；一側比另一側困難很多"
    deficiency_fixes: [1, 2, 5, 6, 7, 11]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: [single_arm]
    movement_pattern: continuous
    skill_focus: [catch_evf, hip_drive]
    stroke_phase: catch
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: hand_pressure
    difficulty_tier: advanced

  - id: Fr12
    name_en: "Fingertip Dribble"
    name_zh: "指尖拖水"
    strokes: [freestyle]
    category: arm
    equipment: []
    l_target: [L3]
    abc_type: A
    purpose_zh: "恢復臂高肘訓練，感覺手指輕掠水面，肘部始終高於手腕"
    how_to:
      - "自由式划手回臂時，指尖輕輕掠過水面（用指甲輕擦水面）"
      - "全程保持手肘高於手腕，帶出高手肘與指尖入水"
      - "放慢游，回臂的手盡量放鬆，並把每一划保持伸長"
    perception_goal: "手指輕輕刮過水面；手臂放鬆；肘部保持高位"
    success_signal: "指尖留下清晰水跡；入水時指尖先入"
    failure_signal: "手掌整個接觸水面；肘部比手低"
    deficiency_fixes: [9, 12]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: []
    movement_pattern: continuous
    skill_focus: [recovery_path]
    stroke_phase: recovery
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: surface_break
    difficulty_tier: intermediate

  - id: Fr13
    name_en: "Trace The Line"
    name_zh: "描黑線"
    strokes: [freestyle]
    category: arm
    equipment: []
    l_target: [L2, L3]
    abc_type: A
    purpose_zh: "視覺回饋修正手部入水過中線，感覺入水點在肩膀正前方偏外"
    how_to:
      - "沿水道中央游，能看到池底黑線"
      - "用手「描」黑線外緣：左手描黑線左側、右手描右側（線細就描外側幾吋）"
      - "此練習可暫時抬眼看入水點對照黑線；讓入水落在肩膀正前方或略外側"
    perception_goal: "入水點對準黑線外緣；不穿越身體中線；視線往下看線"
    success_signal: "兩手分別對準黑線兩側外緣"
    failure_signal: "手入水時穿越中線；感覺兩手快要碰到"
    deficiency_fixes: [3, 8, 13]
    source: "There's a Drill for That"
    source_ids: [src.theres-a-drill-for-that]
    body_position: prone
    constraints: []
    movement_pattern: continuous
    skill_focus: [entry_extension, spatial_awareness]
    stroke_phase: entry
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: pool_floor_visual
    difficulty_tier: intermediate

  - id: Fr14
    name_en: "Skating Underwater or Underwater Recovery"
