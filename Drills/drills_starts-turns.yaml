    difficulty_tier: intermediate

  - id: ST11
    name_en: "Turn 25"
    name_zh: "轉身 25（中池起動、全速進牆、全速出）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "把轉身當成一個要全力做的環節來練：只計轉身那一段的品質與時間，其餘距離都是為它服務。"
    how_to:
      - "從池中央起動（不從牆上出發），以正常訓練強度游向牆，進牆不減速"
      - "轉身後全力出牆，出牆後游 5 到 10 公尺就停；水下段依規則上限內，遵守安全條件，不勉強憋氣"
      - "每趟回到起點休息，用同一個起點與終點做計時或比較，同伴或教練看進牆、轉身、出牆三段"
      - "每一趟只挑一個要修的重點，例如這趟看進牆有沒有減速"
    perception_goal: "轉身是一個在高速下完成的動作，進牆前不減速、離牆後馬上加速。"
    success_signal: "進牆沒有滑行、轉身沒有停頓、出牆速度比進牆更快。"
    failure_signal: "進牆前就把速度收掉、轉身時休息一下、出牆後才開始用力。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（轉身是比賽中的加速機會，練習時就要全力做；以 8 公尺進出的轉身競賽形式）"
    source_ids: [src.hall-murphy-2020]
