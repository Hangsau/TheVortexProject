  - id: ST19
    name_en: "Breaststroke Pullout Distance"
    name_zh: "蛙式 pullout 計距"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "固定一次蹬牆加一次 pullout，量自己從牆到浮出水面的位置，比較不同做法（先划、先踢、流線長短）的差別。"
    how_to:
      - "蹬牆成流線，滑行到速度剛開始降低時做一次 pullout（一次手划加一次蛙踢），之後浮出水面"
      - "同伴在池邊標記頭破水的位置，記錄距離"
      - "重複幾趟，只換一個變項（例如滑行長短），其他維持一樣，比較哪一種浮出的位置更遠"
      - "只在規則允許的範圍內練（頭須在第二次手划最寬處之前出水）；覺得需要換氣時提早出水，不憋到極限"
    perception_goal: "pullout 的目標是把蹬牆的速度接成往前的推進，不是在水下停住等時間。"
    success_signal: "同樣的蹬牆，浮出水面的位置越來越遠且穩定。"
