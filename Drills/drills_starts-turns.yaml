    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: surface_break
    difficulty_tier: advanced

  - id: ST19
    name_en: "Breaststroke Pullout Distance"
    name_zh: "蛙式 pullout 計距"
    strokes: [starts_turns]
    category: turn
    turn_type: [breakout]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "固定一次蹬牆加一次 pullout，量自己從牆到浮出水面的位置，比較不同做法（先划、先踢、流線長短）的差別。"
    how_to:
      - "蹬牆成流線，滑行到速度剛開始降低時做一次 pullout（一次手划加一次蛙踢），之後浮出水面"
      - "同伴在池邊標記頭破水的位置，記錄距離"
      - "重複幾趟，只換一個變項（例如滑行長短），其他維持一樣，比較哪一種浮出的位置更遠"
      - "只在規則允許的範圍內練（頭須在第二次手划最寬處之前出水）；覺得需要換氣時提早出水，不憋到極限"
    perception_goal: "pullout 的目標是把蹬牆的速度接成往前的推進，不是在水下停住等時間。"
    success_signal: "同樣的蹬牆，浮出水面的位置越來越遠且穩定。"
    failure_signal: "滑到幾乎靜止才划、手划後腿沒接上、每趟浮出位置差很多。"
    deficiency_fixes: []
    source: "通行的 pullout 計距練習形式；本庫未取得可定位的單篇出處；水下動作規定依 World Aquatics 游泳技術規則"
    source_ids: [src.world-aquatics-2023-swimming-technical-rules]
    body_position: underwater
    constraints: [no_breath]
    movement_pattern: pause_pulse
    skill_focus: [glide_efficiency, streamline_line]
    stroke_phase: glide
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: partner_feedback
    difficulty_tier: intermediate

  - id: ST20
    name_en: "Backstroke Breakout: Back Dolphin, Transition Kick, First Stroke"
    name_zh: "仰式破水：仰臥海豚踢、轉換踢、第一划"
    strokes: [starts_turns]
    category: timing
    turn_type: [breakout]
    equipment: [fins]
    l_target: [L4, L5]
    abc_type: C
    purpose_zh: "練仰式從水下到水面的銜接：仰臥海豚踢，換成仰式踢，第一划在頭破水之前就開始。"
    how_to:
      - "仰臥蹬牆，雙臂流線，開始水下海豚踢；水下距離由教練指定，不超過規則上限，也不憋到極限，有人在旁邊看"
      - "最後一下上踢時發動第一划，隨後轉成有力的仰式踢，接著連續游數划"
      - "仰臥時氣泡只會往水面跑，對阻力沒有幫助；用鼻夾或上唇輕壓鼻孔，把空氣留在肺裡、水擋在鼻外，找到自己穩定的方法"
      - "同伴看第一划是否在頭破水前就開始、轉換踢是否有力"
    perception_goal: "水下的推進直接接到水面的第一划，中間沒有空窗。"
    success_signal: "破水時速度不掉、第一划接得上、鼻子沒有進水。"
    failure_signal: "海豚踢結束後才開始划、轉換踢變弱、破水時嗆水。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 24 章（仰式出發的水下海豚踢、保持空氣在肺內與出水七要點）"
    source_ids: [src.hall-murphy-2020]
    body_position: supine
    constraints: [no_breath]
    movement_pattern: continuous
    skill_focus: [kick_origin, glide_efficiency]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: surface_break
    difficulty_tier: advanced

  - id: ST21
    name_en: "Crossover Step 1–2: Mid-Pool Roll, Then Roll Into the Wall to a Pullout"
    name_zh: "仰轉蛙 crossover 第 1–2 步：池中往固定一側翻，再進牆翻轉接蛙式 pullout"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "混合式仰式接蛙式的 crossover 拆成五步教，這是前兩步：先固定往哪一側翻，再把翻轉帶到牆邊、蹬出接蛙式 pullout。"
    how_to:
      - "第 1 步：離牆仰式游 4–5 划，往非慣用手那一側滾，像在池中做仰式翻滾轉身；腳碰到水面就算完成。之後觸牆用的是慣用手，所以一開始就固定往非慣用手側滾"
      - "第 2 步：從距牆約 8 公尺仰式游進，過了仰式旗、接近牆時往非慣用手側開始翻，像要做仰式翻滾轉身"
      - "這一步先不管手有沒有觸牆；翻的過程把身體轉向非慣用手側，不要仰臥蹬出，蹬牆後接一個完整的蛙式 pullout"
      - "第 2 步沒有觸牆，比賽會犯規，只是分解練習；觸牆在第 4、5 步才加進來"
    perception_goal: "每次都往同一側翻，翻完身體的方向是清楚的，蹬出去已經朝向俯臥。"
    success_signal: "連續幾次都往同一側翻；蹬牆後轉回俯臥、pullout 完整。"
    failure_signal: "左右亂翻、仰臥蹬出、pullout 推得太深或太淺。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章 The Crossover Transition for the Individual Medley（五步教學的 Step 1、Step 2）"
    source_ids: [src.hall-murphy-2020]
    body_position: transitional
    constraints: []
    movement_pattern: rotational
    skill_focus: [rotation_connection, spatial_awareness]
    stroke_phase: transition
    drill_function: progression
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: intermediate

  - id: ST22
    name_en: "Crossover Step 3: One Hand on the Wall, Drop Into the Flip"
    name_zh: "仰轉蛙 crossover 第 3 步：俯臥單手扶牆，頭往下翻、蹬出接 pullout"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "在牆邊定住，只練觸牆之後的翻轉：從單手扶牆直接翻、蹬出接蛙式 pullout。"
    how_to:
      - "俯臥、頭朝牆，慣用手扶牆，非慣用手放在身體旁邊；輕輕踢腳讓腿浮著"
      - "聽到口令後頭往下壓進翻滾，雙腳踩牆，蹬出接完整的蛙式 pullout"
      - "每次翻完檢查蹬出的方向和深度，再回牆邊做下一次"
    perception_goal: "從扶牆到雙腳踩牆是一個連續的動作，翻的時候身體縮得很小。"
    success_signal: "翻得快、腳踩得穩，蹬出方向正、pullout 深度適中。"
    failure_signal: "翻之前先把頭抬起來看、腳踩到牆時身體還沒縮緊、蹬出後偏向一側。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章 The Crossover Transition for the Individual Medley（五步教學的 Step 3）"
    source_ids: [src.hall-murphy-2020]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [rotation_connection, streamline_line]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST23
    name_en: "Crossover Step 4: Side-Kick Into the Wall, See It, Then Touch"
    name_zh: "仰轉蛙 crossover 第 4 步：側躺踢腿進牆、水下先看到牆再觸牆"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "練 crossover 最容易犯規的那一段：側躺進牆、在水下看到牆、觸牆時還沒轉到俯臥。"
    how_to:
      - "距牆約 5 公尺仰式踢腿進牆，慣用手伸在頭上方，非慣用手放身側"
      - "接近牆時側滾成側躺，慣用手在上；這隻手的上臂保持在耳朵後面，裁判常看這個位置判斷有沒有轉過頭"
      - "側躺時往後側方的水下看牆，繼續踢、閉氣進牆"
      - "慣用手碰到牆後，身體再往俯臥方向稍微轉一點，接著翻轉、蹬出接蛙式 pullout"
    perception_goal: "還沒碰到牆就知道牆在哪裡；觸牆那一刻身體是側躺，不是趴著。"
    success_signal: "每次都在水下先看到牆、觸牆時仍是側躺、觸牆後才轉。"
    failure_signal: "還沒碰牆就轉到俯臥（比賽會被判犯規）、沒看牆所以觸牆時太近或太遠、觸牆的手肘彎掉。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章（五步教學的 Step 4）；觸牆時須仍在仰臥：World Aquatics (2023) SW 9.4 接 SW 6.5"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules]
    body_position: side
    constraints: [no_arms, no_breath]
    movement_pattern: progressive
    skill_focus: [spatial_awareness, rotation_connection]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: advanced

  - id: ST24
    name_en: "Full Crossover Transition (Back to Breast)"
    name_zh: "仰轉蛙 crossover 完整轉身"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L4, L5]
    abc_type: C
    purpose_zh: "把前四步連成完整的 crossover：側躺看牆進牆、慣用手觸牆、腿從水面上帶過、轉回俯臥接蛙式 pullout。"
    how_to:
      - "距牆約 8 公尺仰式游進，過了仰式旗、接近牆時滾向非慣用手側，慣用手在上、上臂在耳後；不要轉到俯臥"
      - "手碰牆之前，先在水下看到牆；最後一划提早開始、手伸長去碰牆，進牆時踢腳不減速"
      - "觸牆後身體往俯臥方向稍微轉一點，收緊的腿從水面上帶過來，帶到看的方向的另一側"
      - "腳踩牆時腳尖指向開始轉的另一側（例如往左轉，腳尖朝右）；進牆面向一邊，出牆面向另一邊"
      - "蹬牆時繼續轉向俯臥，腳離開牆時已經大致俯臥，接蛙式 pullout"
      - "crossover 的最後一口氣比其他轉法早吸，要閉氣到 pullout 結束；氣還撐不到的選手，可以把 pullout 改成一次有力的海豚踢就出水"
    perception_goal: "整個轉身順著同一個方向轉下去，沒有在牆上停下來再反方向起動。"
    success_signal: "看得到牆、觸牆時是側躺、腿從水面上帶過、腳尖朝另一側、離牆時已大致俯臥。"
    failure_signal: "往慣用手側轉而用非慣用手觸牆；側滾太晚撞進牆或太早滑太長；觸牆前就趴下；觸牆後沒有往俯臥轉一點硬從側面翻；手肘彎掉太靠近牆；轉錯邊讓腳尖朝開始轉的同一側。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章（五步教學的 Step 5、十項常見錯誤、年輕選手縮短 pullout 的做法）；觸牆時須仍在仰臥：World Aquatics (2023) SW 9.4 接 SW 6.5；離牆時須已轉向俯臥：USA Swimming 101.6.3.B(2)"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules, src.usa-swimming-101-6-individual-medley]
    body_position: transitional
    constraints: [no_breath]
    movement_pattern: rotational
    skill_focus: [rotation_connection, spatial_awareness]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: advanced

  - id: ST25
    name_en: "Back-to-Breast Open Turn"
    name_zh: "仰轉蛙開放式轉身：仰臥觸牆、腳從水下收、側蹬轉俯臥"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "仰式接蛙式最容易上手的轉法；比 crossover 慢，但最後一口氣可以在牆上吸，接 pullout 前憋氣時間最短，適合剛學混合式或氣還撐不久的選手。"
    how_to:
      - "仰式游進，在仰臥的姿勢下用一隻手觸牆"
      - "觸牆後雙膝收緊、腳從水下收到身體下方，身體往觸牆那隻手的一側轉，頭在轉的時候出水吸氣"
      - "雙腳側向踩牆，蹬牆的過程中轉回俯臥，接蛙式 pullout"
      - "動作細節照開放式轉身的要點：身體縮小、頭貼近水面、不要在牆上停頓"
    perception_goal: "觸牆後很快把身體收小，換一口氣就離開牆。"
    success_signal: "觸牆時是仰臥、在牆上沒有多停、蹬出時轉回俯臥。"
    failure_signal: "還沒觸牆就先翻成俯臥、在牆上抓著停太久、頭抬得很高。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章（開放式轉身的優缺點：最慢、但最後一口氣最晚）；動作步驟依第 26 章開放式轉身要點推導；觸牆時須仍在仰臥：World Aquatics (2023) SW 9.4 接 SW 6.5"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [rotation_connection, breath_rhythm]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST26
    name_en: "Back-to-Breast Reverse Somersault"
    name_zh: "仰轉蛙背翻：仰臥觸牆後向後翻滾"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "仰式接蛙式的另一種轉法：觸牆後順著原本的方向向後翻。比開放式快，但容易失去方向、鼻子容易進水，書的作者不建議比賽使用，列出來供比較與選擇。"
    how_to:
      - "仰式游進，在仰臥的姿勢下用一隻手觸牆"
      - "觸牆後順著同一個方向，頭往後沉入水裡，腳從上方越過，做一個向後的翻滾，身體縮緊翻得比較快"
      - "頭會倒過來，鼻子容易進水：用上唇輕壓鼻孔，或戴鼻夾"
      - "最後一口氣要在進牆前就吸好；翻完先找準蹬牆的方向，再接蛙式 pullout"
    perception_goal: "倒過來的時候還知道自己的方向，蹬出去是正的。"
    success_signal: "翻得緊、鼻子沒進水、蹬出方向和深度正確。"
    failure_signal: "翻完分不清方向、蹬出偏斜或太深、鼻子嗆水。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 27 章（reverse flip or somersault 的做法與缺點）；觸牆時須仍在仰臥：World Aquatics (2023) SW 9.4 接 SW 6.5"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules]
