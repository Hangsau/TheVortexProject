  - id: ST12
    name_en: "Fatigued Turns"
    name_zh: "疲勞轉身（主課最後幾趟只計轉身品質）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L4, L5]
    abc_type: C
    purpose_zh: "比賽的轉身多半發生在累的時候；主課最後幾趟刻意要求轉身品質，練的是疲勞下不偷工的習慣。"
    how_to:
      - "主課最後三到四趟，和平常一樣游，但每一次轉身都要維持前面精神好時的標準"
      - "標準由教練在課前說清楚，例如進牆不滑行、翻轉時收緊、出牆馬上踢"
      - "教練只記轉身品質，不管這幾趟的總時間；沒達標的轉身記下來，下課時一起看"
      - "水下段保持原本課表上的規定，不因為追求轉身品質而加長水下距離"
    perception_goal: "累的時候轉身仍然是一個完整的動作，不是拿來喘氣的休息站。"
    success_signal: "最後幾趟的轉身與精神好時的轉身看起來一樣。"
    failure_signal: "進牆開始滑行、翻得鬆散、出牆後不踢就開始游。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（轉身需要獨立的體能，練習時偷懶的轉身在比賽中也做不好）"
