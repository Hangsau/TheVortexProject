  - id: ST15
    name_en: "Relay Exchange in Pairs"
    name_zh: "接力交接：兩人一組觀察前一棒最後一划"
    strokes: [starts_turns]
    category: turn
    equipment: [partner]
    l_target: [L4]
    abc_type: C
    purpose_zh: "接力交接的難題是不能比前一棒早離台，又想盡量不浪費時間；兩人一組，練下一棒怎麼讀前一棒最後一划的節奏。"
    how_to:
      - "兩人一組：前一棒游向牆，下一棒站在台上觀察，先不離台，只在心裡預測前一棒什麼時候觸牆"
      - "預測熟了之後，下一棒按自己的預測啟動，但腳必須等到前一棒觸牆才能離開；練習時先把啟動動作做小，不要為了搶時間而提早"
      - "第三人在池邊看並說出：下一棒的腳離台時間比前一棒觸牆早還是晚"
      - "只用來練訓練場上的時間判讀；正式比賽有電子判定，不能用目測當依據"
    perception_goal: "看前一棒最後一划的節奏，就知道自己什麼時候該開始動，而不是看到手碰牆才動。"
    success_signal: "腳離台時間稍晚於前一棒觸牆，沒有提早，且延遲很小。"
    failure_signal: "提早離台、或看到觸牆後才開始動而浪費了時間。"
    deficiency_fixes: []
    source: "通行的接力交接練習形式；交接規則依 World Aquatics 游泳技術規則；其餘為本庫整理"
    source_ids: [src.world-aquatics-2023-swimming-technical-rules]
