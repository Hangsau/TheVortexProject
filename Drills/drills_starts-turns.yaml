    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST28
    name_en: "Breast-to-Free Transition"
    name_zh: "蛙轉自：雙手同時觸牆的開放式轉身，蹬牆轉回俯臥接自由式"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "混合式蛙式接自由式的轉身：觸牆照蛙式規則，掉頭照開放式轉身，蹬出後在水下轉回俯臥接自由式。"
    how_to:
      - "蛙式進牆，雙手分開、同時觸牆"
      - "接開放式旋轉轉身：一手立刻離牆、手肘貼身體在水下往後帶，雙膝收緊，另一手彎肘從頭上越過，頭在轉的時候往後看牆吸氣"
      - "雙腳側向踩牆，蹬牆時轉回俯臥，接水下踢與自由式第一划"
      - "混合式的自由式段要在俯臥游；蹬牆後不要仰著或側著接第一划"
    perception_goal: "觸牆到蹬出是一個連續的旋轉，蹬出後很快就回到趴著的姿勢。"
    success_signal: "雙手同時觸牆、牆上沒有停頓、蹬出後俯臥接第一划。"
    failure_signal: "單手先觸牆、雙手抓牆不放、蹬出時身體還側著就開始划。"
