# Starts & Turns Drills — Vortex
# Percussion layer annotations: Vortex L0–L6 framework (Hangsau 2026)
# 9-axis tag fingerprint v1.0 (2026-06-27): 見 Drills/TAG_SCHEMA.md
# 出發與轉身：核心感知是「翻轉時身體軸線不散、蹬牆瞬間流線最緊、轉體與打水連動」；
# 多屬 C 型（全身張力 / 空間定向），把轉身拆成 接近→執行→出水 三段練。

drills:
  - id: ST1
    name_en: "Mid-Pool Somersault"
    name_zh: "中池翻滾"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L1, L2]
    abc_type: C
    purpose_zh: "離開牆面練翻滾本身，先建立「直線翻過去、不歪斜」的身體定向，再帶到牆邊。"
    how_to:
      - "在池中央俯臥漂浮，雙手放大腿"
      - "打一下緊湊海豚腳、同時把頭往膝蓋帶，腿用力翻過去；手掌前臂從大腿掃到肩膀"
      - "翻完檢查身體是否正對原方向（沒有左右歪）"
    perception_goal: "翻滾是一個緊湊的團身，軸線維持在矢狀面，翻完仍朝原方向。"
    success_signal: "能在原地直線翻過去，不向側邊偏。"
    failure_signal: "翻滾鬆散、身體歪向一側、翻完方向跑掉。"
    deficiency_fixes: []
    source: "U.S. Masters Swimming. Flip Turns: The Complete Guide（翻滾、觸牆、蹬牆與常見錯誤各段）"
    source_ids: [src.usms-flip-turns-complete-guide]
    body_position: transitional
    constraints: []
    movement_pattern: rotational
    skill_focus: [spatial_awareness, core_tension]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: foundation

  - id: ST2
    name_en: "Wall Flip + Foot Plant"
    name_zh: "翻牆踩牆（腳尖朝上）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "把中池翻滾帶到牆邊，只練「翻過去、雙腳穩穩踩上牆、腳尖朝正上方」這一段。"
    how_to:
      - "游近牆，翻滾後把雙腳平貼牆面，腳尖指向正上方（確保翻得正、準備仰躺出去）"
      - "先不蹬出，只確認踩牆位置與身體朝向正確"
      - "穩定後再延伸成蹬牆成仰躺流線"
    perception_goal: "雙腳同時、對稱地踩到牆，腳尖朝上代表翻轉軸線正確。"
    success_signal: "雙腳穩踩牆、腳尖朝上、身體準備好仰躺蹬出。"
    failure_signal: "單腳先到、踩牆位置太高或太低、身體歪斜。"
    deficiency_fixes: []
    source: "U.S. Masters Swimming Faster Flip Turns（wall progression）"
    source_ids: [src.u-s-masters-swimming-faster-flip-turns-wall]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [spatial_awareness, streamline_line]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST3
    name_en: "Streamline Push-Off Distance"
    name_zh: "蹬牆流線測距"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "練蹬牆瞬間把身體鎖成最緊、最窄的流線，用「滑多遠」當客觀回饋。"
    how_to:
      - "蹬牆成流線（雙手交疊鎖住、夾耳、全身拉長），不打水純滑行"
      - "看自己能滑到哪（如旗標、某條池底線），記住距離"
      - "重複，嘗試讓身體更窄更緊以滑更遠"
    perception_goal: "蹬離牆瞬間全身像一支箭，水從身體兩側乾淨滑過，沒有任何鼓出的阻力面。"
    success_signal: "同樣力道下滑行距離增加、感覺水阻變小。"
    failure_signal: "頭抬起、手沒鎖緊、身體鬆開，很快就停。"
    deficiency_fixes: []
    source: "U.S. Masters Swimming Turns guides（tight streamline push-off）"
    source_ids: [src.u-s-masters-swimming-turns-guides-tight-stre]
    body_position: prone
    constraints: [no_arms, no_kick, tension_held]
    movement_pattern: static
    skill_focus: [streamline_line, glide_efficiency]
    stroke_phase: glide
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: pool_floor_visual
    difficulty_tier: intermediate

  - id: ST4
    name_en: "Backstroke Flag Stroke-Count"
    name_zh: "仰式旗下數划手"
    strokes: [starts_turns]
    category: turn
    equipment: [fins]
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "仰式看不到牆，用旗標（公尺制泳池距牆 5 公尺、碼制泳池 5 碼）建立固定划手數，不靠回頭偷看就能準確翻身。"
    how_to:
      - "正常仰式游，經過背泳旗標時開始數划手，記錄到牆需要幾下"
      - "用這個固定划手數，在最後一下轉體翻身，不抬頭偷看"
      - "加蛙鞋以比賽速度測試，校正高速下的划手數"
    perception_goal: "靠固定划手節律就知道牆在哪；轉體在不減速、不偷看的狀態下啟動。"
    success_signal: "用划手數就能準確到牆翻身，不需偷看、不撞牆或撈空。"
    failure_signal: "仍需抬頭看牆、划手數不穩、到牆距離忽遠忽近。"
    deficiency_fixes: []
    source: "Bay, S. (2024). How to Use Backstroke Flags in Swimming. U.S. Masters Swimming.（旗標距牆 5yd/m，划手數因人而異、加蛙鞋要重新校正）"
    source_ids: [src.usms-bay-2024-backstroke-flags]
    body_position: supine
    constraints: [tempo_constrained]
    movement_pattern: continuous
    skill_focus: [spatial_awareness, rhythm_tempo]
    stroke_phase: transition
    drill_function: corrective
    cognitive_load: high
    tactile_anchor: equipment_feedback
    difficulty_tier: advanced

  - id: ST5
    name_en: "Push-and-Rotate Breakout"
    name_zh: "蹬牆轉體出水"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "自由式翻身蹬牆時人是仰／側躺，練在水下邊打水邊旋轉回俯臥，再乾淨接第一次划手。"
    how_to:
      - "翻身蹬牆，蹬出時維持側／仰流線、保持窄而緊"
      - "水下打水，利用腳的擺動帶動身體從背／側轉回俯臥"
      - "在速度仍高時接第一次划手出水（breakout），不先把速度滑掉"
    perception_goal: "旋轉由打水自然帶動、流線全程不散；breakout 接在速度尚高的時點。"
    success_signal: "出水順、無卡頓、轉體中流線維持、銜接划手不減速。"
    failure_signal: "為了轉體鬆開流線、太早浮起、breakout 時明顯減速。"
    deficiency_fixes: []
    source: "Bay, S. (2017). Flip Turn Fundamentals. U.S. Masters Swimming.（原文明寫：轉體要在蹬牆之後，不要在蹬牆前先扭到側身或俯臥）"
    source_ids: [src.bay-2017-usms-flip-turn-fundamentals]
    body_position: transitional
    constraints: []
    movement_pattern: continuous
    skill_focus: [streamline_line, rotation_connection]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: core_tension_internal
    difficulty_tier: advanced

  # === 9-axis gap-fill drills (v1.0, 2026-06-27) ===

  - id: STSpat1
    name_en: "Wall Approach by Sound (Eyes Closed)"
    name_zh: "閉眼靠水聲判斷牆距"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5]
    abc_type: C
    purpose_zh: "閉眼仰式游近牆，靠水反射聲與壁壓變化判斷牆距；ST4 數划手系統的「聽覺進階版」"
    how_to:
      - "（需同伴在牆邊監看，最好戴泳帽防撞）距牆 15 公尺仰式出發"
      - "閉眼游，集中注意力在耳朵聽到的水流回音與牆壓變化"
      - "感覺「快到了」就翻身蹬牆；同伴回報距牆距離"
      - "做 6 次，每次調整對牆距的聽覺判斷"
    perception_goal: "建立純聽覺/觸覺的空間判斷，取代視覺"
    success_signal: "誤差在 30 公分內；翻身不撞牆不撈空"
    failure_signal: "嚴重誤差（>1 公尺）；需要睜眼或撞牆"
    deficiency_fixes: []
    source: "Vortex 整理（高階空間感訓練）"
    body_position: supine
    constraints: [eyes_closed]
    movement_pattern: continuous
    skill_focus: [spatial_awareness, rhythm_tempo]
    stroke_phase: transition
    drill_function: progression
    cognitive_load: high
    tactile_anchor: water_sound
    difficulty_tier: elite

  # === 菁英層仰式出發 drill from The Race Club (v1.1, 2026-06-27) ===

  - id: STEL1
    name_en: "Backstroke Ladder Starts"
    name_zh: "仰式階梯式出發"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5]
    abc_type: C
    purpose_zh: "Race Club 仰式出發階梯式 progression：從池梯最低踏板開始，每組往上一階，安全建立爆發力出發機制"
    how_to:
      - "雙腳放在池梯最低踏板上，雙手抓踏板上方握把"
      - "做 3-5 次完整仰式出發動作（頭往後仰、身體拱起、雙腿爆發蹬離）"
      - "穩定後往上移一階，再做 3-5 次"
      - "逐階往上直到接近正式出發台高度；最終轉到正式出發台"
    perception_goal: "每階高度都能完成乾淨爆發；不依賴蠻力"
    success_signal: "每階都能做出對稱、有力的出發；身體拋物線清晰"
    failure_signal: "蠻力撐起；單腳先離開；身體歪斜"
    deficiency_fixes: []
    source: "The Race Club (Gary Hall Sr) — Fundamentals of Fast Swimming Ch 24 (Backstroke Starts)"
    source_ids: [src.the-race-club-gary-hall-sr-fundamentals-of-f-a]
    body_position: vertical
    constraints: []
    movement_pattern: progressive
    skill_focus: [streamline_line, spatial_awareness]
    stroke_phase: transition
    drill_function: progression
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: elite

  - id: STEL2
    name_en: "Leg Kick Flops"
    name_zh: "仰式出發腿驅動跳"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5, L6]
    abc_type: C
    purpose_zh: "Race Club 仰式出發專項 drill：起跳時雙腿往空中高踢，讓臀部比手先入水，用誇張動作練出入水前更強的腿部上踢"
    how_to:
      - "正常仰式出發姿勢（腳貼牆、抓握把）"
      - "起跳時雙腿往空中高踢，讓臀部先入水，而不是手先入水"
      - "這是刻意誇張的練習，目的是腿部上踢的力量與時機，不是比賽的入水方式"
      - "做 5-10 次，組間休 60 秒；專注腿驅動感"
    perception_goal: "起跳時感覺雙腿往上踢的力量帶動身體，而不是靠手往後甩"
    success_signal: "身體形成乾淨拋物線；入水後仍有強流線"
    failure_signal: "腿沒踢高、手先入水；靠手往後甩帶身體"
    deficiency_fixes: []
    source: "The Race Club — Fundamentals of Fast Swimming Ch 24"
    source_ids: [src.the-race-club-fundamentals-of-fast-swimming-b]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [hip_drive, core_tension]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: elite

  - id: STEL3
    name_en: "Beach Ball Leg Kicks"
    name_zh: "仰式出發踢沙灘球"
    strokes: [starts_turns]
    category: turn
    equipment: [ball, partner]
    l_target: [L5, L6]
    abc_type: C
    purpose_zh: "Race Club 仰式出發感知時機 drill：教練拿沙灘球在游者頭部上方、起跳後算準時間放下，選手要在腳入水前把球踢起，發展腿驅動時機"
    how_to:
      - "同伴或教練站在池邊，把沙灘球拿在水面上方、離牆約兩呎（約 60 公分）、位在游者頭部上方"
      - "游者正常仰式出發；同伴在起跳後算準時間放手讓球落下，游者要在腳入水前把球踢起"
      - "踢到球代表腿伸展時機正確且有足夠爆發力"
      - "需要一點練習才抓得到放球時機；做 5-10 次，每次調整放球時機；組間休 60 秒"
    perception_goal: "出發時腿往上爆發到能踢到球的高度；感覺腿是主驅動"
    success_signal: "能持續踢到球；入水時身體仍流線"
    failure_signal: "踢不到球（腿驅動不夠）；身體入水時拱起"
    deficiency_fixes: []
    source: "The Race Club — Fundamentals of Fast Swimming Ch 24"
    source_ids: [src.the-race-club-fundamentals-of-fast-swimming-b]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [hip_drive, spatial_awareness]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: partner_feedback
    difficulty_tier: elite

  # === 起跳／轉身／破水補強 (2026-10-15) ===

  - id: ST6
    name_en: "Standing Forward Roll (Shallow Water)"
    name_zh: "站立前滾翻（淺水，鼻子吐氣）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L0, L1]
    abc_type: C
    purpose_zh: "在腳踩得到底的淺水區，先熟悉頭朝下翻轉一圈的感覺，並確認整個翻轉過程鼻子能持續吐氣；翻滾轉身學不會，最常見的原因是鼻子進水而不是動作不會。"
    how_to:
      - "選胸口以下的淺水區，吸一口氣，臉入水、鼻子開始緩慢吐氣"
      - "下巴貼胸，雙手在身前撐水，雙腳離地把身體團成一球，向前翻一圈後站起"
      - "整圈都維持鼻子吐氣；先翻一圈就站起，確認不嗆水，再連續翻兩三圈，每圈之間站起來換氣"
      - "鼻子進水或不舒服時立即站起，退回只把臉埋入水中吐氣；可先戴鼻夾或泳鏡，不勉強"
    perception_goal: "翻轉時空氣一直從鼻子出去，水就進不來；頭朝下翻也知道哪裡是上、哪裡是下。"
    success_signal: "連翻數圈不嗆水，起身時方向感還在。"
    failure_signal: "翻到一半憋住氣再嗆到、身體攤開沒有團緊、翻完不知道面向哪裡。"
    deficiency_fixes: []
    source: "通行的前滾翻入門練習形式；本庫未取得可定位的單篇出處"
    source_ids: []
    body_position: standing
    constraints: []
    movement_pattern: rotational
    skill_focus: [breath_rhythm, spatial_awareness]
    stroke_phase: non_stroke
    drill_function: warmup
    cognitive_load: low
    tactile_anchor: pool_floor_visual
    difficulty_tier: foundation

  - id: ST7
    name_en: "Open Turn Breakdown at the Wall"
    name_zh: "開放式轉身分解：觸牆—肘拉—越頂手入水—側蹬"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "把蛙式、蝶式的開放式轉身拆成慢動作，一步一步練到順，目標是在牆上的停留時間越短越好。"
    how_to:
      - "從牆邊約一臂長處慢速游進，雙手同時觸牆（蛙式、蝶式的觸牆規則都要求雙手同時）"
      - "觸牆後一側手立刻離牆，手肘收在身體旁邊貼著水下往後帶；另一手肘彎曲、從頭上越過入水"
      - "雙膝收緊、雙腳疊在一起收到身體下方，兩腳側向踩上牆，腳尖指向轉身的那一側"
      - "先在牆邊做到每一步都清楚，再把動作連起來，最後才加速；每次只盯一個重點（例如這趟只看離牆那隻手）"
    perception_goal: "整個轉身是一個連續動作，頭和上半身貼近水面，腳在水下很快就位。"
    success_signal: "觸牆到雙腳踩牆之間沒有停頓，頭沒有抬到很高。"
    failure_signal: "雙手都抓著牆不放、身體直立抬很高、離牆的手繞到側面太遠。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 26 章 Open Spin Turns（旋轉式開放轉身六個教學重點）"
    source_ids: [src.hall-murphy-2020]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [spatial_awareness, rotation_connection]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST8
    name_en: "Open Spin Away From the Wall"
    name_zh: "離牆水平旋轉練習（一耳貼水面）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L1, L2]
    abc_type: C
    purpose_zh: "先離開牆面練習「水平轉、不立起來」的旋轉，建立旋轉半徑小、頭貼近水面的感覺，再帶回牆邊。"
    how_to:
      - "在池中俯臥漂浮，雙臂前伸，頭放進水裡"
      - "聽到口令後雙膝收向胸口，身體在水面上水平轉半圈，轉的過程中轉動方向那一側的耳朵貼著水面"
      - "轉的時候頭向後轉去換氣，眼睛看向後方的牆或水道邊，不是看向側面"
      - "轉完雙臂回到前伸、身體伸直，再重複；左右兩個方向都要練"
    perception_goal: "身體縮得越小轉得越快；頭和肩膀貼近水面，不往上立起。"
    success_signal: "能在原地很快轉半圈、一耳貼水、換到氣，轉完身體回到水平。"
    failure_signal: "身體往上立起、肩膀一前一後歪斜、轉的時候膝蓋沒有收緊。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 26 章 Open Spin Turns（離牆旋轉練習）"
    source_ids: [src.hall-murphy-2020]
    body_position: prone
    constraints: [no_kick]
    movement_pattern: rotational
    skill_focus: [rotation_connection, breath_rhythm]
    stroke_phase: transition
