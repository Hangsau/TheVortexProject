    cognitive_load: medium
    tactile_anchor: partner_feedback
    difficulty_tier: intermediate

  - id: ST10
    name_en: "Side Push-Off, Rotate to Prone, First Stroke"
    name_zh: "蹬牆側躺、轉俯臥、接第一划"
    strokes: [starts_turns]
    category: turn
    turn_type: [flip, open]
    equipment: [fins]
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "只練轉身的後半段：側身蹬牆後在水下轉回俯臥，並在速度還高時接上第一划。"
    how_to:
      - "一手扶牆、雙腳踩牆，另一手前伸，蹬牆時身體側向（與自己翻滾轉身蹬牆時的側向一致）"
      - "蹬出後立刻打一兩下海豚踢，邊踢邊讓身體轉回俯臥"
      - "身體轉到俯臥後馬上做第一划；水下段不要超過自己能輕鬆完成的距離，不在水下憋到極限"
      - "可先穿蛙鞋練出順序，再脫掉蛙鞋讓整套動作變慢一點，檢查是否還接得上"
    perception_goal: "旋轉發生在離牆之後，由踢腿帶著身體轉；第一划接在速度還沒掉的時候。"
    success_signal: "轉身蹬出後流線沒有散開，第一划接得上、沒有停頓。"
    failure_signal: "還沒離牆就扭成俯臥、轉動時手臂鬆開、轉完才開始想第一划。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（側身蹬牆、三下海豚踢接三划的練習與轉身後半段的教學順序）"
