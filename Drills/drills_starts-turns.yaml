    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: advanced

  - id: ST27
    name_en: "Fly-to-Back Transition"
    name_zh: "蝶轉仰：雙手同時觸牆、不停頓收腿、仰臥蹬出"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "混合式蝶式接仰式的轉身；不用翻滾，是混合式裡最快的一個轉身，時間主要輸在觸牆後的停頓、收腿太慢和多吸一口氣。"
    how_to:
      - "蝶式進牆，雙手分開、同時觸牆"
      - "觸牆的同時開始收腿，不在牆上停下來確認；膝蓋收緊，讓轉動半徑變小"
      - "身體往後倒成仰臥，雙手回到頭上方，雙腳在水下踩牆"
      - "仰臥蹬出成流線，接仰式的水下段與破水；練習時盡量不在牆上多吸一口氣，看自己能不能維持"
    perception_goal: "觸牆和收腿是同一個動作，身體往後倒的時候很快就踩到牆。"
    success_signal: "觸牆後沒有停頓、腳很快踩到牆、仰臥蹬出成流線。"
    failure_signal: "雙手觸牆後停一下才收腿、腿從很遠的地方收回來、在牆上換一大口氣才走。"
    deficiency_fixes: []
    source: "Vortex starts-turns.tech.28、tech.36（Born, Romann & Stöggl 2022：蝶接仰是混合式最快的轉身，三大效率損失是停頓、旋轉慢、換氣）；雙手同時觸牆：World Aquatics (2023) SW 8.4；動作步驟為推導"
    source_ids: [src.born-2022-im, src.world-aquatics-2023-swimming-technical-rules]
    body_position: transitional
