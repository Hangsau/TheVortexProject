# Starts & Turns Drills — Vortex
# Percussion layer annotations: Vortex L0–L6 framework (Hangsau 2026)
# 9-axis tag fingerprint v1.0 (2026-06-27): 見 Drills/TAG_SCHEMA.md
# 出發與轉身：核心感知是「翻轉時身體軸線不散、蹬牆瞬間流線最緊、轉體與打水連動」；
# 多屬 C 型（全身張力 / 空間定向），把轉身拆成 接近→執行→出水 三段練。

drills:
  - id: ST1
    name_en: "Mid-Pool Somersault"
    name_zh: "中池翻滾"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L1, L2]
    abc_type: C
    purpose_zh: "離開牆面練翻滾本身，先建立「直線翻過去、不歪斜」的身體定向，再帶到牆邊。"
    how_to:
      - "在池中央俯臥漂浮，雙手放大腿"
      - "打一下緊湊海豚腳、同時把頭往膝蓋帶，腿用力翻過去；手掌前臂從大腿掃到肩膀"
      - "翻完檢查身體是否正對原方向（沒有左右歪）"
    perception_goal: "翻滾是一個緊湊的團身，軸線維持在矢狀面，翻完仍朝原方向。"
    success_signal: "能在原地直線翻過去，不向側邊偏。"
    failure_signal: "翻滾鬆散、身體歪向一側、翻完方向跑掉。"
    deficiency_fixes: [C]
    source: "U.S. Masters Swimming Faster Flip Turns；EatSleepSwimCoach mid-pool progression"
    source_ids: [src.u-s-masters-swimming-faster-flip-turns-eatsl]
    body_position: transitional
    constraints: []
    movement_pattern: rotational
    skill_focus: [spatial_awareness, core_tension]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: core_tension_internal
    difficulty_tier: foundation

  - id: ST2
    name_en: "Wall Flip + Foot Plant"
    name_zh: "翻牆踩牆（腳尖朝上）"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "把中池翻滾帶到牆邊，只練「翻過去、雙腳穩穩踩上牆、腳尖朝正上方」這一段。"
    how_to:
      - "游近牆，翻滾後把雙腳平貼牆面，腳尖指向正上方（確保翻得正、準備仰躺出去）"
      - "先不蹬出，只確認踩牆位置與身體朝向正確"
      - "穩定後再延伸成蹬牆成仰躺流線"
    perception_goal: "雙腳同時、對稱地踩到牆，腳尖朝上代表翻轉軸線正確。"
    success_signal: "雙腳穩踩牆、腳尖朝上、身體準備好仰躺蹬出。"
    failure_signal: "單腳先到、踩牆位置太高或太低、身體歪斜。"
    deficiency_fixes: [C]
    source: "U.S. Masters Swimming Faster Flip Turns（wall progression）"
    source_ids: [src.u-s-masters-swimming-faster-flip-turns-wall]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [spatial_awareness, streamline_line]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST3
    name_en: "Streamline Push-Off Distance"
    name_zh: "蹬牆流線測距"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L2, L3]
    abc_type: C
    purpose_zh: "練蹬牆瞬間把身體鎖成最緊、最窄的流線，用「滑多遠」當客觀回饋。"
    how_to:
      - "蹬牆成流線（雙手交疊鎖住、夾耳、全身拉長），不打水純滑行"
      - "看自己能滑到哪（如旗標、某條池底線），記住距離"
      - "重複，嘗試讓身體更窄更緊以滑更遠"
    perception_goal: "蹬離牆瞬間全身像一支箭，水從身體兩側乾淨滑過，沒有任何鼓出的阻力面。"
    success_signal: "同樣力道下滑行距離增加、感覺水阻變小。"
    failure_signal: "頭抬起、手沒鎖緊、身體鬆開，很快就停。"
    deficiency_fixes: [C]
    source: "U.S. Masters Swimming Turns guides（tight streamline push-off）"
    source_ids: [src.u-s-masters-swimming-turns-guides-tight-stre]
    body_position: prone
    constraints: [no_arms, no_kick, tension_held]
    movement_pattern: static
    skill_focus: [streamline_line, glide_efficiency]
    stroke_phase: glide
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: pool_floor_visual
    difficulty_tier: intermediate

  - id: ST4
    name_en: "Backstroke Flag Stroke-Count"
    name_zh: "仰式旗下數划手"
    strokes: [starts_turns]
    category: turn
    equipment: [fins]
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "仰式看不到牆，用旗標（距牆 5 公尺）建立固定划手數，不靠回頭偷看就能準確翻身。"
    how_to:
      - "正常仰式游，經過背泳旗標時開始數划手，記錄到牆需要幾下"
      - "用這個固定划手數，在最後一下轉體翻身，不抬頭偷看"
      - "加蛙鞋以比賽速度測試，校正高速下的划手數"
    perception_goal: "靠固定划手節律就知道牆在哪；轉體在不減速、不偷看的狀態下啟動。"
    success_signal: "用划手數就能準確到牆翻身，不需偷看、不撞牆或撈空。"
    failure_signal: "仍需抬頭看牆、划手數不穩、到牆距離忽遠忽近。"
    deficiency_fixes: [C]
    source: "Train Daly 仰式翻身系統；U.S. Masters Swimming（旗標距牆 5yd/m，數划手）"
    source_ids: [src.train-daly-u-s-masters-swimming-5yd-m]
    body_position: supine
    constraints: [tempo_constrained]
    movement_pattern: continuous
    skill_focus: [spatial_awareness, rhythm_tempo]
    stroke_phase: transition
    drill_function: corrective
    cognitive_load: high
    tactile_anchor: equipment_feedback
    difficulty_tier: advanced

  - id: ST5
    name_en: "Push-and-Rotate Breakout"
    name_zh: "蹬牆轉體出水"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "自由式翻身蹬牆時人是仰／側躺，練在水下邊打水邊旋轉回俯臥，再乾淨接第一次划手。"
    how_to:
      - "翻身蹬牆，蹬出時維持側／仰流線、保持窄而緊"
      - "水下打水，利用腳的擺動帶動身體從背／側轉回俯臥"
      - "在速度仍高時接第一次划手出水（breakout），不先把速度滑掉"
    perception_goal: "旋轉由打水自然帶動、流線全程不散；breakout 接在速度尚高的時點。"
    success_signal: "出水順、無卡頓、轉體中流線維持、銜接划手不減速。"
    failure_signal: "為了轉體鬆開流線、太早浮起、breakout 時明顯減速。"
    deficiency_fixes: [C]
    source: "U.S. Masters Swimming Flip Turn Fundamentals（approach/execution/breakout）；arenaswim flip turn drills"
    source_ids: [src.u-s-masters-swimming-flip-turn-fundamentals]
    body_position: transitional
    constraints: []
    movement_pattern: continuous
    skill_focus: [streamline_line, rotation_connection]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: core_tension_internal
    difficulty_tier: advanced

  # === 9-axis gap-fill drills (v1.0, 2026-06-27) ===

  - id: STSpat1
    name_en: "Wall Approach by Sound (Eyes Closed)"
    name_zh: "閉眼靠水聲判斷牆距"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5]
    abc_type: C
    purpose_zh: "閉眼仰式游近牆，靠水反射聲與壁壓變化判斷牆距；ST4 數划手系統的「聽覺進階版」"
    how_to:
      - "（需同伴在牆邊監看，最好戴泳帽防撞）距牆 15 公尺仰式出發"
      - "閉眼游，集中注意力在耳朵聽到的水流回音與牆壓變化"
      - "感覺「快到了」就翻身蹬牆；同伴回報距牆距離"
      - "做 6 次，每次調整對牆距的聽覺判斷"
    perception_goal: "建立純聽覺/觸覺的空間判斷，取代視覺；極限的空間感訓練"
    success_signal: "誤差在 30 公分內；翻身不撞牆不撈空"
    failure_signal: "嚴重誤差（>1 公尺）；需要睜眼或撞牆"
    deficiency_fixes: [C]
    source: "Vortex 整理（高階空間感訓練；類似 paralympic visually impaired tapper system）"
    source_ids: [src.vortex-paralympic-visually-impaired-tapper-s]
    body_position: supine
    constraints: [eyes_closed]
    movement_pattern: continuous
    skill_focus: [spatial_awareness, rhythm_tempo]
    stroke_phase: transition
    drill_function: progression
    cognitive_load: high
    tactile_anchor: water_sound
    difficulty_tier: elite

  # === 菁英層仰式出發 drill from The Race Club (v1.1, 2026-06-27) ===

  - id: STEL1
    name_en: "Backstroke Ladder Starts"
    name_zh: "仰式階梯式出發"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5]
    abc_type: C
    purpose_zh: "Race Club 仰式出發階梯式 progression：從池梯最低踏板開始，每組往上一階，安全建立爆發力出發機制"
    how_to:
      - "雙腳放在池梯最低踏板上，雙手抓踏板上方握把"
      - "做 3-5 次完整仰式出發動作（頭往後仰、身體拱起、雙腿爆發蹬離）"
      - "穩定後往上移一階，再做 3-5 次"
      - "逐階往上直到接近正式出發台高度；最終轉到正式出發台"
    perception_goal: "每階高度都能完成乾淨爆發；不依賴蠻力"
    success_signal: "每階都能做出對稱、有力的出發；身體拋物線清晰"
    failure_signal: "蠻力撐起；單腳先離開；身體歪斜"
    deficiency_fixes: [C]
    source: "The Race Club (Gary Hall Sr) — Fundamentals of Fast Swimming Ch 24 (Backstroke Starts)"
    source_ids: [src.the-race-club-gary-hall-sr-fundamentals-of-f-a]
    body_position: vertical
    constraints: []
    movement_pattern: progressive
    skill_focus: [streamline_line, spatial_awareness]
    stroke_phase: transition
    drill_function: progression
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: elite

  - id: STEL2
    name_en: "Leg Kick Flops"
    name_zh: "仰式出發腿驅動跳"
    strokes: [starts_turns]
    category: turn
    equipment: []
    l_target: [L5, L6]
    abc_type: C
    purpose_zh: "Race Club 仰式出發專項 drill：強調腿/髖往上爆發，不靠手——讓臀部和大腿先離水後手才進入水"
    how_to:
      - "正常仰式出發姿勢（腳貼牆、抓握把）"
      - "出發時專注雙腿往上方爆發推送，讓臀部先離開水面、形成空中拋物線"
      - "手反而是被動跟著走，不主動往後甩"
      - "做 5-10 次，組間休 60 秒；專注腿驅動感"
    perception_goal: "出發時感覺臀部和大腿先飛起；手是被動的"
    success_signal: "身體形成乾淨拋物線；入水後仍有強流線"
    failure_signal: "靠手拉起身體；身體入水時已散"
    deficiency_fixes: [C]
    source: "The Race Club — Fundamentals of Fast Swimming Ch 24"
    source_ids: [src.the-race-club-fundamentals-of-fast-swimming-b]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [hip_drive, core_tension]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: wall_contact
    difficulty_tier: elite

  - id: STEL3
    name_en: "Beach Ball Leg Kicks"
    name_zh: "仰式出發踢沙灘球"
    strokes: [starts_turns]
    category: turn
    equipment: [ball, partner]
    l_target: [L5, L6]
    abc_type: C
    purpose_zh: "Race Club 仰式出發感知時機 drill：教練拿沙灘球懸在出發拋物線高點，選手要在腳入水前剛好踢到球，發展腿驅動時機"
    how_to:
      - "同伴或教練站在池邊，把沙灘球懸在游者出發拋物線的高點（離水面 60-90 公分）"
      - "正常仰式出發，目標是腳在入水前剛好踢到球"
      - "踢到球代表腿伸展時機正確且有足夠爆發力"
      - "做 5-10 次，每次調整球位置；組間休 60 秒"
    perception_goal: "出發時腿往上爆發到能踢到球的高度；感覺腿是主驅動"
    success_signal: "能持續踢到球；入水時身體仍流線"
    failure_signal: "踢不到球（腿驅動不夠）；身體入水時拱起"
    deficiency_fixes: [C]
    source: "The Race Club — Fundamentals of Fast Swimming Ch 24"
    source_ids: [src.the-race-club-fundamentals-of-fast-swimming-b]
    body_position: transitional
    constraints: []
    movement_pattern: pause_pulse
    skill_focus: [hip_drive, spatial_awareness]
    stroke_phase: transition
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: partner_feedback
    difficulty_tier: elite
