  - id: ST30
    name_en: "IM Transition 25s"
    name_zh: "混合式銜接 25：前一式進牆、轉身、下一式破水"
    strokes: [starts_turns]
    category: turn
    turn_type: [im]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "把銜接放在真的換式情境裡練：每趟只練一個銜接，前一式全速進牆、轉身、下一式破水接幾划就停。"
    how_to:
      - "從距牆約 8 公尺開始，用前一式全速進牆（例如蝶式）"
      - "做這個銜接的轉身（蝶轉仰、仰轉蛙、蛙轉自），蹬出接下一式的水下段與破水"
      - "下一式游幾划就停，回到起點做下一趟；每趟只練一個銜接，三個銜接輪流"
      - "練仰轉蛙時固定用同一種轉法（crossover、開放式或背翻），練熟一種再比較"
    perception_goal: "換式的那一刻速度不掉，下一式一出水就是自己的節奏。"
    success_signal: "進牆不減速、轉身符合該式的觸牆規則、下一式破水後馬上接上。"
    failure_signal: "進牆前就放慢、觸牆不合規則（單手觸牆、仰式段觸牆前就趴下）、破水後先停一下才開始游。"
