      - "蹬牆時繼續轉，腳離開牆時已經大致俯臥"
      - "接水下踢與第一划；和一般自由式翻滾輪流練，分清楚兩種踩牆的方向"
    perception_goal: "翻滾的同時就在轉身體，蹬出去不用再仰著或側著找方向。"
