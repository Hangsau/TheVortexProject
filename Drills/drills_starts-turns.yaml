    stroke_phase: transition
    drill_function: pre_main_set
    cognitive_load: high
    tactile_anchor: partner_feedback
    difficulty_tier: advanced

  - id: ST13
    name_en: "Backstroke Flag Count, Roll, One Stroke, Flip"
    name_zh: "仰式旗下計划、翻俯臥一划、翻滾仰躺蹬出"
    strokes: [starts_turns]
    category: turn
    turn_type: [back]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "把仰式翻滾轉身的前半段練成一個連續動作：過旗後數划、翻成俯臥、接一個連續手划、翻滾，蹬出時回到仰臥。"
    how_to:
      - "先確認自己從旗下到牆的划手數（可用仰式旗下數划手那個練習先標定）"
      - "過旗後按划手數游，在預定的那一划翻成俯臥，接一個連續的手划，立刻翻滾"
      - "翻滾後雙腳平踩牆、腳尖朝上，蹬出時身體回到仰臥；轉身過程不能在俯臥時停頓"
      - "先用慢速確認序列，再逐步加到比賽速度；加蛙鞋時划手數會變，要重新標定"
    perception_goal: "翻成俯臥後的動作是連續的，沒有停頓，也不需要抬頭找牆。"
    success_signal: "進牆不撞牆不撈空，翻轉連貫，蹬出時身體是仰臥且腳尖朝上踩牆。"
    failure_signal: "翻成俯臥後停下來滑行、過早翻過去、離牆時已經不是仰臥。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（仰式翻滾轉身的進牆節奏與翻成俯臥的時機）；轉身規則依 World Aquatics 游泳技術規則"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules]
    body_position: transitional
    constraints: []
    movement_pattern: continuous
    skill_focus: [spatial_awareness, rotation_connection]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: equipment_feedback
    difficulty_tier: advanced

  - id: ST14
    name_en: "Finish Touch: Last Five Meters"
    name_zh: "終點觸牆：最後 5 公尺全速、不抬頭、伸長觸牆"
    strokes: [starts_turns]
    category: turn
    turn_type: [finish]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "終點觸牆的功課是進牆時不減速、不抬頭，最後一划接上伸長的觸牆；距離不對時補半划或踢腿，而不是滑行。"
    how_to:
      - "從離牆約 10 公尺處起，最後 5 公尺全速游，頭保持正常姿勢"
      - "自由式與仰式單手伸長觸牆；蛙式與蝶式雙手同時觸牆"
      - "觸牆的那一下是整個動作的一部分，不是游完才補的；觸牆後教練或同伴回報進牆節奏有沒有減速"
      - "發現距離不對時，練習補半划或加踢腿，不做滑行或回頭看牆"
    perception_goal: "最後一划之後手臂自然伸長碰到牆，速度在碰牆的瞬間都還在。"
    success_signal: "最後 5 公尺沒有減速、觸牆時身體伸長、不需要抬頭看牆。"
    failure_signal: "最後一划太短或滑進牆、觸牆前抬頭、蛙蝶式雙手沒有同時到。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（仰式終點與進牆，不減速、不回頭看牆）；各式觸牆規定依 World Aquatics 游泳技術規則"
    source_ids: [src.hall-murphy-2020, src.world-aquatics-2023-swimming-technical-rules]
