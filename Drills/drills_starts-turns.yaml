  - id: ST29
    name_en: "IM Freestyle Flip Turn: Rotate In, Push Off on the Stomach"
    name_zh: "混合式自由式段的翻滾轉身：進牆先側轉、蹬離時回到俯臥"
    strokes: [starts_turns]
