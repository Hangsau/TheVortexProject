    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: medium
    tactile_anchor: wall_contact
    difficulty_tier: intermediate

  - id: ST11
    name_en: "Turn 25"
    name_zh: "轉身 25（中池起動、全速進牆、全速出）"
    strokes: [starts_turns]
    category: turn
    turn_type: [general]
    equipment: []
    l_target: [L3, L4]
    abc_type: C
    purpose_zh: "把轉身當成一個要全力做的環節來練：只計轉身那一段的品質與時間，其餘距離都是為它服務。"
    how_to:
      - "從池中央起動（不從牆上出發），以正常訓練強度游向牆，進牆不減速"
      - "轉身後全力出牆，出牆後游 5 到 10 公尺就停；水下段依規則上限內，遵守安全條件，不勉強憋氣"
      - "每趟回到起點休息，用同一個起點與終點做計時或比較，同伴或教練看進牆、轉身、出牆三段"
      - "每一趟只挑一個要修的重點，例如這趟看進牆有沒有減速"
    perception_goal: "轉身是一個在高速下完成的動作，進牆前不減速、離牆後馬上加速。"
    success_signal: "進牆沒有滑行、轉身沒有停頓、出牆速度比進牆更快。"
    failure_signal: "進牆前就把速度收掉、轉身時休息一下、出牆後才開始用力。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（轉身是比賽中的加速機會，練習時就要全力做；以 8 公尺進出的轉身競賽形式）"
    source_ids: [src.hall-murphy-2020]
    body_position: transitional
    constraints: []
    movement_pattern: continuous
    skill_focus: [rhythm_tempo, spatial_awareness]
    stroke_phase: whole_stroke
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: partner_feedback
    difficulty_tier: advanced

  - id: ST12
    name_en: "Fatigued Turns"
    name_zh: "疲勞轉身（主課最後幾趟只計轉身品質）"
    strokes: [starts_turns]
    category: turn
    turn_type: [general]
    equipment: []
    l_target: [L4, L5]
    abc_type: C
    purpose_zh: "比賽的轉身多半發生在累的時候；主課最後幾趟刻意要求轉身品質，練的是疲勞下不偷工的習慣。"
    how_to:
      - "主課最後三到四趟，和平常一樣游，但每一次轉身都要維持前面精神好時的標準"
      - "標準由教練在課前說清楚，例如進牆不滑行、翻轉時收緊、出牆馬上踢"
      - "教練只記轉身品質，不管這幾趟的總時間；沒達標的轉身記下來，下課時一起看"
      - "水下段保持原本課表上的規定，不因為追求轉身品質而加長水下距離"
    perception_goal: "累的時候轉身仍然是一個完整的動作，不是拿來喘氣的休息站。"
    success_signal: "最後幾趟的轉身與精神好時的轉身看起來一樣。"
    failure_signal: "進牆開始滑行、翻得鬆散、出牆後不踢就開始游。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（轉身需要獨立的體能，練習時偷懶的轉身在比賽中也做不好）"
    source_ids: [src.hall-murphy-2020]
    body_position: transitional
