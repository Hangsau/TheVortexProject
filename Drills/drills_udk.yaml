# Underwater Dolphin Kick Drills — Vortex
# Percussion layer annotations: Vortex L0–L6 framework (Hangsau 2026)
# 9-axis tag fingerprint v1.0 (2026-06-27): 見 Drills/TAG_SCHEMA.md
# 水下海豚腳：以「全身波動由核心發起、腳背末端鞭打」為核心感知；
# 多數 drill 屬 B 型腳感，但 UDK 本質是全身場（L5–L6）的整合輸出。

drills:
  - id: UDK1
    name_en: "Vertical Kicking"
    name_zh: "垂直打水"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L2, L3]
    abc_type: B
    purpose_zh: "直立姿態隔離海豚腳，拿掉浮力這個拐杖，逼出雙向（前後）都要主動推水的打水。"
    how_to:
      - "在深水區直立，雙手抱胸或舉高，靠海豚腳把頭維持在水面或水面附近"
      - "波動由核心（胸-髖）發起，往下傳到大腿、小腿、腳背，前後兩個方向都主動壓水"
      - "10–20 秒一組（撐不到 10 秒就從自己能穩住的秒數開始），組間充分休息；進階可雙手出水增加負荷"
    perception_goal: "感覺水被腳背往兩個方向推，核心像鞭柄、腳背像鞭梢；不是只有膝蓋在踩。"
    success_signal: "頭能穩定維持在水面附近，前後兩個踢向都感覺到水壓。"
    failure_signal: "身體下沉、只靠膝蓋猛踩、單向（只有下踢）有力。"
    deficiency_fixes: []
    source: "垂直打水是通行的教學練習；「兩個方向都要主動推水」一項對得上 Sheaff, A. (2022). How to Do Underwater Kicks. U.S. Masters Swimming."
    source_ids: [src.usms-sheaff-2022-how-to-do-underwater-kicks]
    body_position: vertical
    constraints: [tension_held]
    movement_pattern: static
    skill_focus: [wave_undulation, kick_origin]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: foot_pressure
    difficulty_tier: intermediate

  - id: UDK2
    name_en: "Streamline Kick — Orientation Switch"
    name_zh: "流線打水換面（仰／側／俯）"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [fins]
    l_target: [L4, L5]
    abc_type: B
    purpose_zh: "在同一趟內輪流以仰、側、俯三個身體面打水，檢查波動是否依賴特定身體朝向。"
    how_to:
      - "蹬牆成流線，水下打 4–6 下仰躺打水 → 轉成側身打 4–6 下 → 再轉俯臥打 4–6 下"
      - "保持手臂緊鎖流線、波動幅度一致，只換身體朝向不換節律"
      - "全程在水下、頭在身體線內，浮起前完成換面；一口正常吸氣就出發，不刻意過度換氣，也不為了做完而拉長水下距離"
    perception_goal: "三個朝向的腳背推水感一致；波動由核心發起，不因翻面而散掉。"
    success_signal: "換面後仍維持推進與緊湊流線，速度不明顯掉。"
    failure_signal: "某個朝向（常是俯臥）波動變小或膝蓋代償；換面時流線鬆掉。"
    deficiency_fixes: []
    source: "通行的水下打水練習形式；本庫未取得可定位的單篇出處"
    body_position: transitional
    constraints: [tension_held]
    movement_pattern: alternating
    skill_focus: [wave_undulation, spatial_awareness]
    stroke_phase: non_stroke
    drill_function: progression
    cognitive_load: high
    tactile_anchor: core_tension_internal
    difficulty_tier: advanced

  - id: UDK3
    name_en: "Tethered Max Dolphin Kick"
    name_zh: "繫繩最大努力海豚腳"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [tubing]
    l_target: [L4, L5]
    abc_type: B
    purpose_zh: "用短彈力繩製造阻力，做最大努力打水，發展打水的力量與相位。"
    how_to:
      - "腰繫短彈力繩固定於牆，俯臥或側身水下打水"
      - "4×5 秒最大努力，每組間完全休息（約 60 秒）"
      - "每週 2–3 次；專注維持核心發起的完整波動，不為了用力而變成踩水"
    perception_goal: "阻力下仍能感覺核心→腳背的完整波動傳遞，而非膝蓋孤立發力。"
    success_signal: "繩阻力下身體仍前移、波動完整。"
    failure_signal: "波動塌成純膝蓋踩、髖部不參與。"
    deficiency_fixes: []
    source: "通行的繫繩打水練習形式；組數、休息與每週次數是實務排法，本庫未取得可定位的單篇出處"
    body_position: underwater
    constraints: [tension_held]
    movement_pattern: continuous
    skill_focus: [wave_undulation, kick_origin]
    stroke_phase: non_stroke
    drill_function: progression
    cognitive_load: high
    tactile_anchor: equipment_feedback
    difficulty_tier: elite

  - id: UDK4
    name_en: "Tempo Trainer Kick to Cone"
    name_zh: "節拍器找個人打水頻率"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [tempo_trainer]
    l_target: [L4, L5]
    abc_type: B
    purpose_zh: "用節拍器測試不同打水頻率，找出能最快游到固定距離的個人最佳頻率（非套用統一數字）。"
    how_to:
      - "池底放一個標記（如 15 公尺處），節拍器設不同節奏"
      - "每個頻率水下打到標記，教練計時，比較哪個頻率最快"
      - "高頻不一定快——找的是個人「頻率×幅度」最佳組合"
    perception_goal: "在最佳頻率時，每一下都感覺腳背確實壓到水，波動不被頻率追著跑而變淺。"
    success_signal: "找到一個明顯比其他頻率快的個人節奏。"
    failure_signal: "一味追高頻率使幅度塌掉、推進反而變差。"
    deficiency_fixes: []
    source: "通行的節拍器水下打水練習形式；本庫未取得可定位的單篇出處"
    body_position: underwater
    constraints: [tempo_constrained]
    movement_pattern: continuous
    skill_focus: [rhythm_tempo, kick_amplitude]
    stroke_phase: non_stroke
    drill_function: progression
    cognitive_load: high
    tactile_anchor: equipment_feedback
    difficulty_tier: elite

  - id: UDK5
    name_en: "Race-Tempo Underwater Off the Wall"
    name_zh: "比賽配速水下打水"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L5, L6]
    abc_type: B
    purpose_zh: "把水下打水放回比賽情境：蹬牆後以比賽強度打到旗標再接出水，整合速度與時序。"
    how_to:
      - "蹬牆成流線，以比賽強度水下打水到 10–15 公尺（依規則上限內）"
      - "在接近最高速時乾淨地接第一次划手（breakout），不讓速度先掉"
      - "多數水下打水量以較高強度進行；組間充分恢復維持品質"
    perception_goal: "高強度下仍維持核心發起的波動與緊湊流線；breakout 時機在速度尚高時。"
    success_signal: "出水接划手沒有明顯減速、波動到最後一下仍完整。"
    failure_signal: "後段波動塌掉、太晚或太早出水、breakout 卡頓。"
    deficiency_fixes: []
    source: "通行的比賽節奏水下練習形式；本庫未取得可定位的單篇出處"
    body_position: underwater
    constraints: [tension_held]
    movement_pattern: continuous
    skill_focus: [wave_undulation, rhythm_tempo]
    stroke_phase: transition
    drill_function: skill_integration
    cognitive_load: high
    tactile_anchor: core_tension_internal
    difficulty_tier: elite

  # === 9-axis gap-fill drills (v1.0, 2026-06-27) ===

  - id: UDKEC1
    name_en: "Eyes Closed Vertical Dolphin"
    name_zh: "閉眼垂直蝶腿"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L4]
    abc_type: B
    purpose_zh: "閉眼垂直蝶腿，拿掉視覺平衡後逼出核心軸線的純本體感"
    how_to:
      - "深水區、確認泳道淨空（最好有同伴監看）"
      - "雙手抱胸閉眼做垂直蝶腿，目標是 20 秒不偏不沉"
      - "睜眼確認位置；如果嚴重偏離，先回到睜眼的垂直蝶腿穩住，再試閉眼"
      - "做 4 組，每組間休 30 秒"
    perception_goal: "閉眼後身體軸線完全靠本體感維持；核心是真正的軸"
    success_signal: "20 秒內身體不偏離原點，頭仍接近水面"
    failure_signal: "立刻歪斜或下沉"
    deficiency_fixes: []
    source: "Vortex 整理（vertical kick × proprioception）"
    body_position: vertical
    constraints: [eyes_closed, tension_held]
    movement_pattern: static
    skill_focus: [wave_undulation, core_tension]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: high
    tactile_anchor: water_sound
    difficulty_tier: advanced

  - id: UDKLow1
    name_en: "Surface Dolphin Kick with Snorkel"
    name_zh: "水面呼吸管蝶腿"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [snorkel]
    l_target: [L3]
    abc_type: B
    purpose_zh: "在水面正常呼吸的條件下，感受輕鬆蝶腿的連續節律，作為主項目前的動作準備；一般呼吸管不能在管口浸沒後供氣"
    how_to:
      - "先在能站穩或扶牆的位置熟悉呼吸管；臉入水、管口露出水面，確認能自然呼吸及自行停止"
      - "從水面輕鬆出發，雙手舒適前伸，做小幅連續蝶腿；保持管口在水面上，不接水下潛行"
      - "先做自己能保持正常呼吸與節律的短段，到達自己預定的位置或動作失控就停下；距離及休息依能力調整，不要求游滿 25 公尺"
      - "恢復後可接無呼吸管的水面踢腿或完整游，檢查節律是否保留；進水、呼吸不順或緊張時立即停下，不用憋氣補完"
    perception_goal: "自然呼吸時，仍能感到波動連續傳到腳部，不需用抬頭或大幅踢水找支撐"
    success_signal: "管口保持在水面上，呼吸自然，短段節律可重複"
    failure_signal: "管口反覆浸沒、呼吸不順，或波動幅度越來越大；停止並縮短或退回扶牆練習"
    deficiency_fixes: []
    source: "Vortex 水面操作設計；呼吸管僅供水面呼吸的功能說明：Pollock（2015），DAN。步驟與距離不是該文的訓練處方"
    source_ids: [src.pollock-2015-snorkels-pros-cons]
    body_position: prone
    constraints: []
    movement_pattern: continuous
    skill_focus: [wave_undulation, glide_efficiency]
    stroke_phase: non_stroke
    drill_function: warmup
    cognitive_load: low
    tactile_anchor: equipment_feedback
    difficulty_tier: intermediate

  # === 起跳／轉身／破水補強 (2026-10-15) ===

  - id: UDK6
    name_en: "Side-Lying Dolphin Kick, Observed From the Front"
    name_zh: "側身海豚踢（教練從正面看手擺與腳離線）"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L3, L4]
    abc_type: B
    purpose_zh: "側身水下做海豚踢，教練站在池端從正面往前看，用兩個容易看見的現象判斷打水：手臂左右擺多大，腳離開身體線多遠。"
    how_to:
      - "游者側躺、雙臂鎖成流線，朝教練的方向水下打水；每趟距離短，一口正常吸氣就出發，不過度換氣，有人看著"
      - "教練在池端先只看手：雙手左右擺動的幅度反映髖部彎得多大，書上建議手大約左右擺 6 到 8 英寸（約 15 到 20 公分）"
      - "再只看腳：腳離開身體線的距離代表膝蓋彎得多大，腳離得越遠，減速越多；同時注意每一個踢水循環的速度是否夠快"
      - "每趟只請游者改一個地方（例如手擺小一點），再看下一趟有沒有改變，不一次修兩處"
    perception_goal: "打水是從髖、膝一起收緊的小動作，手臂不大幅擺動，腳不離開身體線太遠。"
    success_signal: "手左右擺動幅度小而穩定、腳貼著身體線上下、節奏夠快。"
    failure_signal: "手左右大幅擺動、膝蓋彎很大、腳遠離身體線、踢一下停一下。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 22 章 Fundamentals of Dolphin Kick（沒有測速儀器時，用側身打水從池端觀察手擺與腳離線）"
    source_ids: [src.hall-murphy-2020]
    body_position: side
    constraints: [tension_held]
    movement_pattern: continuous
    skill_focus: [kick_amplitude, kick_origin]
    stroke_phase: non_stroke
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: partner_feedback
    difficulty_tier: intermediate

  - id: UDK7
    name_en: "Streamline Dolphin Kick on the Back With Fins"
    name_zh: "仰臥流線海豚踢（穿蛙鞋，下踢壓水）"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [fins]
    l_target: [L4, L5]
    abc_type: B
    purpose_zh: "穿蛙鞋仰臥打水，專心感覺鞋底往下壓水的那一下；仰臥時下踢是相對弱的一邊，也是仰式水下段最值得練的一邊。"
    how_to:
      - "穿蛙鞋、仰臥、雙臂流線，蹬牆後水下打水；距離與休息依自己舒服能完成的範圍由教練安排，不要為了做完而勉強憋氣，有人在池邊看著"
      - "正常吸一口氣，不過度換氣；用鼻夾或上唇輕壓鼻孔防止水進鼻子"
      - "專心感覺鞋底往下壓水，下踢和上踢都要用力，而不是只靠上踢"
      - "做不到全程就縮短距離，在中途浮上來即可"
    perception_goal: "鞋底在每一次往下的踢水都壓到水，感覺像踩在水上。"
    success_signal: "仰臥打水速度穩定、下踢與上踢都有力、鼻子沒有進水。"
    failure_signal: "只剩上踢有力、膝蓋彎很大、鼻子進水而中途嗆到。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 22 章（改善上踢的訓練組：仰臥穿蛙鞋水下打水，專心用鞋底壓水）"
    source_ids: [src.hall-murphy-2020]
    body_position: supine
    constraints: [no_breath, tension_held]
    movement_pattern: continuous
    skill_focus: [wave_undulation, kick_amplitude]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: medium
    tactile_anchor: foot_pressure
    difficulty_tier: advanced

  - id: UDK8
    name_en: "With and Without Fins Contrast"
    name_zh: "穿蛙鞋與不穿蛙鞋對照"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: [fins]
    l_target: [L3, L4]
    abc_type: B
    purpose_zh: "同一段距離先穿蛙鞋打、再脫掉蛙鞋打，比較兩種情況下波動的大小和節奏，檢查蛙鞋有沒有讓你偷偷把動作做大。"
    how_to:
      - "同一個距離（例如蹬牆後打到旗標，不超過自己舒服的水下距離），先穿蛙鞋打一趟"
      - "休息後脫掉蛙鞋，以同樣的力道與同樣的距離再打一趟，同伴記錄兩趟的踢數與時間"
      - "比較：脫鞋後踢數有沒有大增、波動有沒有變大或變亂；腳背的感覺在兩種情況下有沒有一致"
      - "不為了追時間而把水下距離拉長；覺得需要換氣就提早浮出"
    perception_goal: "有鞋沒鞋，打水的核心動作是同一個；蛙鞋只是放大，不是替代。"
    success_signal: "脫鞋後節奏與波動形式大致維持，踢數合理增加。"
    failure_signal: "脫鞋後動作塌掉、波動變小或變亂、膝蓋代償。"
    deficiency_fixes: []
    source: "通行的蛙鞋對照練習形式；本庫未取得可定位的單篇出處"
    source_ids: []
    body_position: underwater
    constraints: [no_breath]
    movement_pattern: continuous
    skill_focus: [kick_origin, wave_undulation]
    stroke_phase: non_stroke
    drill_function: corrective
    cognitive_load: medium
    tactile_anchor: equipment_feedback
    difficulty_tier: intermediate

  - id: UDK9
    name_en: "Fixed Distance Kick-Count Ladder"
    name_zh: "固定距離踢數梯（同距離比較用幾踢）"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L4, L5]
    abc_type: B
    purpose_zh: "同一段水下距離，用不同的踢數打完，找出自己「踢數少、速度快、還不吃力」的組合；踢得多不一定比較好。"
    how_to:
      - "選一段固定距離（例如 10 公尺），蹬牆後以特定踢數打完，之後浮出，由同伴計時"
      - "依序換不同踢數（例如 6、8、10 下），每次踢數固定，每一次之間完全休息"
      - "比較哪種踢數最快、感覺最輕；也看踢數太少時是否變成大力踩水"
      - "整個過程只用自己能舒服完成的距離，有人看著，覺得需要換氣就提早浮出"
    perception_goal: "每一踢都壓到水，踢數不是越多越好，而是每一踢都有效。"
    success_signal: "找到一個踢數，時間比別的更快，且結束後不會非常喘。"
    failure_signal: "為了湊踢數而踢得又小又快、或為了減踢數而大力踩水。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（每個人適合的踢數需要個別測試，踢得更多不一定更好）"
    source_ids: [src.hall-murphy-2020]
    body_position: underwater
    constraints: [no_breath]
    movement_pattern: progressive
    skill_focus: [rhythm_tempo, kick_amplitude]
    stroke_phase: non_stroke
    drill_function: progression
    cognitive_load: high
    tactile_anchor: partner_feedback
    difficulty_tier: advanced

  - id: UDK10
    name_en: "Wall-Holding Up-Kick Focus"
    name_zh: "抓池邊海豚踢（只練上踢）"
    strokes: [underwater_dolphin_kick]
    category: kick
    equipment: []
    l_target: [L2, L3]
    abc_type: B
    purpose_zh: "雙手抓住池邊，身體水平，專心把腿往上拉起來的那一下；把上踢單獨拉出來練，不被往前游的動作打斷。"
    how_to:
      - "雙手抓住池邊，臉朝下浮在水面或使用呼吸管，身體保持水平"
      - "專心做上踢：用直一點的腿往上拉，感覺後腿面與腳背把水往上方推"
      - "每次做 10 到 15 秒，中間休息；想到下踢時就放鬆，不要兩邊都用力"
      - "可以改成呼吸管，臉可以一直在水裡；不憋氣，覺得需要時就抬頭換氣"
    perception_goal: "上踢也是推進的一半，不是只讓腿回到上面的動作。"
    success_signal: "上踢時能感覺到水被腿後側往上推，且身體不因此被拉動。"
    failure_signal: "只用膝蓋往上彎、腿後側沒有感覺、動作變成只靠下踢。"
    deficiency_fixes: []
    source: "Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 22 章（上踢不只是回復動作，也能產生推進）；抓池邊的做法是本庫整理，非原書練習"
    source_ids: [src.hall-murphy-2020]
    body_position: prone
    constraints: [no_arms, tension_held]
    movement_pattern: static
    skill_focus: [kick_amplitude, kick_origin]
    stroke_phase: non_stroke
    drill_function: skill_isolation
    cognitive_load: low
    tactile_anchor: foot_pressure
    difficulty_tier: foundation
